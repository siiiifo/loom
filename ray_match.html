<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050302">
<title>RAY - لعبة المطابقة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Cinzel:wght@900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --cream:#fff1cc; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    background:#050302; color:#fff; font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  #bg { position:absolute; inset:0; z-index:0;
    background:radial-gradient(60% 40% at 50% 12%, rgba(150,100,20,.28), transparent 70%),
      radial-gradient(55% 35% at 50% 52%, rgba(90,58,12,.30), transparent 75%),
      radial-gradient(80% 25% at 50% 100%, rgba(226,169,58,.30), transparent 70%),
      linear-gradient(180deg,#0e0804,#040201 50%,#0a0603); }
  #stage { position:absolute; top:0; transform-origin:0 0; z-index:1; }
  #sides { position:absolute; left:0; z-index:1; pointer-events:none; overflow:visible; }
  .sL { -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent); mask-image:linear-gradient(90deg,#000 70%,transparent); }
  .sR { -webkit-mask-image:linear-gradient(270deg,#000 70%,transparent); mask-image:linear-gradient(270deg,#000 70%,transparent); }
  #head { position:absolute; left:0; top:0; width:1024px; height:300px; z-index:5; pointer-events:none; direction:ltr; }
  #frame { position:absolute; left:0; top:0; }
  #crown { position:absolute; left:457px; top:26px; width:110px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(226,169,58,.6)); }
  #ray { position:absolute; left:0; width:1024px; top:80px; text-align:center; font:900 168px/1 Cinzel,Georgia,"Times New Roman",serif; transform:scaleX(.8);
    background:linear-gradient(180deg,#fff4bd,#eab446 50%,#8f5a10); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(226,169,58,.5)); }
  #cnt { position:absolute; left:860px; top:181px; width:118px; height:46px; background:#110d06; display:flex; align-items:center; justify-content:center; direction:ltr; }
  #hdimg { position:absolute; left:0; top:0; -webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent); }
  #cv { font:900 38px/1 "Cairo",system-ui; color:#f3dfb2; text-shadow:0 2px 0 #5a3606; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #cv.pop { animation:pop .25s ease-out; }
  @keyframes pop { 40%{transform:scale(1.2)} }

  .ph { position:relative; filter:drop-shadow(0 0 10px rgba(226,169,58,.35)) drop-shadow(0 6px 8px rgba(0,0,0,.75)); }
  .pl { position:absolute; inset:0; }
  .pl.g1 { background:linear-gradient(180deg,#fff0b0,#e3a735 45%,#8f5a10); }
  .pl.g2 { background:linear-gradient(180deg,#d6a03a,#7a4c0e); }
  .pl.d1 { background:linear-gradient(180deg,#26170b,#0a0605); }
  .dm { position:absolute; top:50%; width:9px; height:9px; margin-top:-4.5px; background:linear-gradient(135deg,#fff0b0,#c8902c); transform:rotate(45deg); }
  .pc { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:18px; direction:ltr; }
  .act { touch-action:manipulation; transition:transform .1s,opacity .2s; }
  .act:active { transform:scale(.97); }
  .act.off { opacity:.4; }
  .act .pc { font:900 42px/1 "Cairo",system-ui; color:var(--cream); text-shadow:0 2px 0 #3a2208; white-space:nowrap; gap:20px; }
  .act b { color:var(--cream); font-weight:900; font-variant-numeric:tabular-nums; }

  #board { position:absolute; z-index:3; left:0; top:0; width:1024px; height:1px; }
  .tile { position:absolute; box-sizing:border-box; border-radius:13px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fffbed,#f6ecd0 60%,#eadcb4);
    box-shadow:inset 0 0 0 2px rgba(255,252,236,.85), 2px 2px 0 #efd590, 5px 5px 0 #cf9f3a, 8px 8px 0 #aa7c22, 10px 11px 0 #6b4510, 6px 18px 22px rgba(0,0,0,.7);
    transition:transform .15s,filter .2s,opacity .3s; touch-action:manipulation; }
  .tile i { font-style:normal; line-height:1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; pointer-events:none; }
  .tile.blk { filter:brightness(.9); }
  .tile.sel { transform:translate(-4px,-6px) scale(1.05); filter:none; box-shadow:inset 0 0 0 2px #fff6d0, 2px 2px 0 #efd590, 5px 5px 0 #cf9f3a, 8px 8px 0 #aa7c22, 10px 11px 0 #6b4510, 0 0 0 5px #ffd25e, 0 0 34px 10px rgba(255,190,60,.8); }
  .tile.hint { animation:hint .55s ease-in-out infinite alternate; filter:none; }
  @keyframes hint { to { box-shadow:inset 0 0 0 2px #fff6d0, 2px 2px 0 #efd590, 5px 5px 0 #cf9f3a, 8px 8px 0 #aa7c22, 10px 11px 0 #6b4510, 0 0 0 5px #7dff9a, 0 0 34px 10px rgba(90,255,140,.8); transform:translateY(-6px); } }
  .tile.shk { animation:shk .3s; }
  @keyframes shk { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .tile.gone { transform:scale(1.35) rotate(6deg); opacity:0; pointer-events:none; }
  .tile.flip { animation:flip .5s; }
  @keyframes flip { 50%{transform:rotateY(90deg) scale(.9)} }

  #foot { position:absolute; left:100px; width:835px; bottom:141px; z-index:6; direction:ltr; display:flex; gap:15px; }
  #ringsvg { position:absolute; left:0; bottom:0; z-index:2; pointer-events:none; -webkit-mask-image:linear-gradient(180deg,transparent,#000 35%); mask-image:linear-gradient(180deg,transparent,#000 35%); }
  #toast { position:absolute; z-index:30; left:50%; top:calc(env(safe-area-inset-top,0px) + 150px); transform:translateX(-50%); background:rgba(20,12,6,.94); border:2px solid #e2a93a; color:var(--cream); border-radius:14px; padding:6px 16px; font-weight:800; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; }

  #cover { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; background:radial-gradient(90% 70% at 50% 45%,rgba(18,8,10,.55),rgba(6,3,5,.93)); }
  #cover[hidden], #cd[hidden] { display:none; }
  #cd { position:absolute; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; background:radial-gradient(90% 70% at 50% 45%,#1a0f06,#050302); }
  #cd .big { direction:ltr; font:900 clamp(80px,28vw,140px)/1 "Cairo",system-ui; color:#ffc93a; text-shadow:0 4px 0 #7a4a08,0 0 28px rgba(255,170,30,.7); }
  #cd .sub { font-size:clamp(16px,4.6vw,22px); font-weight:800; color:var(--cream); text-shadow:0 2px 6px #000; }
  #cover .crown { width:clamp(60px,20vw,92px); filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
  #cover .title { font:900 clamp(38px,12vw,60px)/1.1 "Cairo",system-ui; background:linear-gradient(180deg,#fff4bd,#eab446 55%,#8f5a10); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 #3a2208) drop-shadow(0 6px 12px rgba(0,0,0,.7)); }
  #cover .big { direction:ltr; font:900 clamp(64px,22vw,110px)/1 "Cairo",system-ui; color:#ffc93a; text-shadow:0 4px 0 #7a4a08,0 0 28px rgba(255,170,30,.7); font-variant-numeric:tabular-nums; }
  #cover .sub { font-size:clamp(15px,4.4vw,20px); font-weight:800; color:var(--cream); text-shadow:0 2px 6px #000; line-height:1.7; }
  #cover .rec { color:#7dff9a; font-weight:900; font-size:clamp(16px,4.8vw,22px); text-shadow:0 0 14px rgba(80,255,130,.6); }
</style>
</head>
