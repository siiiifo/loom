<style>
:root{--g1:#ffeaa6;--g2:#e2a93a;--g3:#8a5a12}
html,body{margin:0;height:100%;overflow:hidden;background:#05071a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.pl{background:linear-gradient(180deg,rgba(30,17,12,.93),rgba(9,5,5,.95));border:2px solid var(--g2);border-radius:10px;box-shadow:0 0 12px rgba(226,169,58,.35),inset 0 0 8px #000}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;direction:ltr;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none}
#hud .col{display:flex;flex-direction:column;gap:6px}
#ttl{padding:6px 16px;text-align:center}
#ttl b{display:block;font-size:clamp(18px,5.6vw,26px);font-weight:900}
#ttl i{font:700 13px Georgia,serif;font-style:normal;letter-spacing:2px;color:var(--g2)}
.st{padding:5px 12px;direction:rtl;min-width:110px}
.st small{display:block;color:var(--g2);font-size:11px}
.st span{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
#snd,#wd{pointer-events:auto;padding:5px 12px;font-size:18px;cursor:pointer}
#wd{font-size:13px;font-weight:700;color:#ffb3b3}
#cd{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(5,6,16,.6);font-size:72px;font-weight:900;color:#ffeaa6;text-shadow:0 0 20px #e2a93a}
#hint{padding:8px 14px;font-size:13px;direction:rtl}
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;width:min(92vw,420px);padding:10px 12px 12px;text-align:center;font-size:14px;box-sizing:border-box}
#ctl div{display:flex;direction:ltr;gap:12px;margin-top:8px}
#ctl img{flex:1;min-width:0;width:50%;border-radius:8px;cursor:pointer;touch-action:manipulation}
#ctl img:active{transform:scale(.95);filter:brightness(1.4)}
#end{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(5,6,16,.72)}
#end .pl{padding:22px 30px;text-align:center}
#end h2{margin:0 0 6px;font-size:30px}
#end p{margin:0 0 16px;color:#ddd}
#end button{font:800 18px system-ui,"Segoe UI",Tahoma,sans-serif;padding:10px 26px;border-radius:8px;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));border:0;color:#2a1604}
#ld{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#05071a;font-size:18px}
</style>
</head>

function piano(f,t0,dur,vol,send){const v=vol*(.85+Math.random()*.3);[[1,1],[2,.38],[3,.15],[4,.06]].forEach(([m,a],i)=>{const o=AC.createOscillator(),g=AC.createGain(),d=dur/(1+i*.7);
 o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v*a,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
 o.connect(g);g.connect(musG);if(send)g.connect(dl);o.start(t0);o.stop(t0+d+.05)})}
function tone(f,t0,dur,type,vol,att=.02,send=0,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 o.connect(g);g.connect(dest||musG);if(send)g.connect(dl);o.start(t0);o.stop(t0+dur+.05)}
function noise(t0,dur,vol,hp){const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(MG);s.start(t0)}
function sweep(f0,f1,t0,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+.05)}
function sched(){const e=.5;
 while(nxt<AC.currentTime+1.5){const b=bar%4;
  piano(ROOT[b]*2,nxt,4.2,.16,0);piano(ROOT[b],nxt,4.2,.1,0);
  ARP.forEach((k,i)=>piano(CH[b][k],nxt+i*e,2.6,.055,1));
  MEL[b].forEach((f,i)=>{if(f>0)piano(f,nxt+i*e,3.2,.085,1)});
  nxt+=e*8;bar++}}
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.9;MG.connect(AC.destination);
 musG=AC.createGain();musG.gain.value=.8;musG.connect(MG);
 dl=AC.createDelay();dl.delayTime.value=.43;const fb=AC.createGain();fb.gain.value=.3,w=AC.createGain();w.gain.value=.3;dl.connect(fb);fb.connect(dl);dl.connect(w);w.connect(MG);
 nxt=AC.currentTime+.1;sched();setInterval(sched,400)}
function sfx(n){if(!AC||muted)return;const t=AC.currentTime+.01;
 if(n==='step'){sweep(170,60,t,.14,'sine',.35);noise(t,.05,.05,3000)}
 else if(n==='ok'){tone(659.25,t,.4,'sine',.08,.005,1,MG);tone(987.77,t+.08,.5,'sine',.06,.005,1,MG)}
 else if(n==='crack'){noise(t,.18,.07,1500);sweep(900,500,t,.2,'sine',.05)}
 else if(n==='break'){noise(t,.45,.09,500);sweep(260,70,t,.9,'sine',.1)}
 else if(n==='win')[293.66,369.99,440,587.33,739.99,880].forEach((f,i)=>tone(f,t+i*.13,1.2,'triangle',.16,.01,1,MG));
 else if(n==='lose'){sweep(300,80,t,1.1,'sine',.14)}}
['pointerdown','keydown'].forEach(e=>addEventListener(e,audio));
$('snd').onclick=ev=>{ev.stopPropagation();audio();muted=!muted;MG.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.05);$('snd').textContent=muted?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
const KEY={ArrowLeft:0,ArrowRight:1,ArrowUp:-1,' ':-1,a:0,d:1,w:-1};
addEventListener('keydown',e=>{if(e.key in KEY){e.preventDefault();go(KEY[e.key])}});
$('bl').onclick=()=>go(0);$('br').onclick=()=>go(1);

let sc=1,ox=0,oy=0,cTop='#070b22',cBot='#04060c',last=0;
function rs(){const dpr=Math.min(devicePixelRatio,2),w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;sc=Math.min(w/BW*1.1,h/BH);ox=(w-BW*sc)/2;oy=(h-BH*sc)/2+8;cv.dpr=dpr}
addEventListener('resize',rs);
function start(){rs();
 const c=document.createElement('canvas');c.width=c.height=1;const k=c.getContext('2d');
 k.drawImage(L.bg,0,0,BW,4,0,0,1,1);let p=k.getImageData(0,0,1,1).data;cTop=`rgb(${p[0]},${p[1]},${p[2]})`;
 k.drawImage(L.bg,0,BH-6,BW,6,0,0,1,1);p=k.getImageData(0,0,1,1).data;cBot=`rgb(${p[0]},${p[1]},${p[2]})`;
 requestAnimationFrame(f=>{last=f;loop(f)})}
function glow(x,y,r,col,a){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));cx.fillStyle=g;cx.fillRect(x-r,y-r,2*r,2*r)}
function sprite(n,d,lx,dy=0,al=1,rot=0,sx=1){
 const img=L[n],Hc=340/(d-CZ),k=Hc/360,w=img.width*k*sx,h=img.height*k,x=VX+lx*off(d),y=Y(d)+dy;
 cx.save();cx.globalAlpha=al;cx.translate(x,y);cx.rotate(rot);cx.drawImage(img,-w/2,-h,w,h);cx.restore()}
const WALK=['w1','w2','w4','w5'];
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;const tt=now/1000;
 const rem=Math.ceil((BEGIN-nowMs())/1000);$('cd').style.display=(!demo&&rem>0&&st!=='over')?'flex':'none';if(rem>0)$('cd').textContent=rem;
 const el=st==='over'&&winFlag?elapsed:Math.max(0,(nowMs()-BEGIN)/1000),s=Math.floor(el);$('tm').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 let hop=0,frame='idle';
 if(st==='move'){t+=dt/.55;const k=Math.min(t,1);pos.d=from.d+(to.d-from.d)*k;pos.lx=from.lx+(to.lx-from.lx)*k;
  hop=-Math.sin(k*Math.PI)*26/pos.d;frame=WALK[Math.floor(t*6)%4];if(t>=1)land()}
 else if(st==='crack'){ct+=dt;if(ct>.45)shatter()}
 else if(st==='fall'){ft+=dt;vy+=1500*dt;ay+=vy*dt;frame='arms';if(ft>1.4)respawn()}
 else if(st==='over'&&winFlag)frame='hop';
 shake=Math.max(0,shake-dt);
 CZ+=(Math.max(0,pos.d-.85)-CZ)*Math.min(1,dt*5);
 // draw
 cx.setTransform(1,0,0,1,0,0);cx.globalCompositeOperation='source-over';cx.fillStyle=cTop;cx.fillRect(0,0,cv.width,cv.height);
 cx.fillStyle=cBot;cx.fillRect(0,(oy+BH*sc/2)*cv.dpr,cv.width,cv.height);
 const m=cv.dpr*sc;cx.setTransform(m,0,0,m,ox*cv.dpr+(shake?(Math.random()-.5)*8:0),oy*cv.dpr);
 const z=1+.8*(1-Math.exp(-CZ/6));cx.save();cx.beginPath();cx.rect(0,0,BW,BH);cx.clip();cx.translate(VX,365);cx.scale(z,z);cx.translate(-VX,-365);cx.drawImage(L.bg,0,0);cx.restore();
 let g=cx.createLinearGradient(0,0,0,70);g.addColorStop(0,cTop);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,BW,70);
 g=cx.createLinearGradient(0,BH-70,0,BH);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,cBot);cx.fillStyle=g;cx.fillRect(0,BH-70,BW,70);
 cx.globalCompositeOperation='lighter';
 const fl=.55+.15*Math.sin(tt*11)+.1*Math.sin(tt*17);
 const zp=(x,y)=>[VX+(x-VX)*z,365+(y-365)*z];let q1=zp(85,300),q2=zp(815,295),q3=zp(448,330);glow(q1[0],q1[1],150*z,'rgba(255,140,40,A)',.3*fl);glow(q2[0],q2[1],150*z,'rgba(255,140,40,A)',.3*fl);glow(q3[0],q3[1],120*z,'rgba(255,190,90,A)',.18);
 {const dr=.69-CZ;if(dr>.3){const k=.69/dr;cx.globalAlpha=.9;cx.drawImage(L.logo,VX-130*k,365+495/dr-75*k,260*k,150*k);cx.globalAlpha=1}}
 for(let i=ROWS-1;i>=0;i--)for(let q=0;q<2;q++){if(!tiles[i].alive[q])continue;
  const c=tiles[i].c[q],crack=st==='crack'&&bk[0]===i&&bk[1]===q;
  cx.globalAlpha=.88+.12*Math.sin(tt*2+i);
  if(crack){quad(L['c'+c],i,q,(Math.random()-.5)*5,0);}
  else quad(L['t'+c],i,q)}
 cx.globalAlpha=1;
 for(let j=sh.length-1;j>=0;j--){const p=sh[j];p.vy+=1500*dt;p.y+=p.vy*dt;p.x+=p.vx*dt;p.r+=p.vr*dt;
  if(p.y>BH+200){sh.splice(j,1);continue}
  cx.save();cx.globalAlpha=Math.max(0,1-(p.y-500)/900);cx.translate(p.x+p.w/2,p.y+p.h/2);cx.rotate(p.r);cx.drawImage(p.img,p.sx,p.sy,p.sw,p.sh,-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
 cx.globalCompositeOperation='source-over';
 const br=st==='idle'?1+.008*Math.sin(tt*3):1;
 if(st==='fall')sprite('arms',pos.d,pos.lx,ay,Math.max(0,1-ft/1.4),ft*.6);
 else sprite(frame,pos.d,pos.lx,hop,1,0,br)}
</script>
