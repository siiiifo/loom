function inside(s,u,v){var r=Math.hypot(u,v),t=Math.atan2(v,u),m;
  switch(s){
    case 'hexagram':return inPoly(u,v,TRI1)||inPoly(u,v,TRI2);
    case 'octagram':return inPoly(u,v,SQA)||inPoly(u,v,SQB);
    case 'gear':return (r<(.70+(Math.sin(10*t)>0?.27:0))&&r>.27)||r<.12;
    case 'flower':return r<.30+.69*Math.abs(Math.cos(3*t));
    case 'starring':return inPoly(u,v,STAR)&&r>.2;
    case 'star':return inPoly(u,v,STAR);
    case 'dframe':m=Math.max(Math.abs(u),Math.abs(v));return (m>.76&&m<.99)||(m>.36&&m<.58)||m<.14||(m<.99&&(Math.abs(u)<.06||Math.abs(v)<.06));
    case 'hexring':return (inPoly(u,v,HEX)&&!inPoly(u,v,HEX2))||(inPoly(u,v,HEX3)&&!inPoly(u,v,HEX4))||r<.1;
    case 'mandala':return r<.99&&!(r>.42&&r<.54)&&!(r>.72&&r<.82&&Math.abs(Math.sin(6*t))<.35);
    case 'heart':var x=u*1.15,y=-v*1.18+.12;return Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0;

function shapeMask(s,cols,rows){var m=[];for(var r=0;r<rows;r++){m.push([]);for(var c=0;c<cols;c++)m[r].push(s==='rect'||inside(s,(c+.5)/cols*2-1,(r+.5)/rows*2-1)?1:0);}return m;}

/* ===== مولّد اللوحات (حتمي، من الداخل للخارج، كل لوحة لها حل مضمون) ===== */
function genLayout(shape,cols,rows,seed,maxLen,K,wRay){
  var R=rng(seed),mask=shapeMask(shape,cols,rows),g=[],dist=[],total=0,arrows=[],rays=[],filled=0,free=[],qq=[],r,c,i;
  for(r=0;r<rows;r++){g.push([]);dist.push([]);for(c=0;c<cols;c++){g[r].push(mask[r][c]?-1:-2);dist[r].push(0);if(mask[r][c]){total++;free.push([r,c]);}}}
  function inb(a,b){return a>=0&&b>=0&&a<rows&&b<cols;}
  for(r=0;r<rows;r++)for(c=0;c<cols;c++)if(mask[r][c]){for(i=0;i<4;i++){var nr=r+DIRS[i][0],nc=c+DIRS[i][1];if(!inb(nr,nc)||!mask[nr][nc]){dist[r][c]=1;qq.push([r,c]);break;}}}
  for(var qi=0;qi<qq.length;qi++){var p=qq[qi];for(i=0;i<4;i++){var a=p[0]+DIRS[i][0],b=p[1]+DIRS[i][1];if(inb(a,b)&&mask[a][b]&&!dist[a][b]){dist[a][b]=dist[p[0]][p[1]]+1;qq.push([a,b]);}}}
  var maxd=1;for(r=0;r<rows;r++)for(c=0;c<cols;c++)if(dist[r][c]>maxd)maxd=dist[r][c];
  function walk(pool){
    if(!pool.length)return null;var s=pool[Math.floor(R()*pool.length)],cells=[s],seen={},ln=2+Math.floor(Math.pow(R(),1.3)*(maxLen-1)),ld=null;seen[s[0]*100+s[1]]=1;
    while(cells.length<ln){var h=cells[cells.length-1],opts=[];
      for(var k=0;k<4;k++){var a=h[0]+DIRS[k][0],b=h[1]+DIRS[k][1];if(inb(a,b)&&g[a][b]===-1&&!seen[a*100+b])opts.push(k);}
      if(!opts.length)break;var pk=opts[Math.floor(R()*opts.length)];if(ld!==null&&opts.indexOf(ld)>=0&&R()<.45)pk=ld;
      var nn=[h[0]+DIRS[pk][0],h[1]+DIRS[pk][1]];cells.push(nn);seen[nn[0]*100+nn[1]]=1;ld=pk;}
    if(cells.length<2)return null;
    var A=cells[cells.length-2],B=cells[cells.length-1],d=[B[0]-A[0],B[1]-A[1]],ray=[],rr=B[0]+d[0],cc=B[1]+d[1];
    while(inb(rr,cc)){if(g[rr][cc]>=0||seen[rr*100+cc])return null;ray.push([rr,cc]);rr+=d[0];cc+=d[1];}
    return {cells:cells,d:d,ray:ray};}
  var thrs=[];for(i=maxd;i>=1;i--)thrs.push(i);thrs.push(1);thrs.push(1);
  thrs.forEach(function(thr){
    var pool=free.filter(function(p){return dist[p[0]][p[1]]>=thr;}),miss=0,budget=40+8*pool.length;
    while(pool.length&&miss<budget&&filled/total<.99){
      var best=null,bs=-1;
      for(var k=0;k<K;k++){var w=walk(pool);if(!w)continue;var body={};w.cells.forEach(function(p){body[p[0]*100+p[1]]=1;});
        var sc=0;for(var j=0;j<rays.length;j++){for(var x=0;x<rays[j].length;x++){if(body[rays[j][x][0]*100+rays[j][x][1]]){sc++;break;}}}
        sc+=w.ray.length*wRay+R()*.5;if(sc>bs){bs=sc;best=w;}}
      if(!best){miss+=K;continue;}
      var id=arrows.length;arrows.push({id:id,cells:best.cells,d:best.d,ray:best.ray});rays.push(best.ray);
      best.cells.forEach(function(p){g[p[0]][p[1]]=id;});filled+=best.cells.length;
      pool=pool.filter(function(p){return g[p[0]][p[1]]===-1;});free=free.filter(function(p){return g[p[0]][p[1]]===-1;});
    }});

}
function addRays(Ly){Ly.arrows.forEach(function(a){if(a.ray)return;var h=a.cells[a.cells.length-1],r=h[0]+a.d[0],c=h[1]+a.d[1];a.ray=[];while(r>=0&&c>=0&&r<Ly.rows&&c<Ly.cols){a.ray.push([r,c]);r+=a.d[0];c+=a.d[1];}});}

/* ===== لوحة اللعب (رسم + لمس) ===== */
var cv=$('cv'),ctx=cv.getContext('2d'),st=$('st'),dpr=1,K=1,cs=40,ox=0,oy=0,sc=1,L=null,rem={},occ=null,anims=[],shk={},hintId=-1,hintUntil=0,raf=0;
function buildOcc(){occ=[];for(var r=0;r<L.rows;r++){occ.push([]);for(var c=0;c<L.cols;c++)occ[r].push(-1);}
  L.arrows.forEach(function(a){if(!rem[a.id])a.cells.forEach(function(p){occ[p[0]][p[1]]=a.id;});});}
function isFree(a){for(var i=0;i<a.ray.length;i++){if(occ[a.ray[i][0]][a.ray[i][1]]>=0)return false;}return true;}
function fitBoard(){var pad=10*sc,aw=cv.width-pad*2,ah=cv.height-pad*2;cs=Math.min(aw/L.cols,ah/L.rows);ox=(cv.width-cs*L.cols)/2;oy=(cv.height-cs*L.rows)/2;}
function P(r,c){return [ox+(c+.5)*cs,oy+(r+.5)*cs];}
function lw(){return Math.min(Math.max(1.4*sc,cs*.12),5*sc);}
function tipLen(){return lw()*3.2;}
function drawArrow(pts,d,col,glow){
  var w=lw();ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(col==='K'){var y0=1e9,y1=-1e9;pts.forEach(function(p){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});y1=Math.max(y1,y0+w*4);var gr=ctx.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#2a2a2a');gr.addColorStop(1,'#000');col=gr;}
  else if(col==='R'){col='#d4160a';}
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.shadowColor=glow?'#ff3b2a':'rgba(0,0,0,.18)';ctx.shadowBlur=glow||3*sc;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
  var h=pts[pts.length-1],t=tipLen(),hw=w*1.9,dx=d[1],dy=d[0];
  ctx.beginPath();ctx.moveTo(h[0]+dx*t,h[1]+dy*t);ctx.lineTo(h[0]-dy*hw,h[1]+dx*hw);ctx.lineTo(h[0]+dy*hw,h[1]-dx*hw);ctx.closePath();ctx.fill();ctx.restore();
}
function bodyPts(a){return a.cells.map(function(p){return P(p[0],p[1]);});}
function slice(pts,cum,a,b){var out=[],i;
  function at(s){for(i=1;i<cum.length;i++){if(cum[i]>=s){var f=(s-cum[i-1])/((cum[i]-cum[i-1])||1);return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f,i];}}var l=pts.length-1;return [pts[l][0],pts[l][1],l];}
  var A=at(a),B=at(b);out.push([A[0],A[1]]);for(var k=A[2];k<B[2];k++)out.push(pts[k]);out.push([B[0],B[1]]);return out;}
function draw(now){
  ctx.clearRect(0,0,cv.width,cv.height);if(!L)return false;var busy=false;
  L.arrows.forEach(function(a){
    if(rem[a.id])return;var pts=bodyPts(a),glow=0,col='K',s=shk[a.id];
    var hn=hintId===a.id&&now<hintUntil;if(hn){glow=26*sc;busy=true;}
    if(s){var e=(now-s)/320;if(e<1){var o=Math.sin(e*28)*cs*.12*(1-e);pts=pts.map(function(p){return [p[0]+o,p[1]];});col='R';busy=true;}else delete shk[a.id];}
    if(hn&&Math.sin(now/95)>0)col='R';
    drawArrow(pts,a.d,col,glow);});
  for(var i=anims.length-1;i>=0;i--){var m=anims[i],t=(now-m.t0)/1000,s2=cs*(6*t+60*t*t);
    if(s2>=m.total){anims.splice(i,1);continue;}busy=true;drawArrow(slice(m.pts,m.cum,s2,s2+m.len),m.a.d,'K',0);}
  return busy;
}
function loop(now){raf=0;var busy=draw(now);if(busy||anims.length)need();}
function need(){if(!raf)raf=requestAnimationFrame(loop);}
function distSeg(px,py,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/l)):0;var x=a[0]+dx*t-px,y=a[1]+dy*t-py;return Math.sqrt(x*x+y*y);}
function pick(px,py){var best=null,bd=cs*.62;
  L.arrows.forEach(function(a){if(rem[a.id])return;var pts=bodyPts(a);
    for(var i=0;i<pts.length;i++){var d=i?distSeg(px,py,pts[i-1],pts[i]):Math.hypot(px-pts[0][0],py-pts[0][1]);if(d<bd){bd=d;best=a;}}
    var h=pts[pts.length-1],tl=tipLen(),dd=distSeg(px,py,h,[h[0]+a.d[1]*tl,h[1]+a.d[0]*tl]);if(dd<bd){bd=dd;best=a;}});
  return best;}
function release(a,silent){
  rem[a.id]=1;a.cells.forEach(function(p){occ[p[0]][p[1]]=-1;});if(silent)return;
  var pts=bodyPts(a),n=Math.max(L.rows,L.cols)+a.cells.length+3,h=pts[pts.length-1],all=pts.slice();
  for(var k=1;k<=n;k++)all.push([h[0]+a.d[1]*cs*k,h[1]+a.d[0]*cs*k]);
  var cum=[0];for(var i=1;i<all.length;i++)cum.push(cum[i-1]+Math.hypot(all[i][0]-all[i-1][0],all[i][1]-all[i-1][1]));
  var len=cum[pts.length-1];anims.push({a:a,pts:all,cum:cum,len:len,total:cum[cum.length-1]-len*.2,t0:performance.now()});
}
var tmT=0;function toast(m){var e=$('tt');e.textContent=m;e.classList.add('on');clearTimeout(tmT);tmT=setTimeout(function(){e.classList.remove('on');},1700);}
function showMsg(t,keep){var ms=$('ms');ms.textContent=t;ms.classList.add('on');if(!keep)setTimeout(function(){ms.classList.remove('on');},1300);}
function hearts(n){for(var k=1;k<=3;k++)$('h'+k).classList.toggle('off',k>n);}
/* التخطيط: القالب صورة 941×H وكل عنصر له مستطيل بوحدات التصميم */
var DH=1672,RECTS={};
function place(id,x,y,w,h){var e=$(id);if(!e)return;e.style.left=x*K+'px';e.style.top=y*K+'px';e.style.width=w*K+'px';e.style.height=h*K+'px';}
function layout(){
  var w=Math.min(innerWidth,innerHeight*941/DH),h=w*DH/941;st.style.width=w+'px';st.style.height=h+'px';K=w/941;
  for(var id in RECTS)place(id,RECTS[id][0],RECTS[id][1],RECTS[id][2],RECTS[id][3]);
  for(var id2 in FONTS){var e=$(id2);if(e)e.style.fontSize=FONTS[id2]*K+'px';}
  st.style.fontSize=(K*40)+'px';if(typeof fitBd==='function')fitBd();
  dpr=Math.min(2.5,devicePixelRatio||1);cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);sc=cv.width/874;
  if(L)fitBoard();need();
}
addEventListener('resize',layout);addEventListener('orientationchange',function(){setTimeout(layout,150);});

var DH=1671;
RECTS={bd:[690,94,118,54],hr:[395,88,120,44],zh:[270,1488,402,124],cv:[43,221,856,1228]};
FONTS={ms:44,tt:30};
function fitBd(){var e=$('bd'),n=e.textContent.length;e.style.fontSize=K*Math.min(48,Math.floor(122/(n*.62)))+'px';}
var U=q.get('u'),R=q.get('r'),T=q.get('t'),HOST=q.get('h'),demo=!U||!R||!HOST,API=HOST?('https://'+HOST):'';
var at=3,hu=0,mySt='play',over=false,loaded=false,total=0,alive=0;
function enc(x){return encodeURIComponent(x);}
function qs(x){return '?r='+enc(R)+'&u='+enc(U)+'&t='+enc(T)+(x||'');}
function post(p,b){b=b||{};b.r=R;b.u=U;b.t=T;return fetch(API+p,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function paint(){hearts(at);$('bd').textContent=alive+'/'+total;fitBd();}
function endGame(rm){if(over)return;over=true;var w=rm.winner,t;
  if(rm.status==='won')t=(w&&String(w.uid)===String(U))?'🏆 مبروك! أنت الفائز':'🏁 انتهت اللعبة\nفاز '+((w&&w.name)||'لاعب');
  else t='🏁 انتهت اللعبة\n'+(rm.reason||'');
  showMsg(t,true);hap('ok');}

function applyMe(me){if(!me)return;at=me.at;hu=me.hu;mySt=me.st;paint();
  if(L){L.arrows.forEach(function(a){rem[a.id]=0;});(me.rem||[]).forEach(function(i){rem[i]=1;});buildOcc();L.arrows.forEach(function(a){if(rem[a.id])a.cells.forEach(function(p){occ[p[0]][p[1]]=-1;});});need();}
  if(mySt==='out'&&!over){over=true;showMsg('❌ تم إقصاؤك\nانتهت محاولاتك الثلاث',true);}}
function resync(){if(demo)return;fetch(API+'/arrows/g/state'+qs()).then(function(r){return r.json();}).then(function(j){if(j&&j.ok){applyRoom(j.room);applyMe(j.me);}}).catch(function(){});}

function start(j){setLayout(j.layout);loaded=true;applyRoom(j.room);applyMe(j.me);}
function load(){
  fetch(API+'/arrows/g/state'+qs('&full=1')).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.layout){start(j);setInterval(resync,2500);return;}
    if(j&&j.err==='notstarted'){showMsg('⏳ بانتظار بدء الجولة…',true);setTimeout(function(){$('ms').classList.remove('on');load();},1500);return;}
    showMsg(j&&j.err==='auth'?'⚠️ الرابط غير صالح، افتح اللعبة من البوت':'🏁 هذي الجولة انتهت',true);
  }).catch(function(){toast('تعذّر الاتصال… نعيد المحاولة');setTimeout(load,2500);});}

  e.preventDefault();if(!L||!loaded||over||mySt!=='play')return;var rc=cv.getBoundingClientRect(),px=(e.clientX-rc.left)*cv.width/rc.width,py=(e.clientY-rc.top)*cv.height/rc.height;
  var a=pick(px,py);if(!a)return;var free=isFree(a);
  if(free){release(a);hap('tap');hintId=-1;}else{shk[a.id]=performance.now();hap('no');at=Math.max(0,at-1);hearts(at);}
  need();
  if(demo){if(!free&&at<=0){mySt='out';over=true;showMsg('❌ تم إقصاؤك\nانتهت محاولاتك الثلاث',true);}
    else if(free&&L.arrows.every(function(x){return rem[x.id];})){over=true;showMsg('🏆 مبروك! أنت الفائز',true);}return;}
  post('/arrows/g/act',{a:a.id}).then(function(j){
    if(!j||!j.ok){resync();return;}
    applyRoom(j.room);at=j.at;hearts(at);
    if(j.res==='win'){over=true;showMsg('🏆 مبروك! أنت الفائز',true);hap('ok');}
    else if(j.res==='out'){mySt='out';over=true;showMsg('❌ تم إقصاؤك\nانتهت محاولاتك الثلاث',true);}
    else if(j.res==='slow'||j.res==='dup'||j.res==='bad'||j.res==='closed'||(j.res==='blk'&&free)||(j.res==='rm'&&!free))resync();
  }).catch(function(){toast('تعذّر الاتصال');resync();});
});
$('zh').addEventListener('click',function(){

  if(demo){if(hu>=3){toast('انتهت تلميحاتك');return;}var f=L.arrows.filter(function(a){return !rem[a.id]&&isFree(a);});if(!f.length)return;hintId=f[Math.floor(Math.random()*f.length)].id;hintUntil=performance.now()+4000;hu++;paint();need();return;}
  post('/arrows/g/hint').then(function(j){
    if(j&&j.ok){hintId=j.id;hintUntil=performance.now()+4000;hu=j.hu;paint();need();hap('tap');}
    else toast(j&&j.err==='nohints'?'انتهت تلميحاتك الثلاث':j&&j.err==='nofree'?'ما فيه سهم متاح الحين':'ما قدرت أعطيك تلميح');
  }).catch(function(){toast('تعذّر الاتصال');});});
layout();paint();
if(demo){var sh=q.get('shape')||'hexagram';alive=6;total=6;setLayout(genLayout(sh,23,33,12345,6,16,.8));loaded=true;paint();}
else load();

})();
