<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f658f">
<title>RAY - الطوابق</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    background:#3f658f; color:#fff; font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hud { position:absolute; left:0; right:0; top:0; z-index:5; pointer-events:none; direction:ltr; text-align:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 4.2vh); }
  #ttl { display:flex; align-items:center; justify-content:center; gap:3vw; }
  .ln { width:19vw; height:1px; position:relative; margin-top:3.4vh; }
  .ln.l { background:linear-gradient(90deg,transparent,rgba(255,255,255,.75)); }
  .ln.r { background:linear-gradient(270deg,transparent,rgba(255,255,255,.75)); }
  .ln::after { content:""; position:absolute; top:-2.5px; width:6px; height:6px; background:#f4ead9; transform:rotate(45deg); }
  .ln.l::after { right:-3px; } .ln.r::after { left:-3px; }
  #logo { position:relative; padding-top:2.6vh; }
  #crown { position:absolute; left:50%; top:-.4vh; width:8.5vw; transform:translateX(-50%); filter:drop-shadow(0 0 6px rgba(255,240,210,.8)); }
  #logo span { font-family:"Cinzel","Times New Roman",serif; font-weight:700; font-size:11.5vw; line-height:1; letter-spacing:.01em;
    background:linear-gradient(180deg,#ffffff 10%,#d5d9e4 80%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.55)) drop-shadow(0 2px 3px rgba(20,40,80,.35)); }
  #scw { display:flex; align-items:center; justify-content:center; gap:5vw; margin-top:3.2vh; }
  #scw i { width:7px; height:7px; background:#f4ead9; transform:rotate(45deg) scale(.7); display:block; opacity:.95; }
  #score { font-size:12vw; font-weight:300; line-height:1; min-width:16vw; text-shadow:0 0 14px rgba(255,255,255,.35); transition:transform .12s; }
  #score.pop { transform:scale(1.14); }
  #tmr { height:3vh; font-size:3.6vw; opacity:0; transition:opacity .2s; color:#ffe9b8; margin-top:.8vh; }
  #gem { position:absolute; right:3.5vw; top:calc(env(safe-area-inset-top,0px) + 2.6vh); display:flex; align-items:center; direction:ltr; }
  #gem .pl { position:relative; padding:1.5px; background:linear-gradient(180deg,#e6eefb,#8fa6c6); filter:drop-shadow(0 2px 4px rgba(10,30,60,.4));
    clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%); }
  #gem .in { display:flex; align-items:center; gap:3vw; padding:1.1vh 5vw 1.1vh 4.5vw; min-width:19vw; background:linear-gradient(180deg,rgba(70,104,148,.95),rgba(48,78,120,.95));
    clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%); justify-content:space-between; box-sizing:border-box; }
  #gem svg { width:7vw; height:7vw; filter:drop-shadow(0 0 5px rgba(160,210,255,.8)); }
  #gem b { font-weight:500; font-size:5vw; color:#fff; flex:1; text-align:center; }
  #cover { position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(28,52,88,.42); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); padding:0 7vw; box-sizing:border-box; }
  #cover[hidden] { display:none; }
  #cbox { width:100%; max-width:520px; padding:3.5vh 5vw; border-radius:22px; border:1.5px solid rgba(220,232,250,.55);
    background:linear-gradient(180deg,rgba(80,115,160,.78),rgba(44,72,115,.82)); box-shadow:0 10px 40px rgba(10,25,55,.45), inset 0 0 30px rgba(255,255,255,.08); }
  #cS { font-size:5.2vw; font-weight:700; color:#fff3d9; }
  #cBig { font-size:22vw; font-weight:300; line-height:1.1; text-shadow:0 0 22px rgba(255,255,255,.5); }
  #cH { font-size:4vw; line-height:1.9; color:#e7eefb; font-weight:500; }
  .rec { margin-top:1vh; color:#ffe39a; font-weight:700; font-size:4.6vw; }
  @media (min-width:600px) { #logo span{font-size:70px} #score{font-size:74px} #cS{font-size:26px} #cBig{font-size:120px} #cH{font-size:20px} #crown{width:50px}
    #gem b{font-size:28px} #gem svg{width:38px;height:38px} #tmr{font-size:20px} .rec{font-size:24px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="ttl">
    <div class="ln l"></div>
    <div id="logo">
      <svg id="crown" viewBox="0 0 34 22"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d9c7a3"/></linearGradient></defs>
        <path d="M2 19 L4 6 L11 12 L17 2 L23 12 L30 6 L32 19 Z" fill="url(#cg)"/><circle cx="4" cy="5" r="1.6" fill="#fff"/><circle cx="17" cy="1.8" r="1.6" fill="#fff"/><circle cx="30" cy="5" r="1.6" fill="#fff"/></svg>
      <span>RAY</span>
    </div>
    <div class="ln r"></div>
  </div>
  <div id="scw"><i></i><div id="score">0</div><i></i></div>
  <div id="tmr"></div>
</div>

<div id="gem"><div class="pl"><div class="in">
  <svg viewBox="0 0 24 28"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f6ff"/><stop offset=".5" stop-color="#7dbdf2"/><stop offset="1" stop-color="#3b79c6"/></linearGradient></defs>
    <path d="M12 1 L22 11 L12 27 L2 11 Z" fill="url(#gg)" stroke="#dff0ff" stroke-width="1"/><path d="M2 11 H22 M12 1 L8 11 L12 27 L16 11 Z" fill="none" stroke="rgba(255,255,255,.7)" stroke-width=".8"/></svg>
  <b id="bestv">0</b></div></div></div>

<div id="cover"><div id="cbox"><div id="cS"></div><div id="cBig"></div><div id="cH"></div></div></div>

<script>
(function () {
  // ============================================================
  //  تيليجرام + قفل الصفحة (ما تنزل ولا تنقفل بالحركة)
  // ============================================================
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.enableClosingConfirmation(); } catch (e) {}
    try { tg.setHeaderColor('#3f658f'); tg.setBackgroundColor('#3f658f'); } catch (e) {}
    try { if (tg.lockOrientation) tg.lockOrientation(); } catch (e) {}
  }
  ['touchmove', 'gesturestart', 'gesturechange', 'wheel', 'contextmenu'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  function haptic(k) {
    try { var h = tg && tg.HapticFeedback; if (!h) return;
      if (k === 'miss') h.notificationOccurred('error'); else if (k === 'perfect') h.notificationOccurred('success'); else h.impactOccurred('light'); } catch (e) {}
  }

  // ============================================================
  //  ثوابت اللعبة — لازم تتطابق حرفياً مع register_towers بالبوت
  // ============================================================
  var BW = 300, H = 120, TOL = 10, SPAWN0 = 700, NEXT = 300, MINR = 60, GROW = 24, COMBO_N = 5, CYC = 1200;
  function speed(i) { return Math.min(380 + 10 * i, 640); }
  function offs(seed, i) {
    var M = 4294967296;
    var h = (((seed * 73856093) % M) ^ ((i * 19349663) % M)) >>> 0;
    h = Math.imul(h, 2654435761) >>> 0;
    h = (h ^ (h >>> 15)) >>> 0;
    return h % CYC;
  }
  function posAt(seed, i, tau) {
    var d = Math.floor(speed(i) * tau / 1000);
    var k = (d + offs(seed, i)) % CYC;
    return k < 600 ? k - 300 : 900 - k;
  }
  function newState() { return { lo: [-150, -150], hi: [150, 150], combo: 0 }; }
  // يطبّق ضغطة على البرج: يرجّع miss أو تفاصيل الوضع (يعدّل الحالة st)
  function place(st, i, tau, seed) {
    var ax = (i % 2 === 1) ? 0 : 1, lo = st.lo[ax], hi = st.hi[ax], w = hi - lo;
    var p = posAt(seed, i, tau), ap = Math.abs(p);
    if (ap >= w) return { miss: true, p: p, ax: ax };
    var r = { miss: false, p: p, ax: ax, perfect: false, grown: false, cut: null };
    if (ap <= TOL) {
      r.perfect = true; st.combo++;
      if (st.combo >= COMBO_N) {
        for (var a = 0; a < 2; a++) { var ww = st.hi[a] - st.lo[a], g = Math.min(GROW, BW - ww);
          if (g > 0) { st.lo[a] -= (g >> 1); st.hi[a] += g - (g >> 1); } }
        st.combo = 0; r.grown = true;
      }
    } else {
      st.combo = 0;
      if (p > 0) { r.cut = [hi, hi + p]; st.lo[ax] = lo + p; } else { r.cut = [lo + p, lo]; st.hi[ax] = hi + p; }
    }
    return r;
  }

  // ============================================================
  //  المعطيات
  // ============================================================
  var q = new URLSearchParams(location.search);
  var demo = !q.get('s');
  var seed = parseInt(q.get('s'), 10) || (1000 + ((Math.random() * 9000) | 0));
  var D = Math.max(20, Math.min(600, parseInt(q.get('d'), 10) || 240));
  var beginAt = (parseInt(q.get('b'), 10) || 0) * 1000;
  var bestPrev = Math.max(0, parseInt(q.get('pb'), 10) || 0);
  var skew = 0;
  if (demo) beginAt = Date.now() + 3000;
  function now() { return Date.now() + skew; }
  var $ = function (id) { return document.getElementById(id); };

  var phase = 'wait', floors = 0, perfects = 0, taps = [], st = newState(), S = SPAWN0, sent = false, bestShow = bestPrev;
  var blocks = [], pieces = [], fx = [], texts = [], lastDrop = 0, flash = 0, camH = 0, hoverT = 0;

  // ============================================================
  //  الرسم
  // ============================================================
  var cv = $('cv'), ctx = cv.getContext('2d'), W = 0, HS = 0, dpr = 1, s = 1, anchorY = 0;
  function fit() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    W = Math.max(1, Math.round(cv.clientWidth * dpr)); HS = Math.max(1, Math.round(cv.clientHeight * dpr));
    cv.width = W; cv.height = HS;
    s = Math.min(W * 0.00078, HS * 0.00052); anchorY = HS * 0.56;
  }
  function P(x, z, h) { return [W / 2 + (x - z) * s, anchorY + (x + z) * s * 0.5 - (h - camH) * s]; }
  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  var BLUE = { t: '#7babd4', l: '#3c5b83', r: '#5b80a1' };
  var CREAM = { t: '#efe9df', l: '#b9b4af', r: '#d8d0c8' };
  var PILL = { t: '#5b7599', l: '#364f70', r: '#67819b' };
  function colFor(L) { return (L % 2 === 0) ? BLUE : CREAM; }
  function box(x0, x1, z0, z1, h0, h1, col, alpha, edge) {
    var T = [P(x0, z0, h1), P(x1, z0, h1), P(x1, z1, h1), P(x0, z1, h1)];
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    poly([P(x0, z1, h1), P(x1, z1, h1), P(x1, z1, h0), P(x0, z1, h0)], col.l);
    poly([P(x1, z1, h1), P(x1, z0, h1), P(x1, z0, h0), P(x1, z1, h0)], col.r);
    var g = ctx.createLinearGradient(T[0][0], T[0][1], T[2][0], T[2][1]);
    g.addColorStop(0, col.t); g.addColorStop(1, col.t);
    poly(T, g);
    var a = P(x0, z1, h1), b = P(x1, z1, h1), c = P(x1, z0, h1);
    ctx.strokeStyle = edge || 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1, 1.4 * dpr);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(b[0], P(x1, z1, h0)[1]); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // مكعب بإحداثيات الشاشة (للأعمدة الجانبية)
  function boxPx(cx, cy, rw, rd, th, col, al) {
    ctx.globalAlpha = al; 
    poly([[cx - rw, cy], [cx, cy + rd], [cx, cy + rd + th], [cx - rw, cy + th]], col.l);
    poly([[cx, cy + rd], [cx + rw, cy], [cx + rw, cy + th], [cx, cy + rd + th]], col.r);
    poly([[cx, cy - rd], [cx + rw, cy], [cx, cy + rd], [cx - rw, cy]], col.t);
    ctx.strokeStyle = 'rgba(255,248,235,.8)'; ctx.lineWidth = Math.max(1, 1.5 * dpr);
    ctx.beginPath(); ctx.moveTo(cx - rw, cy); ctx.lineTo(cx, cy + rd); ctx.lineTo(cx + rw, cy); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function plant(cx, cy, sz, al) {
    ctx.globalAlpha = al;
    var cols = ['#2f5256', '#3b6a63', '#284a52', '#456f66'];
    for (var i = 0; i < 6; i++) {
      var a = -Math.PI / 2 + (i - 2.5) * 0.42, L = sz * (1 + (i % 2) * 0.35);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = cols[i % 4]; ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L * 0.34, -L * 0.45, 0, -L); ctx.quadraticCurveTo(-L * 0.34, -L * 0.45, 0, 0); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBg(t) {
    var hz = HS * 0.49;
    var g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#3f668f'); g.addColorStop(.55, '#6a92b2'); g.addColorStop(.88, '#a9bbcb'); g.addColorStop(1, '#bdc0d0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 2);
    // توهج الشمس
    var sx = W * 0.88, sy = hz - HS * 0.035, sr = W * 0.11;
    var rg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 3.2);
    rg.addColorStop(0, 'rgba(255,240,215,.75)'); rg.addColorStop(1, 'rgba(255,240,215,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, hz + 2);
    // غيوم خفيفة تتحرك
    ctx.fillStyle = 'rgba(235,240,250,.22)';
    for (var i = 0; i < 4; i++) {
      var cx = ((t * 6 * dpr * (0.5 + i * 0.25) + i * W * 0.37) % (W * 1.5)) - W * 0.25, cy = HS * (0.17 + i * 0.075);
      ctx.beginPath(); ctx.ellipse(cx, cy, W * (0.16 + i * 0.03), HS * 0.008, -0.08, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = 'rgba(255,246,228,1)'; ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    // جبال
    function mount(col, pts) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, hz);
      for (var k = 0; k < pts.length; k++) ctx.lineTo(W * pts[k][0], hz - HS * pts[k][1]); ctx.lineTo(W, hz); ctx.closePath(); ctx.fill(); }
    mount('#a9b6cf', [[0, .02], [.07, .075], [.2, .035], [.33, .02], [.5, .012]]);
    mount('#97a9c6', [[.05, .008], [.22, .028], [.34, .012]]);
    mount('#a2b0cd', [[.62, .01], [.78, .045], [.9, .06], [1, .045]]);
    mount('#8fa3c4', [[.72, .005], [.84, .022], [1, .03]]);
    // ماء
    var wg = ctx.createLinearGradient(0, hz, 0, HS);
    wg.addColorStop(0, '#b3bed0'); wg.addColorStop(.08, '#7f9fbd'); wg.addColorStop(.35, '#6b92b6'); wg.addColorStop(1, '#5b7b9d');
    ctx.fillStyle = wg; ctx.fillRect(0, hz, W, HS - hz);
    ctx.save(); ctx.beginPath(); ctx.rect(0, hz, W, HS - hz); ctx.clip(); ctx.scale(0.3, 1);
    var rf = ctx.createRadialGradient(sx / 0.3, hz, 0, sx / 0.3, hz, HS * 0.26);
    rf.addColorStop(0, 'rgba(255,238,205,.75)'); rf.addColorStop(.5, 'rgba(255,238,205,.25)'); rf.addColorStop(1, 'rgba(255,238,205,0)');
    ctx.fillStyle = rf; ctx.fillRect(0, hz, W / 0.3, HS * 0.3); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (var j = 0; j < 7; j++) ctx.fillRect(W * (0.05 + j * 0.13), hz + HS * (0.03 + j * 0.055), W * 0.18, Math.max(1, dpr));
    // أعمدة جانبية بنباتات (تنزل ببطء مع ارتفاع البرج)
    var span = HS * 0.8, top0 = hz + HS * 0.03;
    var defs = [[0.0, 0.00, 1], [1.0, 0.37, -1], [0.02, 0.52, 1], [1.0, 0.86, -1]];
    var sh = camH * s * 0.22;
    for (var d = 0; d < defs.length; d++) {
      var y = top0 + ((defs[d][1] * span + sh) % span), fr = (y - top0) / span;
      var rw = W * (0.07 + 0.12 * fr), al = Math.min(1, fr * 6) * 0.98;
      var cx2 = defs[d][0] * W + defs[d][2] * -rw * 0.12;
      boxPx(cx2, y, rw, rw * 0.5, HS, { t: '#d9d9e6', l: '#8294b6', r: '#a9b5cd' }, al);
      if (d % 2 === 0) plant(cx2 - rw * 0.25 * defs[d][2], y - rw * 0.05, rw * 0.5, al);
      else plant(cx2 + rw * 0.2, y - rw * 0.05, rw * 0.42, al);
    }
  }

  function drawTower(t) {
    var pl = Math.max(0, floors - 3);
    // العمود الأوسط
    box(-150, 150, -150, 150, camH - 6000, pl * H, PILL, 1, '#f3e6d8');
    for (var L = pl; L < blocks.length; L++) {
      var b = blocks[L], off = (L === blocks.length - 1) ? lastDrop : 0;
      box(b[0], b[1], b[2], b[3], L * H + off, (L + 1) * H + off, colFor(L));
    }
    // القطع المقصوصة الساقطة
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      box(p.x0, p.x1, p.z0, p.z1, p.L * H - p.y, (p.L + 1) * H - p.y, colFor(p.L), Math.max(0, p.a));
    }
    // البلوك المتحرك (المعلّق فوق البرج)
    if (phase === 'run' && t >= S) {
      var i2 = floors + 1, ax = (i2 % 2 === 1) ? 0 : 1, p0 = posAt(seed, i2, t - S);
      var x0 = st.lo[0], x1 = st.hi[0], z0 = st.lo[1], z1 = st.hi[1];
      if (ax === 0) { x0 += p0; x1 += p0; } else { z0 += p0; z1 += p0; }
      var gap = 0;
      box(x0, x1, z0, z1, floors * H + gap, (floors + 1) * H + gap, colFor(floors));
    } else if (phase === 'wait') {
      var gp = 0;
      box(-150, 150, -150, 150, floors * H + gp, (floors + 1) * H + gp, colFor(floors));
    }
    // لمعة / حلقات
    for (var k = 0; k < fx.length; k++) {
      var f = fx[k], u = 1 - f.life / f.max, c = P((f.x0 + f.x1) / 2, (f.z0 + f.z1) / 2, f.h);
      ctx.strokeStyle = 'rgba(255,248,225,' + (0.9 * (1 - u)) + ')'; ctx.lineWidth = 2.2 * dpr * (1 - u) + 1;
      ctx.beginPath(); ctx.ellipse(c[0], c[1], (f.w * s * (0.9 + u * 1.5)), (f.w * s * (0.45 + u * 0.75)), 0, 0, 7); ctx.stroke();
    }
    // نصوص عائمة
    for (var m = 0; m < texts.length; m++) {
      var tx = texts[m], ta = Math.min(1, tx.life * 2.2);
      ctx.globalAlpha = ta; ctx.fillStyle = tx.col; ctx.textAlign = 'center';
      ctx.font = '700 ' + Math.round(W * 0.05) + 'px Tajawal,system-ui,sans-serif';
      ctx.shadowColor = 'rgba(20,40,80,.6)'; ctx.shadowBlur = 8 * dpr;
      ctx.fillText(tx.s, W / 2, tx.y); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,250,235,' + (flash * 0.3) + ')'; ctx.fillRect(0, 0, W, HS); }
  }

  // ============================================================
  //  واجهة
  // ============================================================
  function setScore() {
    var el = $('score'); el.textContent = floors; el.classList.add('pop'); setTimeout(function () { el.classList.remove('pop'); }, 120);
    if (floors > bestShow) { bestShow = floors; $('bestv').textContent = bestShow; }
  }
  function showCover(sub, big, hint, extra) {
    var cv2 = $('cover'); cv2.hidden = false;
    $('cS').textContent = sub || ''; $('cBig').textContent = big === undefined ? '' : big; $('cH').innerHTML = (hint || '') + (extra || '');
  }
  function encode() {
    var n = taps.length, b = new Uint8Array(2 + n * 3);
    b[0] = n >> 8; b[1] = n & 255;
    for (var i = 0; i < n; i++) { var t = taps[i]; b[2 + i * 3] = (t >> 16) & 255; b[3 + i * 3] = (t >> 8) & 255; b[4 + i * 3] = t & 255; }
    var bin = ''; for (var j = 0; j < b.length; j++) bin += String.fromCharCode(b[j]);
    return 'tw1.' + seed + '.' + btoa(bin);
  }
  function finish(reason) {
    if (phase === 'done') return; phase = 'done';
    var rec = floors > bestPrev && floors > 0;
    setTimeout(function () {
      showCover(reason === 'fall' ? '💥 سقط البرج' : '⏱ انتهى الوقت', floors,
        demo ? 'تجربة فقط: افتح الصفحة من تيليجرام لإرسال النتيجة' : 'جاري إرسال نتيجتك...',
        rec ? '<div class="rec">🏆 رقم قياسي جديد!</div>' : '');
    }, reason === 'fall' ? 650 : 0);
    if (!demo) setTimeout(send, reason === 'fall' ? 1500 : 900);
  }
  function send() {
    if (sent) return; sent = true;
    try { if (tg) tg.disableClosingConfirmation(); } catch (e) {}
    var data = encode();
    if (tg && tg.sendData) tg.sendData(data); else $('cH').textContent = 'افتح الصفحة من تيليجرام لإرسال النتيجة';
  }

  // ============================================================
  //  الضغط
  // ============================================================
  function tap() {
    if (phase !== 'run') return;
    var t = Math.round(now() - beginAt);
    if (t < S + MINR || t > D * 1000) return;
    var i = floors + 1, ax = (i % 2 === 1) ? 0 : 1;
    var before = { lo: st.lo.slice(), hi: st.hi.slice() };
    var res = place(st, i, t - S, seed);
    taps.push(t);
    if (res.miss) {
      var x0 = before.lo[0], x1 = before.hi[0], z0 = before.lo[1], z1 = before.hi[1];
      if (ax === 0) { x0 += res.p; x1 += res.p; } else { z0 += res.p; z1 += res.p; }
      pieces.push({ x0: x0, x1: x1, z0: z0, z1: z1, L: floors, y: 0, vy: 0, a: 1 });
      haptic('miss'); flash = 0.6; finish('fall'); return;
    }
    floors++;
    blocks.push([st.lo[0], st.hi[0], st.lo[1], st.hi[1]]);
    lastDrop = 40; S = t + NEXT; setScore();
    if (res.cut) {
      var p = { x0: st.lo[0], x1: st.hi[0], z0: st.lo[1], z1: st.hi[1], L: floors - 1, y: 0, vy: 0, a: 1 };
      if (ax === 0) { p.x0 = res.cut[0]; p.x1 = res.cut[1]; } else { p.z0 = res.cut[0]; p.z1 = res.cut[1]; }
      pieces.push(p); haptic('tap');
    } else {
      perfects++; haptic('perfect');
      fx.push({ x0: st.lo[0], x1: st.hi[0], z0: st.lo[1], z1: st.hi[1], h: floors * H, w: 220, life: 0.55, max: 0.55 });
      texts.push({ s: res.grown ? '✨ كبر البرج!' : 'مثالي!', y: HS * 0.36, life: 0.9, col: res.grown ? '#ffe39a' : '#ffffff' });
    }
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
  document.addEventListener('pointerdown', function (e) { if (e.target === document.body || e.target === cv) { e.preventDefault(); } });

  // ============================================================
  //  الحلقة الرئيسية
  // ============================================================
  var last = 0;
  function frame(ts) {
    var tm = Date.now(), dt = Math.min(.05, last ? (tm - last) / 1000 : .016); last = tm;
    var t = now() - beginAt; hoverT += dt;
    if (phase === 'wait') {
      var sec = Math.max(0, Math.ceil(-t / 1000));
      if (t >= 0) { phase = 'run'; $('cover').hidden = true; }
      else $('cBig').textContent = sec;
    } else if (phase === 'run') {
      var left = D - t / 1000;
      if (left <= 0) finish('time');
      var tmr = $('tmr'); if (left <= 10 && left > 0) { tmr.style.opacity = 1; tmr.textContent = '⏱ ' + Math.ceil(left); } else tmr.style.opacity = 0;
    }
    camH += (floors * H - camH) * Math.min(1, dt * 6);
    lastDrop = Math.max(0, lastDrop - dt * 3200);
    for (var i = pieces.length - 1; i >= 0; i--) { var p = pieces[i]; p.vy += 3600 * dt; p.y += p.vy * dt; p.a -= dt * 1.2; if (p.a <= 0) pieces.splice(i, 1); }
    for (var k = fx.length - 1; k >= 0; k--) { fx[k].life -= dt; if (fx[k].life <= 0) fx.splice(k, 1); }
    for (var m = texts.length - 1; m >= 0; m--) { texts[m].life -= dt; texts[m].y -= dt * 40 * dpr; if (texts[m].life <= 0) texts.splice(m, 1); }
    flash = Math.max(0, flash - dt * 2.5);
    ctx.clearRect(0, 0, W, HS);
    drawBg(tm / 1000); drawTower(t);
    requestAnimationFrame(frame);
  }

  // ============================================================
  //  التشغيل
  // ============================================================
  $('bestv').textContent = bestPrev;
  showCover('استعد! تبدأ بعد', '', 'ابنِ برجك طبقةً فوق طبقة 🏗<br>اضغط في اللحظة المناسبة لتثبيت الطابق<br>٥ طوابق متتالية بنفس المقاس بالضبط = يكبر الطابق!');
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  fit(); requestAnimationFrame(frame);
  // مزامنة الوقت مع السيرفر (ترويسة Date) مثل فروت نينجا
  if (!demo && beginAt) {
    var t0 = Date.now();
    try {
      fetch(location.pathname + '?_=' + t0, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        var d = r.headers.get('Date');
        if (d) { var t1 = Date.now(); skew = new Date(d).getTime() - (t0 + t1) / 2; }
      }).catch(function () {});
    } catch (e) {}
  }
  if (demo) window.__tw = { place: place, posAt: posAt, offs: offs, newState: newState };
})();
</script>
