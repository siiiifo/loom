<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دايس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0618;--card:#120a2a;--line:#3b1fa8;--tx:#d9ccff;--dim:#7d6bc2;--hi:#8b5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1070,var(--bg) 62%);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px)}
#head{position:relative;z-index:30;display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 0 8px}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.pl .av,.pl .nm{opacity:.6}.pl.on .av,.pl.on .nm{opacity:1}.pl.on .av{box-shadow:0 0 16px var(--hi);border-color:var(--hi)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden;width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#1a0e40;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}
.sc{font-size:26px;font-weight:800;min-width:34px;text-align:center}.vs{font-weight:800;color:var(--hi);font-size:20px}
#info{text-align:center;font-size:14px;color:var(--dim);margin:2px 0 8px;min-height:20px}
#tbl{direction:ltr;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:rgba(18,10,42,.8);overflow:hidden}
.half{padding:4px}.half+.half{border-left:1px solid var(--line)}
.h,.r{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;align-items:center;margin:3px 0}
.h{font-size:12px;color:var(--dim);text-align:center}
.r{border:1px solid #2a1673;border-radius:9px;padding:3px;height:44px}
.v{text-align:center;font-weight:700;color:#9a86ff}
.c{height:34px;border:1px solid #2f1a80;border-radius:7px;background:#05020f;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.c.pot{color:#5b4a99}.c.can{border-color:#5b3fd6}.c.sel{background:#3b1fa8;color:#fff;border-color:var(--hi)}
.lb{width:34px;height:34px;border-radius:8px;background:#e8e4f5;color:#111;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.die{position:relative;aspect-ratio:152/156;background:none;box-shadow:none}
.die img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.die.z img{opacity:.35}
.mini{width:34px;aspect-ratio:72/74}.sm{font-size:12px}
.bon,.tot{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;margin:3px 0;border-radius:9px}
.bon{border:1px solid #2a1673;height:44px}.tot{background:#1a0e40;font-weight:700}
.g{color:#6ddc3c}.y{color:#ffd23c}
#dice{display:flex;justify-content:center;gap:4px;margin:18px 0 10px;direction:ltr}
#dice .die{flex:none;width:17.5vw;max-width:78px;transition:transform .15s,filter .15s}
#dice .die.hold{transform:translateY(-12px);filter:drop-shadow(0 0 7px var(--hi)) drop-shadow(0 0 14px var(--hi))}
#dice .die.rl{animation:sh .12s infinite}@keyframes sh{50%{transform:rotate(14deg) scale(.92)}}
#btns{display:flex;gap:10px}
button{flex:1;height:50px;border-radius:12px;border:1px solid var(--hi);background:linear-gradient(#5230e0,#2b14a0);color:#fff;font-size:18px;font-weight:700;font-family:inherit}
button:disabled{opacity:.35;background:#2a2150;border-color:#4a3d80}
#tm{text-align:center;margin-top:12px;font-size:16px;color:var(--dim)}
#cb{position:relative;z-index:50;display:flex;align-items:center;gap:6px;margin-top:10px;padding:4px 6px;border-top:1px solid #1d1245}
#ci{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#ct{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;padding:10px 0;user-select:text;-webkit-user-select:text}
#ct::placeholder{color:#9aa0b4}
.ib{flex:none;width:44px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:12px}
.ib:active{background:#1a0e40}.ib svg{width:30px;height:30px}
#cv{display:none;position:fixed;inset:0;background:rgba(3,1,12,.74);z-index:40;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#cl{display:none;position:absolute;bottom:100%;left:0;right:0;max-height:min(54vh,400px);overflow-y:auto;padding:6px 0 10px;overscroll-behavior:contain;z-index:45}
.cr{display:flex;align-items:flex-end;gap:8px;margin:9px 10px}.cr.me{flex-direction:row-reverse}
.ca{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:#1a0e40;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.cr.me .ca{border-color:var(--hi)}.ca img{width:100%;height:100%;object-fit:cover;display:block}
.cc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:72%;min-width:0}.cr.me .cc{align-items:flex-end}
.cn{font-size:12px;color:var(--dim);padding:0 6px}
.cm{padding:9px 14px;border-radius:16px;background:linear-gradient(#251552,#190e3d);border:1px solid #33208a;color:#fff;font-size:16px;line-height:1.4;word-break:break-word;box-shadow:0 4px 14px #0007}
.cr.me .cm{background:linear-gradient(#5230e0,#3418a8);border-color:var(--hi)}
.cs{font-size:46px;line-height:1.15}.ce{text-align:center;color:var(--dim);font-size:14px;padding:18px}
#cw{position:relative;flex:none;display:flex}#cu{display:none;position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ff3b5c;color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;font-style:normal}
#sp{display:none;position:absolute;bottom:100%;left:0;right:0;margin-bottom:6px;padding:8px;background:#120a2a;border:1px solid var(--line);border-radius:14px;grid-template-columns:repeat(6,1fr);gap:4px;z-index:60;box-shadow:0 8px 24px #000a}
#sp b{font-size:32px;text-align:center;padding:4px 0;border-radius:10px;font-weight:400;cursor:pointer}#sp b:active{background:#2a1673}
.bub{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;width:max-content;max-width:42vw;min-width:44px;padding:6px 10px;border-radius:12px;background:#e8e4f5;color:#120a2a;font-size:14px;font-weight:600;text-align:center;line-height:1.35;word-break:break-word;z-index:15;animation:pop .18s ease-out;box-shadow:0 4px 14px #0008}
.bub:before{content:"";position:absolute;bottom:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom-color:#e8e4f5}
.bub.st{background:none;box-shadow:none;font-size:44px;padding:0;line-height:1.1}.bub.st:before{display:none}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#ov{z-index:100;position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:26px;font-weight:800;text-align:center;padding:20px}
#ov small{font-size:15px;color:var(--dim);font-weight:400}
</style></head><body>

<div id="dice"></div>
<div id="btns"><button id="bp" disabled>اللعب</button><button id="br" disabled>رمي</button></div>

<div id="cv"></div>

<button class="ib" id="cs" aria-label="ملصقات"><svg viewBox="0 0 24 24" fill="none" stroke="#8791a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 21H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7.5L14.5 21z"/><path d="M21 14.5h-3.5a3 3 0 0 0-3 3V21"/></svg></button>
