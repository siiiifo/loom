.bt svg{width:100%;height:100%;overflow:visible;display:block}
.bt .ring{position:absolute;left:-14%;right:-14%;bottom:-3%;height:9%;border-radius:50%;opacity:0;transition:opacity .2s;
  background:radial-gradient(ellipse,rgba(200,160,255,.9) 0,rgba(190,150,255,.4) 55%,transparent 72%);box-shadow:0 0 0 2px rgba(255,255,255,.55) inset}

.bt.sel .ring,.bt.sel .sp{opacity:1}

.bt.shake{animation:sh .28s}
@keyframes sh{25%{transform:translateX(-4%)}75%{transform:translateX(4%)}}
.stream{position:absolute;border-radius:6px;transform-origin:top;pointer-events:none;z-index:20}
.pill{position:absolute;white-space:nowrap;direction:rtl;display:flex;align-items:center;justify-content:center;gap:.4em;color:#fff;font-weight:800;
  background:linear-gradient(#9a6bff,#5b2fb8);border:3px solid #cdb6ff;border-radius:999px;box-shadow:0 4px 0 #3b1d86,0 0 14px rgba(150,100,255,.6);text-shadow:0 2px 0 #3b1d86}

  background:rgba(43,22,96,.72);backdrop-filter:blur(3px);font-weight:900;text-shadow:0 3px 0 #3b1d86}
#ov.show{display:flex}
#ov b{font-size:var(--big);line-height:1}
#ov small{font-size:var(--sm);font-weight:700;opacity:.92}
@media(prefers-reduced-motion:reduce){.bt,.stream{transition:none!important;animation:none!important}}

<body>
<div id="wrap"><div id="sp"></div>
<div id="stage">
  <div id="hud-t" class="pill">⏱ <span id="tm">00:00</span></div>
  <div id="hud-m" class="pill">↕ <span id="mv">0</span></div>
  <div id="ov"></div>
</div></div>
<script>
(function(){
/* ===== قفل الشاشة: ما ينسحب ولا ينقفل بالسحب لتحت ===== */
var tg=window.Telegram&&Telegram.WebApp;
function lockTg(){
  if(!tg)return;
  try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch(e){}
  try{tg.enableClosingConfirmation&&tg.enableClosingConfirmation();}catch(e){}
}
if(tg){
  try{tg.ready();}catch(e){}
  try{tg.expand();}catch(e){}
  lockTg();
  try{if(tg.requestFullscreen&&(tg.platform==='ios'||tg.platform==='android'))tg.requestFullscreen();}catch(e){}
  try{tg.setHeaderColor&&tg.setHeaderColor('#2f1b66');tg.setBackgroundColor&&tg.setBackgroundColor('#2f1b66');}catch(e){}
  try{tg.onEvent&&tg.onEvent('viewportChanged',lockTg);tg.onEvent&&tg.onEvent('fullscreenChanged',lockTg);}catch(e){}
  setTimeout(lockTg,300);setTimeout(lockTg,1500);
}
/* ثبّت الحاوية على 1px: لو حاول يسحب لتحت يتحرك التمرير الداخلي مو النافذة */
var wrapEl=document.getElementById('wrap');
function pin(){try{if(wrapEl.scrollTop!==1)wrapEl.scrollTop=1;}catch(e){}}
wrapEl.addEventListener('scroll',pin);addEventListener('resize',pin);addEventListener('orientationchange',pin);setTimeout(pin,0);setTimeout(pin,500);
addEventListener('scroll',function(){scrollTo(0,0);});
['touchmove','gesturestart','gesturechange','contextmenu','dblclick'].forEach(function(t){
  document.addEventListener(t,function(e){e.preventDefault();},{passive:false});
});
var Q=new URLSearchParams(location.search);
var SEED=(parseInt(Q.get('s'))||20260101)>>>0;
var K=Math.min(5,Math.max(3,parseInt(Q.get('k'))||5));
var CAP=Math.min(6,Math.max(3,parseInt(Q.get('c'))||5));
var NB=6;
var BEGIN=(parseInt(Q.get('b'))||0)*1000;
var DUR=parseInt(Q.get('d'))||300;
var HOST=(Q.get('h')||'').replace(/[^a-z0-9.\-:]/gi,'');
var TOPIC=(Q.get('r')||'').replace(/[^a-z0-9]/gi,'');
var LAY=315/CAP;
var COLORS=['#ff5fc4','#8d3fe3','#2fa7f6','#ffc21c','#ffb4e9'];
/* ===== مولّد الأرقام (mulberry32) + التوزيع — نسخته بالبوت حرفية (color_sort_module.py) ===== */
function mul(a){return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function top(a){return a[a.length-1];}
function runOf(a){var c=top(a),n=0;for(var i=a.length-1;i>=0&&a[i]===c;i--)n++;return n;}
function solved(b){for(var i=0;i<b.length;i++){var a=b[i];if(!a.length)continue;if(a.length!==CAP)return false;for(var j=1;j<a.length;j++)if(a[j]!==a[0])return false;}return true;}
function deal(seed,k){
  var r=mul(seed),u=[];
  for(var c=0;c<k;c++)for(var q=0;q<CAP;q++)u.push(c);
  for(var i=u.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=u[i];u[i]=u[j];u[j]=t;}
  var b=[];for(var z=0;z<NB;z++)b.push(z<k?u.slice(z*CAP,(z+1)*CAP):[]);
  return b;
}
function moveCount(b,f,t){
  if(f===t||!b[f].length||b[t].length>=CAP)return 0;
  return Math.min(runOf(b[f]),CAP-b[t].length);
}
/* ===== الحالة ===== */
var B=deal(SEED,K),moves=[],sel=-1,busy=false,ended=false,t0=0,sending=false;
function $(i){return document.getElementById(i);}
/* ===== الرسم ===== */
var stage=$('stage'),els=[],pos=[],Sc=1;
var CX=[230,472,712],CY=[657,1137],BW=160,BH=395;
var PATH='M30,24H130V50C130,70 152,72 152,102V362Q152,392 122,392H38Q8,392 8,362V102C8,72 30,70 30,50Z';
function svg(units,i){
  var L='';
  units.forEach(function(c,j){var y=392-LAY*(j+1);
    L+='<rect x="0" y="'+y+'" width="160" height="'+(LAY+1)+'" fill="'+COLORS[c]+'"/><rect x="0" y="'+y+'" width="160" height="6" fill="#fff" opacity=".3"/>';});
  return '<svg viewBox="0 0 160 400" preserveAspectRatio="none"><defs><clipPath id="c'+i+'"><path d="'+PATH+'"/></clipPath>'+
  '<linearGradient id="g'+i+'" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".18" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient></defs>'+
  '<path d="'+PATH+'" fill="rgba(235,222,255,.45)"/>'+
  '<g clip-path="url(#c'+i+')">'+L+'</g>'+
  '<path d="'+PATH+'" fill="url(#g'+i+')"/>'+
  '<rect x="30" y="70" width="9" height="270" rx="4.5" fill="#fff" opacity=".55"/><rect x="122" y="90" width="6" height="200" rx="3" fill="#fff" opacity=".35"/>'+
  '<path d="'+PATH+'" fill="none" stroke="#6c43c9" stroke-width="5" stroke-linejoin="round"/>'+
  '<rect x="20" y="3" width="120" height="25" rx="10" fill="#d8c6fb" stroke="#6c43c9" stroke-width="5"/><rect x="30" y="8" width="100" height="6" rx="3" fill="#fff" opacity=".7"/>'+
  '<ellipse cx="80" cy="388" rx="58" ry="8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/></svg>'+
  '<div class="ring"></div><svg class="sp" viewBox="0 0 40 40"><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M4 22L16 18"/><path d="M8 8L17 14"/><path d="M22 3L24 14"/></g></svg>';
}
function renderBottle(i){
  els[i].innerHTML=svg(B[i],i);
  els[i].classList.toggle('done',B[i].length===CAP&&B[i].every(function(x){return x===B[i][0];}));
  els[i].classList.toggle('sel',sel===i);
}
function renderAll(){for(var i=0;i<NB;i++)renderBottle(i);$('mv').textContent=moves.length;}
function layout(){
  var vw=innerWidth,vh=innerHeight,W=Math.min(vw,vh*941/1672),H=W*1672/941;Sc=W/941;
  stage.style.width=W+'px';stage.style.height=H+'px';
  document.documentElement.style.setProperty('--big',(W*.13)+'px');document.documentElement.style.setProperty('--sm',(W*.045)+'px');
  for(var i=0;i<NB;i++){
    var cx=CX[i%3]*Sc,cy=CY[(i/3)|0]*Sc,w=BW*Sc,h=BH*Sc;
    var e=els[i];e.style.left=(cx-w/2)+'px';e.style.top=(cy-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';
    pos[i]={x:cx,y:cy,w:w,h:h};
  }
  var fs=W*.04;
  function p(id,cx,cy,w,h){var e=$(id);e.style.left=(cx*Sc-w*Sc/2)+'px';e.style.top=(cy*Sc-h*Sc/2)+'px';e.style.width=w*Sc+'px';e.style.height=h*Sc+'px';e.style.fontSize=fs+'px';}
  p('hud-t',340,1425,220,62);p('hud-m',610,1425,170,62);
}
for(var i=0;i<NB;i++){var e=document.createElement('div');e.className='bt';(function(k){e.addEventListener('click',function(){tap(k);});})(i);stage.appendChild(e);els.push(e);}
/* ===== اللعب ===== */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function tap(i){
  if(busy||ended||!started())return;
  if(sel<0){if(B[i].length){sel=i;renderBottle(i);}return;}
  if(sel===i){sel=-1;renderBottle(i);return;}
  var f=sel,n=moveCount(B,f,i);
  if(!n){var old=sel;sel=B[i].length?i:-1;renderBottle(old);renderBottle(i);els[i].classList.remove('shake');void els[i].offsetWidth;if(sel!==i)els[i].classList.add('shake');return;}
  sel=-1;pour(f,i,n);
}
async function pour(f,t,n){
  busy=true;var bf=els[f],pf=pos[f],pt=pos[t],col=COLORS[top(B[f])];
  bf.classList.remove('sel');bf.style.zIndex=10;
  var dir=pt.x>=pf.x?1:-1,ang=dir*62,rad=ang*Math.PI/180,r=pf.h/2;
  var mx=pt.x-dir*pt.w*.1,my=pt.y-pt.h/2-pt.h*.03;
  var cx=mx-Math.sin(rad)*r*.97,cy=my+Math.cos(rad)*r*.97;
  bf.style.transition='transform .3s ease';
  bf.style.transform='translate('+(cx-pf.x)+'px,'+(cy-pf.y)+'px) rotate('+ang+'deg)';
  await sleep(320);
  var surf=pt.y-pt.h/2+(392-LAY*B[t].length)*(pt.h/400);
  var st=document.createElement('div');st.className='stream';st.style.cssText+='background:'+col+';left:'+(mx-4*Sc)+'px;top:'+my+'px;width:'+(9*Sc)+'px;height:'+Math.max(10,surf-my)+'px;transform:scaleY(0);transition:transform .15s linear';
  stage.appendChild(st);void st.offsetWidth;st.style.transform='scaleY(1)';
  await sleep(150+110*n);
  for(var q=0;q<n;q++)B[t].push(B[f].pop());
  moves.push(''+f+t);save();
  renderBottle(f);renderBottle(t);$('mv').textContent=moves.length;
  await sleep(120);
  st.style.transformOrigin='bottom';st.style.transform='scaleY(0)';
  bf.style.transform='';await sleep(300);
  st.remove();bf.style.transition='';bf.style.zIndex='';busy=false;
  if(solved(B))win();
}
/* ===== مزامنة الوقت مع ساعة البوت: الكل يبدأ بنفس اللحظة ===== */
var OFF=0,synced=false;
function now(){return Date.now()+OFF;}
function syncClock(){
  if(!HOST||!BEGIN){synced=true;return Promise.resolve();}
  var best=null,seq=Promise.resolve();
  function one(){
    var a=Date.now();
    return fetch('https://'+HOST+'/time?_='+a,{cache:'no-store'}).then(function(r){return r.text();}).then(function(tx){
      var b=Date.now(),sv=parseFloat(tx),rtt=b-a;
      if(isFinite(sv)&&(best===null||rtt<best.rtt))best={rtt:rtt,off:sv+rtt/2-b};
    }).catch(function(){});
  }
  for(var i=0;i<5;i++)seq=seq.then(one).then(function(){return sleep(120);});
  return Promise.race([seq,sleep(4000)]).then(function(){if(best)OFF=best.off;synced=true;});
}
function started(){return synced&&(!BEGIN||now()>=BEGIN);}
function fmt(s){s=Math.max(0,s|0);return ('0'+((s/60)|0)).slice(-2)+':'+('0'+(s%60)).slice(-2);}
var ov=$('ov');
function showOv(a,b){ov.innerHTML='<b>'+a+'</b><small>'+(b||'')+'</small>';ov.classList.add('show');}
function tick(){
  if(ended)return;
  if(!synced){showOv('…','جاري المزامنة');return;}
  if(!started()){showOv(Math.ceil((BEGIN-now())/1000),'استعد… تبدأ اللعبة');return;}
  if(!t0){t0=BEGIN||now();ov.classList.remove('show');}
  if(restoredSolved&&!sending){restoredSolved=false;win();return;}
  var el=(now()-t0)/1000;$('tm').textContent=fmt(el);
  if(el>=DUR){ended=true;showOv('انتهى الوقت','حظًا أوفر المرة الجاية');}
}
function win(){
  ended=true;sending=true;var el=Math.max(1,Math.round(now()-t0));
  showOv('أحسنت! 👑','أنجزت الترتيب خلال '+fmt(el/1000)+' بـ '+moves.length+' حركة');
  var data='cs1.'+SEED+'.'+moves.join('')+'.'+el;
  setTimeout(function(){
    if(tg&&tg.sendData){try{tg.sendData(data);}catch(e){showOv('تعذّر الإرسال','أعد فتح اللعبة');ended=false;sending=false;}}
    else showOv('فزت! (وضع تجريبي)',moves.length+' حركة');
  },900);
}
/* ===== إشارة انتهاء اللعبة (لما يكمل الفائزون): ntfy + MQTT كنسخة احتياطية ===== */
function stopAll(){
  if(ended||sending)return;ended=true;
  showOv('انتهت اللعبة','تمكّن أحد اللاعبين من الفوز');
}
function enc(s){return Array.prototype.slice.call(new TextEncoder().encode(s));}
function rl(n){var o=[];do{var b=n%128;n=Math.floor(n/128);if(n)b|=128;o.push(b);}while(n);return o;}
function mqttListen(url,topic){
  try{
    var ws=new WebSocket(url,'mqtt');ws.binaryType='arraybuffer';
    ws.onopen=function(){
      var cid=enc('c'+Math.random().toString(36).slice(2,12)),vh=[0,4,77,81,84,84,4,2,0,60],pl=[0,cid.length].concat(cid);
      ws.send(new Uint8Array([0x10].concat(rl(vh.length+pl.length),vh,pl)));
    };
    ws.onmessage=function(ev){
      var a=new Uint8Array(ev.data),i=0;
      while(i<a.length){
        var ty=a[i]>>4,m=1,len=0,k=i+1,bt;
        do{bt=a[k++];len+=(bt&127)*m;m*=128;}while(bt&128&&k<a.length);
        if(ty===2){var tb=enc('rayrelay/'+topic),body=[0,1,0,tb.length].concat(tb,[0]);ws.send(new Uint8Array([0x82].concat(rl(body.length),body)));}
        else if(ty===3){stopAll();}
        i=k+len;
      }
    };
  }catch(e){}
}
function listenEnd(){
  if(!TOPIC)return;
  try{var es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');es.onmessage=function(e){try{if(JSON.parse(e.data).event==='message')stopAll();}catch(_){}};}catch(e){}
  mqttListen('wss://broker.emqx.io:8084/mqtt',TOPIC);
  mqttListen('wss://broker.hivemq.com:8884/mqtt',TOPIC);
}
/* ===== حفظ التقدم: لو سكّر اللعبة وفتحها يكمل من آخر نقلة ===== */
var SK='cs_'+SEED+'_'+BEGIN,restoredSolved=false;
function save(){try{localStorage.setItem(SK,moves.join(''));}catch(e){}}
function restore(){try{
  var s=localStorage.getItem(SK)||'';if(!/^([0-5]{2})*$/.test(s))return;
  var nb=deal(SEED,K),mv=[];
  for(var i=0;i<s.length;i+=2){var f=+s[i],t=+s[i+1],n=moveCount(nb,f,t);
    if(!n)return;for(var q=0;q<n;q++)nb[t].push(nb[f].pop());mv.push(s.substr(i,2));}
  B=nb;moves=mv;restoredSolved=solved(B);}catch(e){}}
restore();
addEventListener('resize',layout);
renderAll();layout();syncClock().then(function(){tick();});
setInterval(tick,250);listenEnd();
})();
</script>
