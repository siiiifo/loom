function tickMines(){if(API_URL&&ST.up&&nowS()>=ST.up.end){syncSoon();return}if(ST.up&&nowS()>=ST.up.end){var i=ST.up.i;ST.mines[i]++;ST.up=null;toast('✅ اكتمل تطوير منجم '+(i+1)+' إلى المستوى '+ST.mines[i]+' — الإنتاج '+fmt(rate())+'/د');updMe()}
 var mp=$('mupt');if(mp&&ST.up)mp.textContent='⏳ جاري التطوير… يتبقى '+mmss(ST.up.end-nowS())}
// ---- الأزرار ----
function act(name){
 if(name==='prot'&&!protOn()){var held=heldLands();if(held.length){protWarn(held,function(){doAct('prot',true)});return}}
 doAct(name,false)}
function protWarn(held,cb){var em={throne:'👑',wonder:'🏛️',oasis:'🌴'};
 var h='<h2>⚠️ تنبيه قبل تفعيل الحماية</h2><div class="sub">الحماية تمنع الهجوم عليك، فتنسحب من الأراضي اللي تحتلها</div><div class="hint warn">'+held.map(function(e){return'• سوف تخسر سيطرتك على <b>'+em[e.type]+' '+esc(e.name)+'</b>'}).join('<br>')+'</div><div class="row2"><button class="btn ghost" id="pNo">إلغاء</button><button class="btn" id="pYes">تفعيل وخسارة السيطرة</button></div>';
 openSheet(h);$('pNo').onclick=closeSheet;$('pYes').onclick=function(){closeSheet();cb()}}
function doAct(name,confirm){
 if(API_URL){fetch(API_URL+'/'+name,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg&&tg.initData?tg.initData:'','X-Mr-Token':TOK},body:JSON.stringify({confirm:!!confirm})}).then(function(r){return r.json()}).then(function(j){if(j.ok){if(j.state)mergeSt(j.state);if(j.gold!=null)gold=j.gold;me.prot=protOn();upd();updMe();toast(j.msg||'تم')}else if(j.needs_confirm){protWarn(j.held.map(function(x){return{type:x.type,name:x.name.replace(/^\S+\s/,'')}}),function(){doAct('prot',true)})}else toast(j.error||'تعذر التنفيذ')}).catch(function(){toast('تعذر الاتصال بالسيرفر')});return}
 var n=nowS();
 if(name==='raid'){if(n-ST.lastRaid<RAID_CD){toast('⏳ غارتك القادمة بعد '+hms(RAID_CD-(n-ST.lastRaid)));return}
  var g=RAID_MIN+Math.floor(Math.random()*(RAID_MAX-RAID_MIN+1));ST.streak=(ST.lastRaid>0&&n-ST.lastRaid<=RAID_GAP)?ST.streak+1:1;ST.lastRaid=n;gold+=g;dtBump('raid');dtSet('raid_streak',Math.min(ST.streak,RAID_TARGET));addReport({type:'raid',title:'غارة ناجحة',win:true,loot:g,rows:[['الغنيمة',fmt(g)],['السلسلة',ST.streak+'/'+RAID_TARGET]]});
  toast('⚔️ غارة ناجحة! غنمت '+fmt(g)+' ذهب'+(ST.streak>=RAID_TARGET?' — أكملت سلسلة الغارات 🔥':' · سلسلة '+ST.streak+'/'+RAID_TARGET))}
 else if(name==='gift'){if(n-ST.lastGift<GIFT_CD){toast('⏳ العودة بعد '+hms(GIFT_CD-(n-ST.lastGift)));return}ST.lastGift=n;gold+=GIFT_GOLD;toast('🎁 هدية الممالك! +'+fmt(GIFT_GOLD)+' ذهب')}
 else{if(protOn()){ST.protUntil=0;toast('🔓 تم فك الحماية، أنت الحين عرضة للهجوم')}
  else{if(ST.lastProt&&n-ST.lastProt<PROT_CD_H*3600){toast('⏳ الحماية متاحة بعد '+hms(PROT_CD_H*3600-(n-ST.lastProt)));return}
   var lost=heldLands().map(function(e){e.holder=null;return e.name});ST.protUntil=n+PROT_H*3600;ST.lastProt=n;
   toast('🛡️ تم تفعيل الحماية '+PROT_H+' ساعات'+(lost.length?' — وخسرت سيطرتك على: '+lost.join('، '):''))}}
 me.prot=protOn();upd();updMe()}
setInterval(function(){updRT();tickMines();bunkerTick();if(API_URL&&INC.length)renderAlert();if(API_URL&&RLY.length)renderRallyBar();updMe();if(!API_URL){gold+=rate()/60;upd()}},1000);
var nb=document.querySelectorAll('.nav button');for(var ni=0;ni<nb.length;ni++)(function(b){b.onclick=function(){setTab(b.dataset.t)}})(nb[ni]);
loadAssets(function(){IMGS.gray1=recolor(IMGS.castle_blue2,gray);IMGS.gray2=recolor(IMGS.castle_green2,gray);IMGS.gray3=recolor(IMGS.castle_red2,gray);IMGS.wonder=recolor(IMGS.throne,hueShift);
 function go(s){assign();if(!API_URL){ents.forEach(function(e){if(e.type==='k'){e.loot=Math.round(rnd()*9e7);e.atk=Math.round(e.power*(.7+rnd()*.7));e.def=Math.round(e.power*(.8+rnd()*1.3));if(e.me){e.gold=gold;e.atk=myPow();e.def=myDef();e.ally=5;e.leader=true}}});
  var pl=players();ents.forEach(function(e){if(e.id==='throne')e.holder=pl[1].id;if(e.id==='o0')e.holder='me';if(e.id==='o1')e.holder=pl[4].id})}
  makeDecor();DL=ents.concat(decor).sort(function(a,b){return(a.y+a.hh)-(b.y+b.hh)});terrain=makeTerrain();addEventListener('resize',resize);resize();
  if(s)applyState(s);upd();center(me,.8);requestAnimationFrame(draw);if(API_URL){syncReports();syncMarches();syncRally();startPoll()}}
 if(API_URL)bootApi(go);else go()});
})();
</script>
