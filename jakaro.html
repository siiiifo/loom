<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAY JAKAROO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050301;color:#f6e3b4;font:14px system-ui,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:#050301}
#stage{position:relative;overflow:hidden;background:#050301;flex:none}
#zl{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .35s ease;will-change:transform}
#bgc{position:absolute;left:0;top:0;display:block}
.abs{position:absolute}
/* ---------- decorations ---------- */
.lr{position:absolute;border-radius:50%;border:calc(var(--u)*4) solid var(--c);box-shadow:0 0 calc(var(--u)*10) var(--c),inset 0 0 calc(var(--u)*7) var(--c);transform:translate(-50%,-50%);opacity:.95;pointer-events:none}
.lr.off{opacity:.28;box-shadow:none}
.sq{position:absolute;border-radius:calc(var(--u)*5);border:calc(var(--u)*5) solid var(--c);box-shadow:0 0 calc(var(--u)*12) var(--c),inset 0 0 calc(var(--u)*8) var(--c);transform:translate(-50%,-50%);pointer-events:none}
/* ---------- marbles ---------- */
.mbl{position:absolute;border-radius:50%;transform:translate(-50%,-50%);transition:left .38s cubic-bezier(.3,.8,.3,1),top .38s cubic-bezier(.3,.8,.3,1);
 background:radial-gradient(circle at 33% 27%,#fffc 0,#fff0 20%),radial-gradient(circle at 50% 58%,var(--c1) 0,var(--c2) 62%,var(--c3) 100%);
 box-shadow:0 calc(var(--u)*5) calc(var(--u)*7) #000c,inset calc(var(--u)*-3) calc(var(--u)*-4) calc(var(--u)*7) #0007;z-index:3}
.mbl.Y{--c1:#ffe45a;--c2:#f0a800;--c3:#a86b00}.mbl.B{--c1:#6a98ff;--c2:#1f55f0;--c3:#0a2490}
.mbl.R{--c1:#ff7a60;--c2:#e5231a;--c3:#8c0b05}.mbl.G{--c1:#6cf05a;--c2:#1fb82a;--c3:#0a6310}
.mbl.pick{animation:pk 0.9s infinite;z-index:6}
.mbl.sel{z-index:7;filter:brightness(1.25);box-shadow:0 0 calc(var(--u)*22) calc(var(--u)*6) #fff,0 calc(var(--u)*5) calc(var(--u)*7) #000c}
@keyframes pk{0%,100%{box-shadow:0 0 calc(var(--u)*6) calc(var(--u)*1) #ffe9a8,0 calc(var(--u)*5) calc(var(--u)*7) #000c}50%{box-shadow:0 0 calc(var(--u)*22) calc(var(--u)*7) #ffe9a8,0 calc(var(--u)*5) calc(var(--u)*7) #000c}}
.dst{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:calc(var(--u)*4) dashed #ffe9a8;background:#ffe9a833;box-shadow:0 0 calc(var(--u)*16) #ffd96a;animation:ds .8s infinite;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-shadow:0 0 4px #000}
.dst.kill{border-color:#ff5a4a;background:#ff3a2a44;box-shadow:0 0 calc(var(--u)*16) #ff4a3a}
@keyframes ds{50%{transform:translate(-50%,-50%) scale(1.22)}}
/* ---------- avatars ---------- */
.seat{position:absolute;width:calc(var(--u)*220);margin-left:calc(var(--u)*-110);z-index:12;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.crown{width:calc(var(--u)*108);height:calc(var(--u)*62);margin-bottom:calc(var(--u)*-16);position:relative;z-index:3;filter:drop-shadow(0 calc(var(--u)*3) calc(var(--u)*5) #000b)}
.rw{position:relative;width:calc(var(--u)*158);height:calc(var(--u)*158)}
.ring{position:absolute;inset:0;border-radius:50%;padding:calc(var(--u)*11);background:conic-gradient(from 200deg,#ffe9a8,#c8842f,#fff0bd,#9a5a14,#ffe28f,#c8842f,#ffe9a8);box-shadow:0 0 calc(var(--u)*18) #ffb83a66,0 calc(var(--u)*6) calc(var(--u)*10) #000a}
.ring .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(#3a2a18,#0a0603);overflow:hidden;position:relative;box-shadow:inset 0 0 calc(var(--u)*10) #000}
.ring .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ring .in span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*64);font-weight:800;color:#f6d27a}
.tmr{position:absolute;inset:calc(var(--u)*-8);width:calc(var(--u)*174);height:calc(var(--u)*174);transform:rotate(-90deg);pointer-events:none;opacity:0}
.tmr circle{fill:none;stroke:#7dffb0;stroke-width:7;stroke-linecap:round}
.seat.on .tmr{opacity:1}.seat.on .ring{box-shadow:0 0 calc(var(--u)*34) calc(var(--u)*8) #ffd96a,0 calc(var(--u)*6) calc(var(--u)*10) #000a}
.bd{position:absolute;right:calc(var(--u)*-14);bottom:calc(var(--u)*-6);width:calc(var(--u)*50);height:calc(var(--u)*50);border-radius:50%;border:calc(var(--u)*4) solid #f2c566;background:radial-gradient(circle at 35% 30%,#8a2f18,#2a0c06);display:flex;align-items:center;justify-content:center;font:800 calc(var(--u)*30)/1 system-ui;color:#ffe9a8;z-index:4;font-style:normal}
.cn{position:absolute;left:calc(var(--u)*-12);bottom:calc(var(--u)*-4);min-width:calc(var(--u)*42);height:calc(var(--u)*42);padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*21);border:calc(var(--u)*3) solid #f2c566;background:#0a0603;display:flex;align-items:center;justify-content:center;font:800 calc(var(--u)*24)/1 system-ui;color:#ffe9a8;z-index:4}
.pill{margin-top:calc(var(--u)*10);max-width:calc(var(--u)*230);min-width:calc(var(--u)*160);height:calc(var(--u)*46);padding:0 calc(var(--u)*18);border-radius:calc(var(--u)*23);border:calc(var(--u)*3) solid #c8842f;background:linear-gradient(#1b1209,#050301);box-shadow:0 0 calc(var(--u)*8) #ffb83a44;display:flex;align-items:center;justify-content:center;font:800 max(11px,calc(var(--u)*25))/1 system-ui;color:#f6e3b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.seat.me .pill{border-color:#ffe9a8;box-shadow:0 0 calc(var(--u)*14) #ffd96a}
.bub{position:absolute;top:calc(var(--u)*-6);left:50%;transform:translate(-50%,-100%);max-width:calc(var(--u)*300);background:#fff;color:#111;border-radius:calc(var(--u)*18);padding:calc(var(--u)*8) calc(var(--u)*16);font:600 max(11px,calc(var(--u)*24))/1.3 system-ui;opacity:0;transition:opacity .25s;z-index:20;word-break:break-word;direction:auto;text-align:center}
.bub.show{opacity:1}
/* ---------- HUD ---------- */
#hud{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--u)*560);z-index:14;text-align:center;pointer-events:none}
#hmsg{display:inline-block;max-width:100%;padding:calc(var(--u)*10) calc(var(--u)*26);border-radius:calc(var(--u)*30);border:calc(var(--u)*3) solid #c8842f;background:linear-gradient(#1b1209ee,#050301ee);color:#f6e3b4;font:700 max(12px,calc(var(--u)*28))/1.35 system-ui;box-shadow:0 0 calc(var(--u)*14) #ffb83a44}
#hmsg.me{border-color:#ffe9a8;box-shadow:0 0 calc(var(--u)*22) #ffd96a;color:#fff}
#tbar{margin:calc(var(--u)*10) auto 0;width:calc(var(--u)*300);height:calc(var(--u)*9);border-radius:calc(var(--u)*5);background:#000a;border:1px solid #c8842f55;overflow:hidden}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd96a,#7dffb0)}
#last{margin-top:calc(var(--u)*10);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*12);font:600 max(11px,calc(var(--u)*24))/1.3 system-ui;color:#e8cf95;text-shadow:0 1px 3px #000}
#last .tc{flex:none}
#act{position:absolute;left:50%;transform:translateX(-50%);z-index:30;white-space:nowrap;display:none;gap:calc(var(--u)*14);align-items:center}
#act.show{display:flex}
.gb{pointer-events:auto;padding:calc(var(--u)*14) calc(var(--u)*34);border-radius:calc(var(--u)*34);border:calc(var(--u)*3) solid #ffe9a8;background:linear-gradient(#7a3f12,#2a1204);color:#ffe9a8;font:800 max(13px,calc(var(--u)*30))/1 system-ui;box-shadow:0 0 calc(var(--u)*18) #ffb83a88;white-space:nowrap}
.gb:active{transform:scale(.96)}
#burn{position:absolute;left:0;right:0;z-index:31;display:none;justify-content:center;gap:calc(var(--u)*10)}
#burn.show{display:flex}
/* ---------- cards ---------- */
.card{background-image:var(--cards);background-repeat:no-repeat;border-radius:6%;flex:none}
.tc{display:inline-block;background-image:var(--cards);background-repeat:no-repeat;vertical-align:middle}
#hand{direction:ltr;position:absolute;left:0;right:0;z-index:20;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.hc{pointer-events:auto;position:relative;transform-origin:50% 130%;transition:transform .2s,filter .2s;filter:drop-shadow(0 4px 6px #000c);touch-action:manipulation}
.hc.dim{filter:brightness(.45) drop-shadow(0 4px 6px #000c)}
.hc.ok{filter:drop-shadow(0 0 7px #ffd96a)}
.hc.sel{filter:drop-shadow(0 0 12px #fff) brightness(1.1);z-index:5}
.cb{background:#050301;border:2px solid #c8842f;border-radius:7%;display:flex;align-items:center;justify-content:center;color:#c8842f;font-size:22px;box-shadow:0 0 6px #ffb83a55,inset 0 0 12px #000;background-image:repeating-linear-gradient(45deg,#1b1209 0 6px,#050301 6px 12px)}
/* ---------- chat ---------- */
#cb{direction:ltr;position:absolute;left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;border-radius:999px;border:2px solid #c8842f;background:linear-gradient(#0c0804,#000);box-shadow:0 0 14px #ffb83a55,inset 0 0 14px #000;padding:0 8px;gap:8px}
#cb.off{opacity:.5}
#cb input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#f6e3b4;font:15px system-ui;direction:auto;text-align:right;user-select:text;-webkit-user-select:text}
#cb input::placeholder{color:#b08a4a}
#cb button{width:36px;height:36px;border:0;background:transparent;color:#ffd78a;font-size:22px;padding:0;flex:none}
#emo{position:absolute;left:5%;right:5%;z-index:26;display:none;grid-template-columns:repeat(8,1fr);background:#050301f4;border:2px solid #c8842f;border-radius:16px;padding:6px}
#emo.show{display:grid}#emo button{background:none;border:0;font-size:26px;height:40px}
#cpill{position:absolute;left:50%;transform:translateX(-50%);z-index:24;max-width:88%;padding:6px 14px;border-radius:16px;border:1.5px solid #c8842f;background:#050301ee;color:#f6e3b4;font:600 13px/1.4 system-ui;display:none;direction:auto;text-align:center}
#cpill.show{display:block}
/* ---------- misc ---------- */
.fb{position:absolute;z-index:27;width:calc(var(--u)*66);height:calc(var(--u)*66);border-radius:50%;border:calc(var(--u)*4) solid #c8842f;background:linear-gradient(#1b1209,#050301);color:#ffd78a;font:800 max(15px,calc(var(--u)*34))/1 system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 0 calc(var(--u)*12) #ffb83a66;padding:0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:100;background:#2a0f08;border:1.5px solid #ff8a5a;color:#ffd9c9;padding:8px 16px;border-radius:14px;font:700 13px system-ui;display:none;max-width:90%;text-align:center}
#ov{position:fixed;inset:0;z-index:90;background:#000d;display:none;align-items:center;justify-content:center;padding:18px}
#ov.show{display:flex}
.box{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:linear-gradient(#17100a,#060403);border:3px solid #c8842f;border-radius:20px;padding:16px;box-shadow:0 0 30px #ffb83a66;text-align:center}
.box h2{color:#ffe9a8;font-size:20px;margin-bottom:10px}
.rl{display:flex;align-items:center;gap:10px;text-align:right;padding:7px 0;border-bottom:1px solid #c8842f33;font:600 13.5px/1.5 system-ui;color:#ecd6a2}
.rl .tc{flex:none}
.rl .tx{flex:1}
.sec{color:#ffd78a;font-weight:800;margin:10px 0 2px;text-align:right}
#load{position:fixed;inset:0;z-index:95;background:#050301;display:flex;align-items:center;justify-content:center;color:#ffd78a;font:700 17px system-ui;text-align:center;padding:20px}
</style>
</head>

<div id="toast"></div>
<div id="ov"><div class="box" id="obox"></div></div>
<div id="load">جاري الاتصال باللعبة...</div>

  $('obox').innerHTML=`<h2>${mine?'🏆 مبروك! فزت':'🏁 انتهت اللعبة'}</h2><div style="font:700 18px system-ui;margin:10px 0;color:#fff">${S_.winTeam!=null?'الفريق الفائز':'الفائز'}:<br>${esc(names)}</div><button class="gb" onclick="document.getElementById('ov').classList.remove('show')">إغلاق</button>`;
  $('ov').classList.add('show');
}
/* ======= الشرح ======= */
function showHelp(){
  const cx=S_&&S_.variant==='complex';const row=(c,t)=>`<div class="rl">${tcard(c,38)}<div class="tx">${t}</div></div>`;
  let h=`<h2>قواعد جاكارو ${cx?'(كومبلكس)':'(عادي)'}</h2><div class="sec">استخدام البطاقات</div>`;
  h+=row('AC',cx?'حرّك قطعتك 1 خطوة للأمام أو أخرج قطعة جديدة':'حرّك قطعتك 1 أو 11 خطوة للأمام أو أخرج قطعة جديدة');
  h+=row('2C','حرّك قطعتك 2 خطوة للأمام')+row('3C','حرّك قطعتك 3 خطوات للأمام')+row('4C','حرّك قطعتك 4 خطوات للخلف')+row('5C','حرّك أي قطعة 5 خطوات للأمام')+row('6C','حرّك قطعتك 6 خطوات للأمام')+row('7C','حرّك قطعة أو قطعتين بمجموع 7 خطوات للأمام')+row('8C','حرّك قطعتك 8 خطوات للأمام')+row('9C','حرّك قطعتك 9 خطوات للأمام')+row('10C','حرّك قطعة 10 خطوات للأمام أو اجعل اللاعب التالي يتخلص من بطاقة');
  h+=row('JC','استبدل مكان قطعتك بمكان قطعة لاعب آخر');
  if(cx)h+=row('JD','حرّك قطعتك 11 خطوة للأمام');
  h+=row('QC','حرّك قطعتك 12 خطوة للأمام');
  if(cx)h+=row('QD','اختر بطاقة من اللاعب التالي ليتخلص منها');
  h+=row('KC',cx?'أخرج قطعة جديدة، أو حرّكها 13 خطوة للأمام مع إقصاء جميع القطع التي تمر عليها':'إخراج قطعة واحدة جديدة');
  h+=`<div class="sec">قواعد تحريك القطع</div><div class="rl"><div class="tx">• لا يمكنك تجاوز قطعتك الموجودة بالأمام.</div></div><div class="rl"><div class="tx">• إذا كانت هناك قطعة في الخانة قبل خط النهاية لا يمكنك تجاوزها.</div></div><div class="rl"><div class="tx">• إذا وجدت قطعة من نفس اللون ضمن نطاق تقدمك لا يمكنك تجاوزها.</div></div><div class="rl"><div class="tx">• لو وقفت على قطعة خصم تُقصيها وترجع لبيتها.</div></div><div class="rl"><div class="tx">• بالفريق: لما تدخل قطعك الأربع تلعب بقطع شريكك، ويفوز الفريق إذا دخلت كل القطع.</div></div><br><button class="gb" onclick="document.getElementById('ov').classList.remove('show')">إغلاق</button>`;
  $('obox').innerHTML=h;$('ov').classList.add('show');
}
/* ======= الشات ======= */
const EMO=['😂','😍','😎','🔥','👏','😭','😡','🤔','👍','👎','🙏','💪','🎉','😅','🤝','😱'];
$('emo').innerHTML=EMO.map(e=>`<button>${e}</button>`).join('');
$('emo').onclick=e=>{if(e.target.tagName==='BUTTON'){$('cin').value+=e.target.textContent;$('cin').focus()}};
$('bEmo').onclick=()=>{if(S_&&S_.chat)$('emo').classList.toggle('show')};
function sendChat(){const v=$('cin').value.trim();if(!v||!S_||!S_.chat)return;send({a:'chat',m:v});$('cin').value='';$('emo').classList.remove('show')}
$('bSend').onclick=sendChat;$('cin').onkeydown=e=>{if(e.key==='Enter')sendChat()};
function onChat(m){
  const e=document.querySelector(`.seat[data-u="${m.u}"]`);
  if(e){const b=e.querySelector('.bub');b.textContent=m.m;b.classList.add('show');clearTimeout(b.t);b.t=setTimeout(()=>b.classList.remove('show'),5000)}
  const p=$('cpill');p.textContent=pname(m.u)+': '+m.m;p.classList.add('show');clearTimeout(p.t);p.t=setTimeout(()=>p.classList.remove('show'),6000);
}
/* ======= تكبير اللوحة ======= */
function setZoom(z,cx,cy){
  Z.z=z;
  if(z===1){Z.tx=0;Z.ty=0}else{const bw=W,bh=1536*U;Z.tx=Math.min(0,Math.max(bw-bw*z,bw/2-cx*U*z));Z.ty=Math.min(0,Math.max(bh-bh*z,bh*.42-cy*U*z))}
  $('zl').style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.z})`;
}
$('bZoom').onclick=()=>{const z=Z.z===1?1.9:(Z.z<2.5?2.7:1);let fx=512,fy=640;
  if(S_&&myTurn()&&sel.ci>=0){const c=candidates();if(c.length){fx=c.reduce((a,b)=>a+b.x,0)/c.length;fy=c.reduce((a,b)=>a+b.y,0)/c.length}}
  setZoom(z,fx,fy)};
$('bHelp').onclick=showHelp;
/* ======= لمس اللوحة ======= */
let tp=null;
const stg=$('stage');
stg.addEventListener('touchstart',e=>{if(e.target.closest('.hc,#cb,#emo,.fb,#act,#burn,#cpill'))return;const t=e.touches[0];tp={x:t.clientX,y:t.clientY,tx:Z.tx,ty:Z.ty,mv:false}},{passive:true});
stg.addEventListener('touchmove',e=>{if(!tp)return;const t=e.touches[0];const dx=t.clientX-tp.x,dy=t.clientY-tp.y;if(Math.hypot(dx,dy)>9)tp.mv=true;
  if(tp.mv&&Z.z>1){const bw=W,bh=1536*U;Z.tx=Math.min(0,Math.max(bw-bw*Z.z,tp.tx+dx));Z.ty=Math.min(0,Math.max(bh-bh*Z.z,tp.ty+dy));$('zl').style.transition='none';$('zl').style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.z})`}},{passive:true});
stg.addEventListener('touchend',e=>{if(!tp)return;$('zl').style.transition='';const t=e.changedTouches[0];if(!tp.mv)onBoardTap(t.clientX,t.clientY);tp=null});
stg.addEventListener('click',e=>{if('ontouchstart' in window)return;if(e.target.closest('.hc,#cb,#emo,.fb,#act,#burn,#cpill'))return;onBoardTap(e.clientX,e.clientY)});
/* ======= بدء ======= */
addEventListener('resize',()=>{layout()});
bgImg.onload=()=>{bgReady=true;layout();connect()};
bgImg.src=BG_SRC;
</script>
