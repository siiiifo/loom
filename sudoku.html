<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#013398"><title>RAY - سودوكو</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Cairo:wght@900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#013398;--fr:#0859f2;--ln:#4acefb;--cell:#043792;--hi:#0a4ab4;--gold:#fdc62f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
background:radial-gradient(90% 50% at 50% 0,#0a4fc4,transparent 70%),linear-gradient(180deg,#0140ad,#013398 45%,#012a80);color:#fff;font-family:Nunito,Cairo,system-ui,sans-serif;direction:ltr}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
#top{width:min(94vw,520px);display:flex;align-items:center;gap:8px}
#top i{flex:1;height:2px;background:var(--gold);border-radius:2px}
#top s{color:var(--gold);text-decoration:none;font-size:22px;text-shadow:0 0 8px rgba(253,198,47,.7)}
#logo{height:clamp(44px,9vh,78px);display:block;margin:0 auto;-webkit-mask-image:radial-gradient(ellipse 60% 66% at 50% 50%,#000 86%,transparent 100%);mask-image:radial-gradient(ellipse 60% 66% at 50% 50%,#000 86%,transparent 100%)}
#tm{font:900 20px/1 Nunito;color:var(--gold);min-width:56px;text-align:center}
#board{--b:min(94vw,calc(100dvh - 250px),520px);width:var(--b);height:var(--b);padding:2.2%;border-radius:4%;background:var(--fr);border:3px solid var(--ln);box-shadow:0 0 0 3px #0a47c4,0 8px 22px rgba(0,0,0,.45);
display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1.2%}
.bx{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2.5%;padding:2.5%;background:var(--ln);border-radius:5%;padding:1.6%}
.c{background:var(--cell);border-radius:12%;position:relative;display:flex;align-items:center;justify-content:center;font:900 calc(var(--b)/15) Nunito}
.c.h{background:var(--hi)}.c.sel{background:#1a6dff;box-shadow:0 0 0 2px var(--gold)}
.c.bad{background:#6b1320}.c.bad .t{background:linear-gradient(180deg,#ff5a4d,#c40f22)!important}.c.bad::after{content:'';position:absolute;inset:0;border-radius:12%;border:3px solid #ff2b2b;box-shadow:0 0 10px 2px rgba(255,43,43,.9);pointer-events:none;z-index:2;animation:bd .35s ease-out}@keyframes bd{0%{transform:scale(1.25);opacity:0}100%{transform:scale(1);opacity:1}}#ls{font:900 15px/1 Cairo,Nunito;color:var(--gold);min-width:64px;text-align:center;white-space:nowrap}#ls.w{color:#ff6a5e}
.t{position:absolute;inset:4%;border-radius:14%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)/12);text-shadow:0 2px 0 rgba(0,0,0,.35);
box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),0 2px 3px rgba(0,0,0,.45)}
.t.u{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 1.5px #fff,0 2px 3px rgba(0,0,0,.45)}
.nt{display:grid;grid-template-columns:repeat(3,1fr);width:92%;height:92%;font-size:calc(var(--b)/40);line-height:1;text-align:center;align-items:center;color:#9fd8ff}
#pad{width:min(98vw,560px);display:flex;gap:1%;padding:0 1%}
#pad b{flex:1 1 0;min-width:0;aspect-ratio:1;border-radius:22%;display:flex;align-items:center;justify-content:center;font:900 clamp(16px,5vw,28px) Nunito;position:relative;
box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),0 3px 5px rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s,opacity .2s}
#pad b:active{transform:scale(.92)}#pad b.f{opacity:.3}
#pad b.k{background:var(--fr);border:2px solid var(--ln)}#pad b.k.on{background:var(--gold);border-color:#fff}
#pad svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}#pad b.on svg{stroke:#013398}
#ov{position:fixed;inset:0;z-index:9;background:rgba(1,40,128,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font:900 22px/1.6 Cairo,Nunito}
#ov big{font:900 90px/1 Nunito;color:var(--gold);text-shadow:0 0 24px rgba(253,198,47,.7)}#ov.x{display:none}
#mu{all:unset;box-sizing:border-box;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;background:rgba(1,40,128,.55);border:1.5px solid var(--gold)}
#mu svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#mu .x{display:none}#mu.off .w{display:none}#mu.off .x{display:block}#mu.off{opacity:.75}
</style></head><body>

function rayMqtt(filters,onMsg,urls){
 urls=urls||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
 var PFX='rayrelay/';

 function connect(url){
  var ws=null,buf=new Uint8Array(0),ping=0,retry=0,sched=false;
  function cat(a,b){var c=new Uint8Array(a.length+b.length);c.set(a,0);c.set(b,a.length);return c;}
  function rl(n){var o=[];do{var d=n%128;n=Math.floor(n/128);if(n)d|=128;o.push(d);}while(n);return o;}
  function str(s){var e=new TextEncoder().encode(s),a=[e.length>>8,e.length&255];for(var i=0;i<e.length;i++)a.push(e[i]);return a;}

  function later(){if(sched)return;sched=true;setTimeout(function(){sched=false;open();},Math.min(20000,1500*(++retry)));}
  function open(){
   try{ws=new WebSocket(url,'mqtt');}catch(e){later();return;}
   ws.binaryType='arraybuffer';buf=new Uint8Array(0);
   ws.onopen=function(){var vh=[0,4,77,81,84,84,4,2,0,30],pl=str('rb'+Math.random().toString(36).slice(2,10));send([0x10].concat(rl(vh.length+pl.length),vh,pl));};

  function parse(){
   while(buf.length>=2){
    var i=1,mul=1,len=0,b;
    do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
    if(buf.length<i+len)return;
    var hdr=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);
    var t=hdr>>4;

     if(body[1]!==0){try{ws.close();}catch(e){}return;}
     var sub=[0,1],k;for(k=0;k<filters.length;k++)sub=sub.concat(str(filters[k]),[0]);
     send([0x82].concat(rl(sub.length),sub));
     clearInterval(ping);ping=setInterval(function(){send([0xC0,0]);},20000);retry=0;
    }else if(t===3){ /* PUBLISH */
     var qos=(hdr>>1)&3,tl=(body[0]<<8)|body[1],off=2+tl;
     var topic=new TextDecoder().decode(body.slice(2,off));
     if(qos)off+=2;
     try{onMsg(topic.slice(PFX.length),new TextDecoder().decode(body.slice(off)));}catch(e){}
    }
   }
  }
  open();
 }

<script>
(function(){
var AC=null,master=null,timer=null,idx=0,muted=false,btn=document.getElementById('mu');

var CH=[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,146.83,196,246.94]];
var ML=[523.25,587.33,659.25,783.99,880];
function build(){
if(AC)return true;
var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
try{
AC=new C();master=AC.createGain();master.gain.value=0;

return true;}
function note(f,t,dur,vol,att){
var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);}
function step(){
if(!AC||AC.state!=='running')return;
var t=AC.currentTime+.05,c=CH[idx%CH.length];idx++;
c.slice(0,3).forEach(function(f,i){note(f,t+i*.15,8,.022,3);});
var n=1+Math.floor(Math.random()*2);
for(var k=0;k<n;k++){note(ML[Math.floor(Math.random()*ML.length)],t+1.5+k*2.8+Math.random()*.6,1.6,.012,.15);}
}
function start(){
if(muted||!build())return;

if(!timer){step();timer=setInterval(step,8000);}};
if(AC.state==='running')go();else AC.resume().then(go).catch(function(){});}
function stop(){
if(timer){clearInterval(timer);timer=null;}
if(AC){try{master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(0,AC.currentTime,.15);}catch(e){}
var a=AC;setTimeout(function(){if(muted&&a.state==='running')a.suspend();},700);}}

['pointerdown','touchstart','keydown'].forEach(function(n){document.addEventListener(n,function(ev){
if(btn.contains(ev.target)||muted||(AC&&AC.state==='running'&&timer))return;start();},{passive:true});});

ui();start();
})();
