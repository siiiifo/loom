  /* ===== معطيات الجلسة ===== */

  var lv=1,rem={},hu=0,at=3,pal=0,remN=0,L=null,occ=null,loaded=false;
  var PALS=[['K','أسود']];
  function colOf(id){return PALS[pal][0];}

  /* ===== مولّد المراحل (حتمي، وكل مرحلة لها حل مضمون) ===== */
  function rng(a){return function(){a=(a+0x6D2B79F5)>>>0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

  function gen(n){
    var R=rng(n*7919+13),cols=Math.min(18,5+((n-1)>>1)),rows=Math.round(cols*1.14);
    var maxLen=Math.min(11,3+Math.floor(n*0.35)),target=Math.min(0.93,0.6+n*0.012),K=n<3?1:3+Math.min(12,Math.floor(n/2));

    function walk(){
      var fr=[];for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)if(g[r][c]<0)fr.push([r,c]);
      if(!fr.length)return null;var s=fr[Math.floor(R()*fr.length)],cells=[s],seen={},len=2+Math.floor(Math.pow(R(),1.5)*(maxLen-1)),ld=null;seen[s[0]*100+s[1]]=1;
      while(cells.length<len){
        var h=cells[cells.length-1],opts=[];
        for(var i=0;i<4;i++){var nr=h[0]+DIRS[i][0],nc=h[1]+DIRS[i][1];if(inb(nr,nc)&&g[nr][nc]<0&&!seen[nr*100+nc])opts.push(i);}

        var nn=[h[0]+DIRS[pick][0],h[1]+DIRS[pick][1]];cells.push(nn);seen[nn[0]*100+nn[1]]=1;ld=pick;

  function lkey(){return 'arw_'+(C||'d')+'_'+(U||'d');}

  function save(){local();if(!demo){dirty=true;pump();}}
  function applyState(s){if(!s)return;lv=Math.max(1,s.lv|0);rem={};(s.rem||[]).forEach(function(i){rem[i]=1;});hu=s.hu|0;at=(s.at===undefined||s.at===null)?3:Math.max(1,Math.min(3,s.at|0));pal=(s.pal|0)%PALS.length;}
  function startLevel(){L=gen(lv);var ok={};L.arrows.forEach(function(a){ok[a.id]=1;});
    for(var k in rem){if(!ok[k])delete rem[k];}buildOcc();remN=Object.keys(rem).length;hintId=-1;anims=[];paintUI();fitBoard();need();}

  /* ===== الواجهة ===== */
  function paintUI(){var n=L.arrows.length,p=n?Math.round(remN/n*100):0;
    $('sg').textContent=lv;$('lv').textContent=Math.floor((lv-1)/10)+1;$('tp').textContent=p+'%';$('pc').textContent=p+'%';
    $('tb').style.width=p+'%';$('pb').style.width=p+'%';$('hb').textContent=Math.max(0,3-hu);
    for(var k=1;k<=3;k++)$('a'+k).classList.toggle('on',k>at);}
  var tmT=0;function toast(m){var e=$('tt');e.textContent=m;e.classList.add('on');clearTimeout(tmT);tmT=setTimeout(function(){e.classList.remove('on');},1600);}
  var st=$('st'),cv=$('cv'),ctx=cv.getContext('2d'),dpr=1,K=1,cs=40,ox=0,oy=0,sc=1;
  function layout(){
    var w=Math.min(innerWidth,innerHeight*941/1671),h=w*1671/941;st.style.width=w+'px';st.style.height=h+'px';K=w/941;
    st.style.fontSize=(K*40)+'px';$('sg').style.fontSize=(K*66)+'px';$('lv').style.fontSize=(K*50)+'px';$('tp').style.fontSize=(K*41)+'px';$('pc').style.fontSize=(K*37)+'px';$('hb').style.fontSize=(K*32)+'px';
    $('ms').style.fontSize=(K*46)+'px';$('tt').style.fontSize=(K*34)+'px';
    dpr=Math.min(2.5,devicePixelRatio||1);cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);sc=cv.width/874;
    if(L)fitBoard();need();
  }
  function fitBoard(){var pad=14*sc,aw=cv.width-pad*2,ah=cv.height-pad*2;cs=Math.min(aw/L.cols,ah/L.rows);ox=(cv.width-cs*L.cols)/2;oy=(cv.height-cs*L.rows)/2;}

  /* ===== الرسم والحركة ===== */
  var anims=[],shk={},hintId=-1,hintUntil=0,raf=0;
  function P(r,c){return [ox+(c+.5)*cs,oy+(r+.5)*cs];}
  function lw(){return Math.min(cs*0.3,26*sc);}
  function tipLen(){return lw()*1.5;}
  function drawArrow(pts,d,col,glow){
    var w=lw();ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    if(col==='R'||col==='K'){var y0=1e9,y1=-1e9;pts.forEach(function(p){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});var hh=pts[pts.length-1],tt=tipLen();y0=Math.min(y0,hh[1]+d[0]*tt)-w;y1=Math.max(y1,hh[1]+d[0]*tt)+w;if(y1-y0<w*4){var mid=(y0+y1)/2;y0=mid-w*2;y1=mid+w*2;}
      var gr=ctx.createLinearGradient(0,y0,0,y1);
      if(col==='R'){gr.addColorStop(0,'#ef3a27');gr.addColorStop(.5,'#cf170c');gr.addColorStop(1,'#a30c05');}else{gr.addColorStop(0,'#3b3b3b');gr.addColorStop(.5,'#161616');gr.addColorStop(1,'#000000');}
      col=gr;}
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
    ctx.shadowColor=glow?'#ff3b2a':'rgba(0,0,0,.28)';ctx.shadowBlur=glow||5*sc;ctx.shadowOffsetY=glow?0:2*sc;
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
    var h=pts[pts.length-1],t=tipLen(),hw=w*0.95,dx=d[1],dy=d[0];
    ctx.beginPath();ctx.moveTo(h[0]+dx*t,h[1]+dy*t);ctx.lineTo(h[0]-dy*hw,h[1]+dx*hw);ctx.lineTo(h[0]+dy*hw,h[1]-dx*hw);ctx.closePath();ctx.fill();ctx.restore();
  }
  function bodyPts(a){return a.cells.map(function(p){return P(p[0],p[1]);});}
  function draw(now){
    ctx.clearRect(0,0,cv.width,cv.height);if(!L)return;var busy=false;
    L.arrows.forEach(function(a){
      if(rem[a.id])return;var pts=bodyPts(a),glow=0,col=colOf(a.id),s=shk[a.id];
      var hn=hintId===a.id&&now<hintUntil;if(hn){glow=34*sc;busy=true;}
      if(s){var e=(now-s)/320;if(e<1){var o=Math.sin(e*28)*cs*0.1*(1-e);pts=pts.map(function(p){return [p[0]+o,p[1]];});col='R';busy=true;}else delete shk[a.id];}
      if(hn&&Math.sin(now/95)>0)col='R';
      drawArrow(pts,a.d,col,glow);
      if(hn){var f=.5+.5*Math.sin(now/95);ctx.save();ctx.globalAlpha=f*.9;drawArrow(pts,a.d,'R',44*sc);ctx.restore();}
    });
    for(var i=anims.length-1;i>=0;i--){
      var m=anims[i],t=(now-m.t0)/1000,s2=cs*(5*t+46*t*t);
      if(s2>=m.total){anims.splice(i,1);continue;}busy=true;
      var sub=slice(m.pts,m.cum,s2,s2+m.len);drawArrow(sub,m.a.d,m.col,0);
    }
    return busy;
  }
  function slice(pts,cum,a,b){var out=[],i;
    function at(s){for(i=1;i<cum.length;i++){if(cum[i]>=s){var f=(s-cum[i-1])/((cum[i]-cum[i-1])||1);return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f,i];}}var l=pts.length-1;return [pts[l][0],pts[l][1],l];}
    var A=at(a),B=at(b);out.push([A[0],A[1]]);for(var k=A[2];k<B[2];k++)out.push(pts[k]);out.push([B[0],B[1]]);return out;}
  function loop(now){raf=0;var busy=draw(now);if(busy||anims.length)need();}
  function need(){if(!raf)raf=requestAnimationFrame(loop);}

  /* ===== اللعب ===== */
  function distSeg(px,py,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/l)):0;var x=a[0]+dx*t-px,y=a[1]+dy*t-py;return Math.sqrt(x*x+y*y);}
  function pick(px,py){var best=null,bd=cs*0.55;
    L.arrows.forEach(function(a){if(rem[a.id])return;var pts=bodyPts(a);
      for(var i=0;i<pts.length;i++){var d=i?distSeg(px,py,pts[i-1],pts[i]):Math.hypot(px-pts[0][0],py-pts[0][1]);if(d<bd){bd=d;best=a;}}
      var h=pts[pts.length-1],tl=tipLen(),dd=distSeg(px,py,h,[h[0]+a.d[1]*tl,h[1]+a.d[0]*tl]);if(dd<bd){bd=dd;best=a;}});
    return best;}
  function release(a){
    var pts=bodyPts(a),n=Math.max(L.rows,L.cols)+a.cells.length+3,h=pts[pts.length-1],all=pts.slice();
    for(var k=1;k<=n;k++)all.push([h[0]+a.d[1]*cs*k,h[1]+a.d[0]*cs*k]);
    var cum=[0];for(var i=1;i<all.length;i++)cum.push(cum[i-1]+Math.hypot(all[i][0]-all[i-1][0],all[i][1]-all[i-1][1]));
    var len=cum[pts.length-1];
    anims.push({a:a,pts:all,cum:cum,len:len,total:cum[cum.length-1]-len*0.2,col:colOf(a.id),t0:performance.now()});
    rem[a.id]=1;remN++;a.cells.forEach(function(p){occ[p[0]][p[1]]=-1;});
  }
  var busyWin=false;
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();if(!L||!loaded||busyWin)return;var rc=cv.getBoundingClientRect(),px=(e.clientX-rc.left)*cv.width/rc.width,py=(e.clientY-rc.top)*cv.height/rc.height;
    var a=pick(px,py);if(!a)return;
    if(!isFree(a)){shk[a.id]=performance.now();hap('no');at--;paintUI();save();need();if(at<=0)fail();return;}
    release(a);hap('tap');hintId=-1;paintUI();save();need();
    if(remN>=L.arrows.length)win();
  });
  function fail(){
    busyWin=true;var ms=$('ms');ms.textContent='💥 انتهت المحاولات — تُعاد المرحلة';ms.classList.add('on');
    setTimeout(function(){ms.classList.remove('on');busyWin=false;rem={};at=3;startLevel();save();},1500);
  }
  function win(){
    busyWin=true;hap('ok');var ms=$('ms');ms.textContent='✨ أحسنت! أكملت المرحلة '+lv;ms.classList.add('on');
    lv++;rem={};hu=0;at=3;save();
    setTimeout(function(){ms.classList.remove('on');busyWin=false;startLevel();},1100);
  }

  /* ===== الأزرار ===== */
  var rsT=0;
  $('zr').addEventListener('click',function(){
    if(!L||busyWin)return;
    if(!rsT){toast('اضغط مرة ثانية لإعادة المرحلة');rsT=setTimeout(function(){rsT=0;},2500);return;}
    clearTimeout(rsT);rsT=0;rem={};startLevel();save();toast('تمت إعادة المرحلة');
  });
  $('zh').addEventListener('click',function(){
    if(!L||busyWin)return;if(hu>=3){toast('انتهت تلميحات هذي المرحلة');return;}
    var f=L.arrows.filter(function(a){return !rem[a.id]&&isFree(a);});if(!f.length)return;
    hintId=f[Math.floor(Math.random()*f.length)].id;hintUntil=performance.now()+4000;hu++;paintUI();save();need();hap('tap');
  });

  /* ===== التحميل (من السيرفر، وإلا من الجهاز) ===== */
  function boot(s){applyState(s);loaded=true;layout();startLevel();}
  function fromLocal(){try{return JSON.parse(localStorage.getItem(lkey())||'null');}catch(e){return null;}}
  addEventListener('resize',layout);addEventListener('orientationchange',function(){setTimeout(layout,150);});
  layout();
  if(demo){boot(fromLocal());}
  else{
    var ac=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ac)ac.abort();},6000);
    fetch(API+'/arrows/load?u='+encodeURIComponent(U)+'&c='+encodeURIComponent(C)+'&t='+encodeURIComponent(T),{signal:ac?ac.signal:undefined})
      .then(function(r){return r.json();}).then(function(j){clearTimeout(to);boot(j&&j.ok?j:fromLocal());})
      .catch(function(){clearTimeout(to);boot(fromLocal());toast('وضع غير متصل');});
  }
})();
</script>
</body>
