<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAY ZOMBIE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2f3170;--ink2:#6a6fb5;--pill:#ffffff8c;--pillb:#a9afee;--acc:#7b84d8;--accd:#5a62bd;--cbg:#fffffff0;--cm:#eceeff;--cme:#d9ddff}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;font:14px system-ui,Tahoma,sans-serif;background:#c9cdf0}
body.zt,html.zt{background:#1d3b33}
#stage{position:absolute;left:50%;top:0;height:var(--SH,100vh);width:min(100vw,calc(var(--SH,100vh)/1.5));transform:translateX(-50%);container-type:size;overflow:hidden;direction:ltr;color:var(--ink);transition:color .6s;background:#cfd3f4}
#stage.zt{background:#244a3f}
#board{position:absolute;left:0;width:100%;height:150cqw;top:calc((100cqh - 150cqw)/2);container-type:size}
#stage.zt{--ink:#e9fff2;--ink2:#9fd9b8;--pill:#12302a99;--pillb:#49c486;--acc:#3fbf7c;--accd:#2a8f5c;--cbg:#10282af2;--cm:#183a35;--cme:#1f5246}
.bgl{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s}
#bgZ{opacity:0}#stage.zt #bgZ{opacity:1}#stage.zt #bgP{opacity:0}
.abs{position:absolute}
/* ===== cards ===== */
.cf{position:relative;width:100%;aspect-ratio:224/328;border-radius:9%/6.2%;container-type:inline-size;overflow:hidden;background:#fffdf8;box-shadow:0 0 0 .5cqi #1b1f4f22 inset,0 1cqi 2cqi #0003}
.cf.g{background:#fff}
.cf .ci{position:absolute;left:8%;top:4.5%;display:flex;flex-direction:column;align-items:center;gap:2.5cqi;line-height:1;z-index:2}
.cf .ci b{font:800 25cqi/1 "Arial Rounded MT Bold",system-ui,sans-serif}
.cf .ci.b2{left:auto;right:8%;top:auto;bottom:4.5%;transform:rotate(180deg)}
.cf .ci .su{width:19cqi;height:19cqi}
.cf .bl{position:absolute;border-radius:50%;opacity:.45}
.cf.g .bl.a{right:-8%;top:6%;width:44%;height:30%;border-radius:55% 45% 50% 50%}
.cf.g .bl.b{left:-6%;bottom:5%;width:42%;height:28%;border-radius:50% 55% 45% 50%}
.cf.g .hd{position:absolute;left:51%;top:56%;width:68%;transform:translate(-50%,-50%);z-index:1}
.cf.p .pt{position:absolute;border-radius:50% 50% 50% 8%;opacity:.9}
.cf.p .big{position:absolute;left:52%;top:58%;width:50%;transform:translate(-50%,-50%) rotate(-4deg);z-index:1}
.cf.p .crown{position:absolute;left:54%;top:50%;width:54%;transform:translate(-50%,-50%);z-index:1}
.cf.cz{background:transparent;box-shadow:none;border-radius:0;overflow:visible}.cf.cz img{width:100%;height:100%;display:block;filter:drop-shadow(0 1cqi 2cqi #0004)}
.su{display:block}
/* ===== backs ===== */
.bk{position:absolute;border-radius:2cqw;display:flex;align-items:center;justify-content:center;transition:translate .2s,filter .2s;border:.9cqw solid #f1f1fb;background:linear-gradient(160deg,#4a4e92,#383c7a);box-shadow:0 .5cqw 1.4cqw #1b1f4f55,inset 0 0 0 .5cqw #0002}
.bk i{font:normal 800 4.6cqw/1 system-ui;color:#aeb4f2}
.bk .rt{display:none;font:italic 800 4cqw/1 system-ui;color:#7fe0a8;letter-spacing:-.2cqw}
#stage.zt .bk{background:linear-gradient(160deg,#23483f,#183029);border-color:#e4efe9}
#stage.zt .bk i{display:none}#stage.zt .bk .rt{display:block}
.oh.t{z-index:7}.oh.t .bk{width:12.6cqw;height:17.5cqw}
#stage.n5 .oh.t .bk,#stage.n6 .oh.t .bk{width:9.8cqw;height:13.6cqw;border-width:.7cqw}
#stage.n5 .oh.t .bk i,#stage.n6 .oh.t .bk i{font-size:3.6cqw}#stage.n5 .oh.t .bk .rt,#stage.n6 .oh.t .bk .rt{font-size:2.9cqw}
.oh.vic{z-index:9}
.oh.l .bk,.oh.r .bk{width:17cqw;height:11.6cqw}
.oh.l .bk,.oh.r .bk{justify-content:center}.oh.l .bk{padding-left:5.6cqw}.oh.r .bk{padding-right:5.6cqw}.oh.l .bk .rt,.oh.r .bk .rt{font-size:3.4cqw}.oh.l .bk i,.oh.r .bk i{font-size:4cqw}
.oh{position:absolute;inset:0;pointer-events:none;z-index:3}
.oh.vic .bk{pointer-events:auto;cursor:pointer;box-shadow:0 0 2.4cqw .4cqw #fff9,0 .5cqw 1.4cqw #0006}
.oh.vic.l .bk.sel{translate:5cqw 0}.oh.vic.r .bk.sel{translate:-5cqw 0}.oh.vic.t .bk.sel{translate:0 5cqw}
.oh .bk.sel{filter:brightness(1.35)}
/* ===== seats ===== */
.seat{position:absolute;pointer-events:none;z-index:6;display:flex;align-items:center;gap:2cqw;transform:translate(-50%,-50%)}
.seat.t{left:50%;top:13.6%;flex-direction:column;gap:1.4cqw}
.seat.l{left:9.2%;top:22.4%}.seat.r{left:90.8%;top:22.4%;flex-direction:row-reverse}
.seat.l .nm{position:absolute;left:105%;top:50%;transform:translateY(-50%)}
.seat.r .nm{position:absolute;right:105%;top:50%;transform:translateY(-50%)}
.seat.l .nm,.seat.r .nm{white-space:nowrap}
#stage.n5 .seat.t,#stage.n6 .seat.t{top:12.4%;gap:1.1cqw}
#stage.n5 .seat .av,#stage.n6 .seat .av{width:10.6cqw;height:10.6cqw}
#stage.n5 .seat .nm,#stage.n6 .seat .nm{font-size:2.7cqw}
#stage.n5 .seat.t .nm span{max-width:26cqw}#stage.n6 .seat.t .nm span{max-width:21cqw}
#stage.n5 .seat .tmr,#stage.n6 .seat .tmr{width:13cqw}
#stage.n5 .seat .dbg,#stage.n6 .seat .dbg{width:5cqw;height:5cqw;font-size:3cqw;line-height:5cqw}
.av{position:relative;width:12cqw;height:12cqw;border-radius:50%;border:.9cqw solid var(--rc,#6ac7ee);background:#26295f;overflow:hidden;box-shadow:0 .5cqw 1.5cqw #0004;transition:box-shadow .3s}
.av svg,.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avw{position:relative}
.seat.on .av,#me.on .av{box-shadow:0 0 3.2cqw .9cqw var(--glow,#ffe27a);animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 4.6cqw 1.4cqw var(--glow,#ffe27a)}}
.seat.out .av{filter:grayscale(.85) brightness(.8)}
.nm{display:flex;align-items:center;gap:1.3cqw;font:700 3cqw/1.1 system-ui;color:var(--ink);max-width:32cqw;direction:auto}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:27cqw}
.nm::before{content:"";flex:none;width:2.1cqw;height:2.1cqw;border-radius:50%;background:#6bd35b;box-shadow:0 0 1cqw #6bd35b}
.seat.out .nm::before{background:#9aa}
.dbg{position:absolute;right:-1.5cqw;top:-2cqw;width:5.6cqw;height:5.6cqw;border-radius:50%;background:#fff;color:#1d2150;font:800 3.3cqw/5.6cqw system-ui;text-align:center;box-shadow:0 .3cqw .8cqw #0004;z-index:2}
.fin{position:absolute;left:50%;bottom:-2.4cqw;transform:translateX(-50%);background:#ffd23f;color:#4a3300;border-radius:3cqw;padding:.3cqw 1.8cqw;font:800 3cqw/1.5 system-ui;white-space:nowrap;z-index:2;box-shadow:0 .3cqw .8cqw #0004}
.tmr{height:1.5cqw;width:16cqw;border-radius:2cqw;background:#0003;overflow:hidden}
.tmr i{display:block;height:100%;width:100%;background:var(--acc);border-radius:2cqw}
.tmr.low i{background:#ff5d5d}
#me{translate:0 var(--LX,0px);position:absolute;left:50%;top:80.7%;transform:translate(-50%,-50%);z-index:6}
#me .av{width:12.4cqw;height:12.4cqw}
#mepill{translate:0 var(--LX,0px);position:absolute;left:50%;top:88.2%;transform:translate(-50%,-50%);min-width:36cqw;text-align:center;padding:1.1cqw 6cqw;border-radius:6cqw;background:var(--acc);color:#fff;font:700 4.8cqw/1.3 system-ui,Tahoma;z-index:6;box-shadow:0 .8cqw 2cqw #0003;transition:background .4s,opacity .4s,transform .3s}
#mepill.dim{background:var(--pill);color:var(--ink);box-shadow:none;font-size:4.2cqw;opacity:.9}
#mepill.go{animation:bob 1s infinite}
@keyframes bob{50%{transform:translate(-50%,-50%) scale(1.06)}}
.dec{position:absolute;width:2.2cqw;height:.7cqw;border-radius:1cqw;background:var(--acc);opacity:.8;z-index:5}
/* ===== pill / pile ===== */
#pill{position:absolute;left:50%;top:51.4%;transform:translate(-50%,-50%);width:54cqw;min-height:13cqw;padding:2cqw 5cqw;border:.7cqw solid var(--pillb);background:var(--pill);border-radius:9cqw;text-align:center;font:600 5.2cqw/1.35 system-ui,Tahoma;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;backdrop-filter:blur(2px);transition:background .5s,border-color .5s}
#pill b{color:var(--acc);font-weight:800;font-size:6cqw;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:auto}
#stage.zt #pill b{color:#6ff0a6}
#pill.sm{font-size:4.4cqw}
#pile{position:absolute;left:50%;top:35.2%;width:30cqw;height:30cqw;transform:translate(-50%,-50%);z-index:4}
#pile .pr{position:absolute;inset:0}
#pile .pc{position:absolute;width:18.5cqw;left:50%;top:50%}
#pile .empty{position:absolute;left:50%;top:50%;width:18.5cqw;aspect-ratio:224/328;transform:translate(-50%,-50%);border:.8cqw dashed var(--pillb);border-radius:2.5cqw;opacity:.6}
.ray{position:absolute;width:5.5cqw;height:.9cqw;border-radius:1cqw;background:var(--acc);opacity:.75;z-index:3;animation:rp 1.8s infinite}
@keyframes rp{50%{opacity:.25}}
#hand{translate:0 calc(var(--LX,0px)*.5);position:absolute;left:0;right:0;top:59.6%;height:16%;z-index:5}
.hc{position:absolute;top:0;transform-origin:50% 120%;transform:rotate(var(--rot,0deg)) translateY(var(--ty,0));filter:drop-shadow(0 .6cqw 1cqw #0003)}
#mytm{translate:0 var(--LX,0px);position:absolute;left:50%;top:73.6%;transform:translateX(-50%);display:flex;align-items:center;gap:2cqw;z-index:5;opacity:.0;transition:opacity .3s}
#mytm.on{opacity:1}
#mytm .ic{width:5cqw;height:5cqw;border-radius:50%;border:.5cqw solid var(--acc);position:relative;background:var(--pill)}
#mytm .ic::after{content:"";position:absolute;left:50%;top:50%;width:28%;height:.5cqw;background:var(--ink)}#mytm .ic::before{content:"";position:absolute;left:50%;top:18%;width:.5cqw;height:36%;background:var(--ink);transform:translateX(-50%)}
#mytm .tmr{width:28cqw;height:3.2cqw;border:.5cqw solid var(--pillb)}
/* ===== fx / overlays ===== */
#fx{position:absolute;inset:0;z-index:20;pointer-events:none}
.fl{position:absolute;transform-style:preserve-3d;will-change:transform}
.fl>*{position:absolute;inset:0;backface-visibility:hidden}
.fl .f2{transform:rotateY(180deg)}
.star{position:absolute;width:3cqw;height:3cqw;background:#ffe27a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sp .8s ease-out forwards}
@keyframes sp{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}
.top{position:absolute;top:9cqw;width:11cqw;height:11cqw;border-radius:50%;background:#1b1f3dcc;color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:8;transform:translate(-50%,-50%);font-size:0}
#mn{left:11cqw}
#mchip{position:absolute;left:50%;top:8.8cqw;transform:translateX(-50%);background:#1b1f3dcc;color:#fff;border-radius:3cqw;padding:.6cqw 3cqw;font:700 2.9cqw/1.5 system-ui,Tahoma;white-space:nowrap;z-index:8;pointer-events:none;direction:rtl}
#mchip[hidden]{display:none}
#mn::before{content:"•••";font:900 5cqw/1 system-ui;letter-spacing:.3cqw}
#tt{position:absolute;left:50%;top:44%;transform:translateX(-50%);max-width:80%;background:#10142ee6;color:#fff;border-radius:4cqw;padding:2cqw 5cqw;font:600 4.2cqw/1.4 system-ui,Tahoma;z-index:40;text-align:center;direction:rtl;pointer-events:none;animation:ti .25s}
@keyframes ti{from{opacity:0;transform:translate(-50%,2cqw)}}
#tt[hidden]{display:none}
#menu{position:absolute;left:4%;top:18cqw;width:62%;background:#10142ef2;color:#fff;border-radius:4cqw;padding:3cqw;z-index:30;direction:rtl;font:500 3.7cqw/1.7 system-ui,Tahoma;box-shadow:0 2cqw 6cqw #0006}
#menu[hidden]{display:none}#menu button{width:100%;margin-bottom:2cqw;padding:2cqw;border-radius:3cqw;border:0;background:#ffffff1c;color:#fff;font:700 4cqw system-ui,Tahoma}
#menu p{opacity:.88}
#end{position:absolute;inset:0;z-index:35;background:#080b1ecc;display:flex;align-items:center;justify-content:center;direction:rtl;animation:ti .4s}
#end[hidden]{display:none}
#end .box{width:80%;background:var(--bgc,#fbf8ff);color:#262a66;border-radius:6cqw;padding:5cqw 5cqw 5.5cqw;text-align:center;box-shadow:0 3cqw 10cqw #0008}
#end.z .box{background:#10282a;color:#e9fff2}
#end h1{font:800 7cqw/1.3 system-ui,Tahoma;margin-bottom:1cqw}
#end .zc{width:19cqw;margin:2cqw auto}
#end .row{display:flex;justify-content:space-between;align-items:center;padding:1.6cqw 3cqw;margin-top:1.4cqw;border-radius:3cqw;background:#7b84d822;font:600 4.2cqw system-ui,Tahoma}
#end .row.lz{background:#3fbf7c33}
#end button{margin-top:4cqw;padding:2.4cqw 9cqw;border-radius:6cqw;border:0;background:var(--acc);color:#fff;font:800 4.6cqw system-ui,Tahoma}
#flash{position:absolute;inset:0;background:#7dff9a;opacity:0;z-index:25;pointer-events:none}
#stage.shake{animation:shk .5s}
@keyframes shk{20%{translate:-1.6cqw 0.6cqw}40%{translate:1.6cqw -.6cqw}60%{translate:-1cqw .4cqw}80%{translate:.8cqw 0}}

/* ===== chat ===== */
#cdock{position:absolute;left:3cqw;right:3cqw;bottom:calc(2.4cqw + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:2cqw;transform:translateY(var(--KY,0px))}
#chatp{height:min(64cqw,calc(100cqh - 46cqw));background:var(--cbg);border:.7cqw solid var(--pillb);border-radius:4cqw;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1.5cqw 5cqw #0004}
#chatp[hidden]{display:none}
#chatl{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2cqw;display:flex;flex-direction:column;gap:1.4cqw;user-select:text;-webkit-user-select:text;direction:rtl}
#chatl:empty::before{content:"ما فيه رسائل بعد… ابدأ الدردشة 👋";margin:auto;font:600 3.6cqw system-ui,Tahoma;opacity:.55;color:var(--ink)}
.cm{background:var(--cm);color:var(--ink);border-radius:3cqw;padding:1.1cqw 2.8cqw;font:500 3.8cqw/1.55 system-ui,Tahoma;align-self:flex-start;max-width:88%;unicode-bidi:plaintext;word-break:break-word}
.cm.me{align-self:flex-end;background:var(--cme)}
.cm b{color:var(--acc);margin-inline-end:1.6cqw;font-size:3.3cqw}
#emo2{display:none;grid-template-columns:repeat(8,1fr);background:var(--cbg);border:.6cqw solid var(--pillb);border-radius:3cqw;padding:1cqw}
#emo2.show{display:grid}#emo2 button{background:none;border:0;font-size:6.4cqw;height:9cqw;padding:0}
#cbar{position:relative;display:flex;align-items:center;gap:2cqw;height:10.4cqw;padding:0 1.6cqw;border-radius:6cqw;background:var(--cbg);border:.6cqw solid var(--pillb);box-shadow:0 .8cqw 2.4cqw #0003}
#cbar button{flex:none;width:7.6cqw;height:7.6cqw;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:none;font-size:5.6cqw;line-height:1}
#csd{background:var(--acc)!important}#csd svg{width:4.2cqw;height:4.2cqw;fill:#fff}
#cin{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--ink);font:max(16px,4cqw) system-ui,Tahoma;text-align:right;direction:rtl}
#cin::placeholder{color:var(--ink2);opacity:.75}
#cbadge{position:absolute!important;left:-1cqw;top:-1.8cqw;width:5.2cqw!important;height:5.2cqw!important;background:#e33!important;color:#fff;font:800 3cqw/5.2cqw system-ui!important;z-index:2}#cbadge[hidden]{display:none!important}
#msg{position:absolute;left:0;right:0;top:50%;text-align:center;font:700 4.6cqw system-ui,Tahoma;color:#fff;z-index:50;text-shadow:0 1px 4px #000;direction:rtl}
</style>
</head>
<body>
<div id="stage">
 <!-- ===== الخلفية الافتراضية: بنفسجي فاتح ===== -->

 </svg>
 <!-- ===== خلفية الزومبي: أخضر ===== -->
 <svg id="bgZ" class="bgl" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice">
  <defs><radialGradient id="gz" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#37705b"/><stop offset="1" stop-color="#244a3f"/></radialGradient></defs>
  <rect width="200" height="300" fill="url(#gz)"/>
  <rect x="18" y="38" width="64" height="9" rx="4.5" fill="#ffffff12"/><rect x="120" y="150" width="52" height="8" rx="4" fill="#ffffff10"/><rect x="40" y="196" width="48" height="8" rx="4" fill="#ffffff0f"/><rect x="128" y="52" width="44" height="7" rx="3.5" fill="#ffffff10"/>
  <path d="M-10 -10 H60 C66 14 40 24 36 40 C32 54 12 52 6 60 C-4 72 -10 60 -10 60Z" fill="#4f9b45"/>
  <path d="M-10 -10 H34 C36 8 20 14 14 24 C8 34 -10 30 -10 30Z" fill="#69b83f"/>
  <path d="M210 -10 H140 C132 10 156 22 166 34 C178 50 196 40 210 54Z" fill="#4f9b45"/>
  <path d="M210 92 C198 88 190 104 196 116 C200 124 210 124 210 124Z" fill="#4f9b45"/>
