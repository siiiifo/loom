:root{--CHB:0px;--W:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--CHB))*.7137));}
html.hc{--CHB:112px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#050403;color:#fff;font-family:'Cairo',system-ui,sans-serif}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + var(--CHB))}
#st{position:relative;flex:none;width:var(--W);height:calc(var(--W)*1572/1122);direction:ltr}
#st>img.plate{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 1.6%,#000 97.6%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 1.6%,#000 97.6%,transparent 100%)}
.abs{position:absolute}
button{all:unset;cursor:pointer}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.cell .g{position:absolute;inset:-1.2% -1.2%;width:102.4%;height:102.4%;opacity:0;transform:scale(.86);transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.cell.on .g{opacity:1;transform:scale(1)}
.cell .num{position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:100%;pointer-events:none}
.cell .num img{height:54.4%;width:auto;display:block}
.cell .num img+img{margin-left:-1.7%}
.cell .num .w{display:none}
.cell.on .num .y{display:none}
.cell.on .num .w{display:block}
.cell.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4%)}40%{transform:translateX(4%)}60%{transform:translateX(-3%)}80%{transform:translateX(3%)}}
#free{position:absolute;pointer-events:none}
#bt{position:absolute;transition:transform .12s,filter .12s}
#bt:active{transform:scale(.965);filter:brightness(1.25)}
#rowbtn{position:absolute}
.slot{position:absolute;transition:left .45s cubic-bezier(.3,.8,.3,1),opacity .35s;pointer-events:none}
.slot.old{opacity:0}
.slot.new .bl{filter:drop-shadow(0 0 7px rgba(255,200,60,.65))}
.ph{position:absolute;border-radius:50%;border:2px solid rgba(217,162,27,.28);background:radial-gradient(circle at 50% 40%,rgba(255,200,60,.07),rgba(0,0,0,.2));pointer-events:none}
#cd{position:absolute;display:flex;align-items:center;justify-content:center;color:#f6d77a;font-weight:800;text-shadow:0 0 12px rgba(255,190,50,.55);pointer-events:none;text-align:center}
.bl{position:relative;width:100%;height:100%}
.bl>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.bl>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fxw{position:absolute;left:0;top:0;will-change:transform}
.fxw .sh{position:absolute;left:8%;right:8%;bottom:-6%;height:12%;border-radius:50%;background:rgba(0,0,0,.75);filter:blur(7px)}
.fxw .sp{position:absolute;inset:0;will-change:transform;filter:drop-shadow(0 10px 16px rgba(0,0,0,.75))}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:none;align-items:center;justify-content:center}
#ov.show{display:flex}
#pn{width:min(92vw,420px);max-height:78dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#14110a,#050403);border:2px solid #d9a21b;border-radius:22px;box-shadow:0 0 28px rgba(255,190,50,.35),inset 0 0 22px rgba(255,190,50,.08);padding:14px 14px 16px;direction:rtl}
#ph{display:flex;align-items:center;justify-content:space-between;color:#f6d77a;font-weight:800;font-size:18px;margin-bottom:10px}
#px{width:34px;height:34px;border-radius:50%;border:2px solid #d9a21b;display:flex;align-items:center;justify-content:center;color:#f6d77a;font-size:18px;line-height:1}
#pg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;overflow:auto;padding:10px 8px;direction:ltr;-webkit-overflow-scrolling:touch}
#pg .it{width:calc((100% - 30px)/6);aspect-ratio:1/1;position:relative;flex:none}
#pg .it.nw .bl{filter:drop-shadow(0 0 3px rgba(255,200,60,.85))}
#pe{color:#bda55c;text-align:center;padding:18px 0;font-size:15px}
#ts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,20px);opacity:0;background:#0c0a05;color:#f6d77a;border:1.5px solid #d9a21b;border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;z-index:60;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 0 16px rgba(255,190,50,.3)}
#ts.show{opacity:1;transform:translate(-50%,0)}
#fin{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.86);text-align:center;padding:24px}
#fin.show{display:flex}
#fin b{font-size:46px;color:#f6d77a;text-shadow:0 0 24px rgba(255,190,50,.8);font-weight:800;direction:ltr}
#fin span{margin-top:10px;font-size:18px;color:#d8c27a;font-weight:800}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:42px;height:42px;border-radius:50%;border:2px solid #d9a21b;background:rgba(0,0,0,.65);color:#f6d77a;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:35;box-shadow:0 0 12px rgba(255,190,50,.3)}
#mute.off{opacity:.65;border-color:#7a6a3a}
/* ===== المحادثة ===== */
#cbar,#cstrip,#cfeed{display:none}
#cbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 14px env(safe-area-inset-bottom,0px);align-items:center;gap:12px;background:#000;direction:rtl;z-index:45}
html.hc #cbar{display:flex}
#cico{flex:none;width:40px;height:40px;margin:0 -6px 0 -4px;display:flex;align-items:center;justify-content:center;color:#8fd14f;transition:color .15s,transform .1s}
#cico:active{transform:scale(.9)}
#cico svg{width:28px;height:28px;display:block}
#cico.off{color:#ff4b4b}
#cin{flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;margin:0;padding:0;font:600 16px/40px Cairo,system-ui,sans-serif;color:#ececf1;text-align:right;direction:rtl;-webkit-user-select:text;user-select:text;caret-color:#8fd14f;-webkit-appearance:none;appearance:none;border-radius:0}
#cin::placeholder{color:#cfcfd6;opacity:1}
html.cx #cin::placeholder{color:#8a8a92}
#cstk,#csnd{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
#cstk svg,#csnd svg{width:28px;height:28px;display:block}
#csnd svg path{fill:#7f8bb8;stroke:#7f8bb8;transition:.15s}
#csnd.on svg path{fill:#8fa6ff;stroke:#8fa6ff}
#cstk svg path{stroke:#8b93aa;fill:none}
html.cx #cstk,html.cx #csnd{opacity:.4}
html.cx #cstrip,html.cx #cfeed{display:none!important}
/* شريط آخر رسالة فوق خانة الكتابة (يطلع لحظات ويختفي بدون ما يغطي اللوحة) */
#cstrip{position:fixed;left:0;right:0;bottom:calc(var(--kb,0px) + 58px + env(safe-area-inset-bottom,0px));height:62px;align-items:flex-end;padding:0 12px 6px;pointer-events:none;z-index:41;direction:ltr}
html.hc #cstrip{display:flex}
html.co #cstrip{display:none}
#cstrip .mr{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
#cstrip .mr.on{opacity:1;transform:none}
#cstrip .mb{padding:5px 14px 6px;font-size:14px;line-height:1.35;max-width:66vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cstrip .mn{margin:0 0 2px;font-size:12px}
#cstrip .av{width:34px;height:34px;font-size:15px}
/* قائمة الرسائل (تنفتح بالضغط على الخانة) */
#cfeed{position:fixed;left:0;right:0;top:0;bottom:calc(var(--kb,0px) + 58px + env(safe-area-inset-bottom,0px));z-index:44;flex-direction:column;background:rgba(0,0,0,.55);padding-top:env(safe-area-inset-top,0px)}
#cfeed.open{display:flex}
#cmsgs{margin-top:auto;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 12px 12px;display:flex;flex-direction:column;gap:14px;direction:ltr}
#cmsgs:empty::before{content:'ما فيه رسائل للحين.. قل مرحباً 👋';color:#9a9aa3;font-size:14px;text-align:center;direction:rtl;padding:18px 0}
#ctray{display:none;flex:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px 10px 10px;background:rgba(18,18,22,.96);border-top:1px solid rgba(255,255,255,.08)}
#ctray.show{display:grid}
#ctray button{display:flex;align-items:center;justify-content:center;height:40px;font-size:25px;border-radius:10px}
#ctray button:active{background:rgba(255,255,255,.12)}
/* الرسالة: صورة دائرية + اسم أبيض فوق الفقاعة */
.mr{display:flex;align-items:flex-start;gap:9px;max-width:92%}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 18px/1 Cairo,system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 0 1.5px rgba(255,255,255,.18)}
.av.hp{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent;text-shadow:none}
.mc{min-width:0}
.mn{font-size:14px;font-weight:800;color:#fff;margin:1px 4px 4px;direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.mb{background:rgba(34,34,36,.96);color:#f4f4f6;border-radius:18px;padding:9px 18px;font-size:15px;line-height:1.55;unicode-bidi:plaintext;text-align:center;word-break:break-word;overflow-wrap:anywhere}
.mb.em{background:none;border:0!important;font-size:36px;line-height:1.15;padding:0 2px;box-shadow:none!important;text-shadow:none!important}
/* رسائل المشرفين: إطار ذهبي */
.mr.adm .av{box-shadow:0 0 0 2px #ffd24a,0 0 10px rgba(255,210,74,.55)}
.mr.adm .mb:not(.em){position:relative;color:#f4f4f6;border:3px solid transparent;border-radius:30px;padding:9px 24px 10px;
 background:linear-gradient(#08020e,#08020e) padding-box,linear-gradient(90deg,#b8860b,#ffd24a,#fff1a8,#ffd24a,#b8860b) border-box;
 box-shadow:0 0 12px rgba(255,210,74,.5),0 0 22px rgba(217,162,27,.3)}
.mr.adm .mb:not(.em)::before,.mr.adm .mb:not(.em)::after{content:'';position:absolute;top:50%;width:7px;height:56%;transform:translateY(-50%);border-radius:3px;background:linear-gradient(#d9a21b,#ffe98a,#d9a21b);opacity:.95}
.mr.adm .mb:not(.em)::before{left:5px}
.mr.adm .mb:not(.em)::after{right:5px}

 g[2][2]=0;return g;}

 try{var p=au.play();if(p&&p.catch)p.catch(function(){unlocked=false;});}catch(e){}
 try{var p2=vo.play();if(p2&&p2.catch)p2.catch(function(){});}catch(e){}
 try{if(synth){var u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u);}}catch(e){}}

function sayText(n){var W={B:'Bee',I:'Eye',N:'Enn',G:'Gee',O:'Oh'};return W[letter(n)]+'... '+n+'.';}
function playOnline(txt){try{au.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&ttsspeed=0.45&q='+encodeURIComponent(txt);au.volume=1;var p=au.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function speakText(txt){
 if(muted)return;
 var ok=false;
 try{if(synth&&typeof SpeechSynthesisUtterance!=='undefined'){
  if(synth.speaking||synth.pending)synth.cancel();
  if(synth.paused)synth.resume();
  var u=new SpeechSynthesisUtterance(txt);u.lang='en-US';if(voiceEN)u.voice=voiceEN;u.rate=0.8;u.volume=1;u.pitch=(voiceMale||voiceSaved)?1:0.85;
  synth.speak(u);ok=true;}}catch(e){}
 // إذا ما اشتغل الصوت المدمج بالجهاز، استخدم صوت أونلاين
 setTimeout(function(){if(muted)return;var started=false;try{started=synth&&(synth.speaking||synth.pending);}catch(e){}
  if(!ok||!started)playOnline(txt);},450);}
function speak(n){
 if(muted)return;
 var fell=false;function fb(){if(fell)return;fell=true;speakText(sayText(n));}
 try{if(synth&&(synth.speaking||synth.pending))synth.cancel();
  vo.onerror=fb;vo.onended=null;vo.src=VOICE_BASE+n+'.mp3';vo.volume=1;
  var p=vo.play();if(p&&p.catch)p.catch(fb);}catch(e){fb();}
}
/* ===== الكرة تتدحرج مباشرة إلى مكانها في الشريط ===== */
var fx=document.getElementById('fx'),queue=[],busy=false;
function spawn(n,done){
 var sr=st.getBoundingClientRect(),vw=window.innerWidth;
 var D=SD/PW*sr.width;
 var sx=sr.left+SLOTX[4]/PW*sr.width,sy=sr.top+SY/PH*sr.height;
 var w=document.createElement('div');w.className='fxw';w.style.width=w.style.height=D+'px';w.style.marginLeft=w.style.marginTop=(-D/2)+'px';
 w.innerHTML='<div class="sp">'+ballHTML(n)+'</div>';fx.appendChild(w);
 var sp=w.querySelector('.sp');
 var startX=vw+D,dist=startX-sx,turns=Math.max(1,Math.round(dist/(Math.PI*D))),rot=-turns*360,T=2000;
 shiftSlots();speak(n);
 var a1=w.animate([{transform:'translate('+startX+'px,'+sy+'px)'},{transform:'translate('+sx+'px,'+sy+'px)'}],{duration:T,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
 sp.animate([{transform:'rotate(0deg)'},{transform:'rotate('+rot+'deg)'}],{duration:T,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
 setTimeout(function(){hap('light');},T*0.85);
 a1.onfinish=function(){insertSlot(n);if(w.parentNode)w.parentNode.removeChild(w);done&&done();};
}
function pump(){if(busy||!queue.length)return;busy=true;var n=queue.shift();
 if(queue.length>2){ // تأخر كبير: أضف بدون أنيميشن
  addSlot(n);busy=false;pump();return;}
 spawn(n,function(){busy=false;pump();});}

/* ===== مشترك MQTT خفيف (WebSocket): البديل الأساسي لـ ntfy لما يرفض الاستضافة (429) ===== */
function rayMqtt(filters,onMsg,urls){
 urls=urls||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
 var PFX='rayrelay/';
 filters=filters.map(function(f){return PFX+f;});
 urls.forEach(function(u){connect(u);});
 function connect(url){
  var ws=null,buf=new Uint8Array(0),ping=0,retry=0,sched=false;
  function cat(a,b){var c=new Uint8Array(a.length+b.length);c.set(a,0);c.set(b,a.length);return c;}
  function rl(n){var o=[];do{var d=n%128;n=Math.floor(n/128);if(n)d|=128;o.push(d);}while(n);return o;}
  function str(s){var e=new TextEncoder().encode(s),a=[e.length>>8,e.length&255];for(var i=0;i<e.length;i++)a.push(e[i]);return a;}
  function send(a){try{ws.send(new Uint8Array(a));}catch(e){}}
  function later(){if(sched)return;sched=true;setTimeout(function(){sched=false;open();},Math.min(20000,1500*(++retry)));}
  function open(){
   try{ws=new WebSocket(url,'mqtt');}catch(e){later();return;}
   ws.binaryType='arraybuffer';buf=new Uint8Array(0);
   ws.onopen=function(){var vh=[0,4,77,81,84,84,4,2,0,30],pl=str('rb'+Math.random().toString(36).slice(2,10));send([0x10].concat(rl(vh.length+pl.length),vh,pl));};
   ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
   ws.onclose=function(){clearInterval(ping);later();};
   ws.onerror=function(){try{ws.close();}catch(e){}};
  }
  function parse(){
   while(buf.length>=2){
    var i=1,mul=1,len=0,b;
    do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
    if(buf.length<i+len)return;
    var hdr=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);
    var t=hdr>>4;
    if(t===2){ /* CONNACK → اشتراك */
     if(body[1]!==0){try{ws.close();}catch(e){}return;}
     var sub=[0,1],k;for(k=0;k<filters.length;k++)sub=sub.concat(str(filters[k]),[0]);
     send([0x82].concat(rl(sub.length),sub));
     clearInterval(ping);ping=setInterval(function(){send([0xC0,0]);},20000);retry=0;
    }else if(t===3){ /* PUBLISH */
     var qos=(hdr>>1)&3,tl=(body[0]<<8)|body[1],off=2+tl;
     var topic=new TextDecoder().decode(body.slice(2,off));
     if(qos)off+=2;
     try{onMsg(topic.slice(PFX.length),new TextDecoder().decode(body.slice(off)));}catch(e){}
    }
   }
  }
  open();
 }
}

/* ===== قناة إنهاء الجولة (ntfy + MQTT) ===== */
(function(){
 if(!RELAY||demo)return;
 var es=null,pt=null;
 function stop(){if(ended)return;ended=true;try{es&&es.close();}catch(e){}clearInterval(pt);finish('انتهت الجولة','فاز لاعب آخر');}
 function isEnd(m){return !!m&&/end|win/i.test(m);}
 if(window.EventSource){try{es=new EventSource('https://ntfy.sh/'+RELAY+'/sse?since=all');
  es.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(isEnd(d.message))stop();}catch(e){}};}catch(e){}}
 function poll(){if(ended)return;
  try{fetch('https://ntfy.sh/'+RELAY+'/json?poll=1&since=all',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
   String(t).split('\n').forEach(function(l){if(!l)return;try{var d=JSON.parse(l);if(d.event==='message'&&isEnd(d.message))stop();}catch(e){}});}).catch(function(){});}catch(e){}}
 pt=setInterval(poll,2000);poll();
 rayMqtt([RELAY],function(t,p){if(isEnd(p))stop();});
 document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
})();
/* ===== محادثة اللاعبين (ntfy) =====
   الكل يشوف الرسائل. الكتابة: المشرفين دائماً (a=1)، والأعضاء فقط لو البوت فعّلها (c=1).
   الأيقونة الخضراء يسار الخانة تقفل الرسائل عند اللاعب نفسه (تصير حمراء) وترجع تفتحها. */
(function(){
  if(!RELAY||demo)return;
  var $=function(i){return document.getElementById(i);};
  var H=document.documentElement,CT=RELAY+'c';
  var NAME=String(q.get('n')||'لاعب').replace(/[\u0000-\u001f]/g,'').trim().slice(0,20)||'لاعب';
  var CAN=q.get('c')==='1',ADM=q.get('a')==='1',UID=String(q.get('u')||'').replace(/[^0-9]/g,'').slice(0,20);
  var AVK='rb_av_'+RELAY,AV={};try{AV=JSON.parse(localStorage.getItem(AVK)||'{}')||{};}catch(e){AV={};}
  function saveAv(){try{localStorage.setItem(AVK,JSON.stringify(AV));}catch(e){}}
  /* صور المشاركين: uid -> data:image (يرسلها البوت عبر قناة ntfy، ولو ما فيه صورة يظهر الحرف الأول) */
  function setAv(el,u){var d=AV[u];if(!d)return;el.style.backgroundImage='url("'+d+'")';el.classList.add('hp');}
  var me=Math.random().toString(36).slice(2,9),seen={},lastSend=0,isOpen=false,stripT=0,errT=0,OFF=false;
  try{OFF=localStorage.getItem('rb_chatoff')==='1';}catch(e){}
  H.classList.add('hc');
  var feed=$('cfeed'),box=$('cmsgs'),tray=$('ctray'),strip=$('cstrip'),inp=$('cin'),snd=$('csnd'),stk=$('cstk'),bar=$('cbar'),ico=$('cico');
  if(!CAN){inp.readOnly=true;inp.placeholder='المحادثة للمشرفين فقط';snd.style.opacity=stk.style.opacity='.35';}
  var EMO=['😂','🔥','👏','😍','😎','🎉','❤️','😮','🙏','😡','😭','🤩','👍','💯','🍀','🏆'];
  EMO.forEach(function(e){var b=document.createElement('button');b.textContent=e;b.addEventListener('pointerdown',function(ev){ev.preventDefault();});b.addEventListener('click',function(){doSend(e);});tray.appendChild(b);});
  var emoRx=null;try{emoRx=new RegExp('^[\\p{Extended_Pictographic}\\u200d\\ufe0f\\s]{1,16}$','u');}catch(e){}
  function isEmo(t){return !!(emoRx&&emoRx.test(t));}
  function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return h%360;}
  function mk(m){
   var r=document.createElement('div');r.className='mr'+(m.a?' adm':'');
   var av=document.createElement('div');av.className='av';av.style.background='hsl('+hue(m.n)+',55%,42%)';
   av.textContent=Array.from(m.n)[0]||'؟';
   if(m.u){av.setAttribute('data-u',m.u);setAv(av,m.u);}
   var c=document.createElement('div');c.className='mc';
   var n=document.createElement('div');n.className='mn';n.textContent=(m.a?'👑 ':'')+m.n;
   var b=document.createElement('div');b.className='mb'+(isEmo(m.m)?' em':'');b.textContent=m.m;
   c.appendChild(n);c.appendChild(b);r.appendChild(av);r.appendChild(c);return r;}
  function toEnd(){box.scrollTop=box.scrollHeight;}
  function addMsg(m,quiet){
   if(OFF)return; /* مقفولة عند هذا اللاعب: ما تظهر ولا تنحفظ */
   box.appendChild(mk(m));
   while(box.children.length>120)box.removeChild(box.firstChild);
   if(isOpen)toEnd();else if(!quiet)showStrip(m);}
  function showStrip(m){
   strip.innerHTML='';var r=mk(m);strip.appendChild(r);
   requestAnimationFrame(function(){requestAnimationFrame(function(){r.classList.add('on');});});
   clearTimeout(stripT);stripT=setTimeout(function(){r.classList.remove('on');setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);},300);},5500);}
  function openFeed(focus){
   if(OFF)return;
   if(!isOpen){isOpen=true;feed.classList.add('open');H.classList.add('co');strip.innerHTML='';setTimeout(toEnd,30);}
   if(focus&&CAN){tray.classList.remove('show');}
  }
  function closeFeed(){isOpen=false;feed.classList.remove('open');H.classList.remove('co');tray.classList.remove('show');inp.blur();}
  function offToast(){toast('المحادثة مقفلة عندك — اضغط الأيقونة لفتحها');}
  /* الزر الأخضر/الأحمر */
  function paintIco(){ico.classList.toggle('off',OFF);H.classList.toggle('cx',OFF);}
  paintIco();
  ico.addEventListener('pointerdown',function(ev){ev.preventDefault();});
  ico.addEventListener('click',function(ev){
   ev.stopPropagation();OFF=!OFF;
   try{localStorage.setItem('rb_chatoff',OFF?'1':'0');}catch(e){}
   if(OFF){closeFeed();clearTimeout(stripT);strip.innerHTML='';box.innerHTML='';}
   paintIco();hap('light');toast(OFF?'تم قفل المحادثة':'تم فتح المحادثة');});
  inp.addEventListener('focus',function(){if(OFF){inp.blur();offToast();return;}tray.classList.remove('show');openFeed(true);});
  inp.addEventListener('input',function(){snd.classList.toggle('on',!!inp.value.trim());});
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doSend(inp.value,true);}});
  bar.addEventListener('click',function(ev){if(ev.target===ico||ico.contains(ev.target)||ev.target===stk||stk.contains(ev.target)||ev.target===snd||snd.contains(ev.target))return;if(OFF){offToast();return;}openFeed(true);if(CAN)inp.focus();});
  [stk,snd].forEach(function(b){b.addEventListener('pointerdown',function(ev){ev.preventDefault();});});
  stk.addEventListener('click',function(){if(OFF){offToast();return;}openFeed(false);if(!CAN){toast('المحادثة للمشرفين فقط');return;}inp.blur();tray.classList.toggle('show');hap('light');});
  snd.addEventListener('click',function(){doSend(inp.value,true);});
  feed.addEventListener('click',function(ev){if(ev.target===feed||ev.target===box)closeFeed();});
  function doSend(t,fromInput){
   if(OFF){offToast();return;}
   if(!CAN){toast('المحادثة للمشرفين فقط');return;}
   t=String(t||'').replace(/\s+/g,' ').trim().slice(0,100);if(!t)return;
   var now=Date.now();if(now-lastSend<1500){toast('انتظر ثانية');return;}
   lastSend=now;var id=me+now.toString(36);seen[id]=1;
   var m={i:id,n:NAME,m:t,a:ADM?1:0,u:UID};
   addMsg(m,true);if(fromInput){inp.value='';snd.classList.remove('on');}
   hap('light');
   try{fetch('https://ntfy.sh/'+CT,{method:'POST',body:JSON.stringify(m)}).catch(function(){if(Date.now()-errT>8000){errT=Date.now();toast('تعذّر إرسال الرسالة');}});}catch(e){}
  }
  try{var es=new EventSource('https://ntfy.sh/'+CT+'/sse');
   es.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(!d||!d.message)return;
    if(d.time&&d.time<Date.now()/1000-60)return;
    var o=JSON.parse(d.message);if(!o||typeof o.m!=='string'||!o.i||seen[o.i])return;seen[o.i]=1;
    addMsg({i:o.i,n:String(o.n||'لاعب').slice(0,20),m:o.m.slice(0,100),a:o.a?1:0,u:String(o.u||'').replace(/[^0-9]/g,'').slice(0,20)});}catch(e){}};}catch(e){}
  /* قناة الصور: البوت ينشر مصغّرات صور اللاعبين، وتتحدّث الرسائل الظاهرة فور وصولها */
  function eatAv(txt){var got=false;try{var d=JSON.parse(txt);if(!d||!d.message)return;var o=JSON.parse(d.message);if(!o||!Array.isArray(o.v))return;
   o.v.forEach(function(x){if(!x||x.length<2)return;var u=String(x[0]).replace(/[^0-9]/g,''),b=String(x[1]);if(!u||!/^[A-Za-z0-9+\/=]+$/.test(b)||b.length>6000)return;var v='data:image/jpeg;base64,'+b;if(AV[u]!==v){AV[u]=v;got=true;}});}catch(e){}
   if(got){saveAv();paintAv();}}
  function paintAv(){var els=document.querySelectorAll('.av[data-u]');for(var k=0;k<els.length;k++)setAv(els[k],els[k].getAttribute('data-u'));}
  try{var ea=new EventSource('https://ntfy.sh/'+RELAY+'p/sse?since=all');ea.onmessage=function(ev){eatAv(ev.data);};}catch(e){}
  /* احتياط: لو فاتتك رسالة صور (انقطاع/تأخر)، نسأل القناة كل 8 ثواني طالما فيه رسالة بدون صورة */
  function pollAv(){if(document.hidden)return;
   var miss=document.querySelectorAll('.av[data-u]:not(.hp)');if(!miss.length)return;
   try{fetch('https://ntfy.sh/'+RELAY+'p/json?poll=1&since=all',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    String(t).split('\n').forEach(function(l){if(l)eatAv(l);});}).catch(function(){});}catch(e){}}
  setInterval(pollAv,8000);
  rayMqtt([RELAY+'/p/#'],function(t,p){eatAv(JSON.stringify({message:p}));});
  /* الكيبورد: نرفع الشريط فوقه (iOS يصغّر النافذة المرئية فقط) */
  var vv=window.visualViewport;
  function kb(){if(!vv)return;var off=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));H.style.setProperty('--kb',off+'px');if(isOpen)toEnd();}
  if(vv){vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}
})();

var shown=0,first=true;
function tick(){
 var n=calledCount();
 if(n===0){var left=Math.ceil(BEGIN-Date.now()/1000);cd.textContent=left>0?('تبدأ اللعبة بعد '+left):'';}
 else if(cd.textContent)cd.textContent='';
 if(first){first=false;shown=n;called=ORDER.slice(0,n);called.slice(-5).forEach(function(v){addSlot(v);});
  slots.forEach(function(s){s.el.classList.remove('new');});if(slots.length)slots[slots.length-1].el.classList.add('new');return;}
 while(shown<n){var v=ORDER[shown];called.push(v);shown++;queue.push(v);}
 pump();
 if(shown>=75&&!queue.length&&!busy&&!ended){/* انتهت الأرقام */}
}
