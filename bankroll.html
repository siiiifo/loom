<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>بنك رول</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#07142b;color:#e8f0ff;font:13px/1.4 system-ui,Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:6px;user-select:none;-webkit-user-select:none}
#stt{font-size:11px;color:#8fb4ff;min-height:15px}
#board{direction:ltr;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);gap:2px;width:min(100%,520px);aspect-ratio:1}
.t{position:relative;background:#14305a;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8.5px;line-height:1.15;overflow:hidden;direction:rtl;padding:1px}
.t i{position:absolute;top:0;left:0;right:0;height:5px}
.t b{margin-top:5px;font-weight:600}.t s{text-decoration:none;color:#ffe48a}.t em{font-style:normal;font-size:7px}
.t .ic{font-size:15px;margin:0}
.tk{position:absolute;bottom:1px;left:0;right:0;display:flex;gap:1px;justify-content:center}
.tk u{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;display:block}
#c{grid-area:2/2/8/8;background:radial-gradient(#10315f,#0a1d3c);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:auto;direction:rtl;font-size:12px;text-align:center}
#dice{font-size:40px;line-height:1}.roll{animation:sh .5s}
@keyframes sh{0%{transform:rotate(0)}25%{transform:rotate(-40deg) scale(1.2)}75%{transform:rotate(40deg) scale(1.2)}100%{transform:rotate(0)}}
button{background:#2f7bff;color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit;font-weight:700;margin:1px}
button.g{background:#2a3f66}button.r{background:#d94540}
.lg{font-size:10.5px;color:#9db8e8}
#pl{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,520px);margin-top:8px}
.pc{border:2px solid;border-radius:10px;padding:5px 8px;background:#0e2447;font-size:12px}
.pc.on{background:#17407a}.pc.x{opacity:.4}.pc b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sh{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#sh[hidden]{display:none}
.bx{background:#10285075;background:#0f2447;border:1px solid #2f7bff;border-radius:14px;padding:14px;width:min(92%,380px);max-height:80vh;overflow:auto;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e3a68}
#tt{position:fixed;bottom:14px;background:#000d;padding:8px 12px;border-radius:10px;font-size:12px;max-width:90%;text-align:center}
#tt[hidden]{display:none}

/* ===== المحادثة ===== */
body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#tt{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
#cbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:10px;background:#050d1e;border-top:1px solid #1e3a68;direction:rtl;z-index:45}
#cico{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#34d058;background:none;padding:0;margin:0;border-radius:50%}
#cico svg{width:26px;height:26px}
#cico.off{color:#ff4b4b}
#cin{flex:1;min-width:0;height:40px;border:0;outline:0;background:#0e2447;border-radius:20px;padding:0 14px;font:600 15px system-ui,Tahoma,sans-serif;color:#ececf1;text-align:right;direction:rtl;-webkit-user-select:text;user-select:text;caret-color:#34d058;-webkit-appearance:none;appearance:none}
#cin::placeholder{color:#7f8bb8;opacity:1}
#cstk,#csnd{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:none;font-size:22px;border-radius:50%}
#csnd{color:#7f8bb8;font-size:20px}
#csnd.on{color:#2f7bff}
html.cx #cin,html.cx #cstk,html.cx #csnd{opacity:.4}
#cstrip{position:fixed;left:0;right:0;bottom:calc(var(--kb,0px) + 62px + env(safe-area-inset-bottom,0px));padding:0 10px;pointer-events:none;z-index:41;direction:ltr;display:flex;flex-direction:column;gap:4px}
html.co #cstrip,html.cx #cstrip{display:none}
#cstrip .mr{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
#cstrip .mr.on{opacity:1;transform:none}
#cstrip .mb{max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cfeed{display:none;position:fixed;left:0;right:0;top:0;bottom:calc(var(--kb,0px) + 58px + env(safe-area-inset-bottom,0px));z-index:44;flex-direction:column;background:rgba(0,0,0,.6);padding-top:env(safe-area-inset-top,0px)}
#cfeed.open{display:flex}
html.cx #cfeed{display:none!important}
#cmsgs{margin-top:auto;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 12px 12px;display:flex;flex-direction:column;gap:12px;direction:ltr}
#cmsgs:empty::before{content:'ما فيه رسائل للحين.. قل مرحباً 👋';color:#9a9aa3;font-size:14px;text-align:center;direction:rtl;padding:18px 0}
#ctray{display:none;flex:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px 10px 10px;background:rgba(10,20,40,.97);border-top:1px solid #1e3a68}
#ctray.show{display:grid}
#ctray button{display:flex;align-items:center;justify-content:center;height:40px;font-size:24px;border-radius:10px;background:none;padding:0;margin:0}
#ctray button:active{background:rgba(255,255,255,.12)}
.mr{display:flex;align-items:flex-start;gap:8px;max-width:92%}
.mr.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 16px/1 system-ui,Tahoma,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 0 2px var(--pc,#2f7bff)}
.mc{min-width:0}
.mn{font-size:12.5px;font-weight:800;color:#fff;margin:0 4px 3px;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.mb{background:rgba(24,38,70,.97);color:#f4f4f6;border-radius:16px;padding:8px 14px;font-size:14.5px;line-height:1.5;unicode-bidi:plaintext;text-align:center;word-break:break-word;overflow-wrap:anywhere;border:1.5px solid var(--pc,#2f7bff)}

/* ===== RAY theme (from mockup) ===== */
body{background:radial-gradient(120% 55% at 50% 0,#0d2a5c 0,#07142b 50%,#050d1e 100%);padding:0 6px}
#hd{direction:ltr;width:min(100%,600px);display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid #1d6fd8;border-bottom:1px solid #1d6fd8;box-shadow:0 0 14px -4px #2f9bff;background:#04112a;margin:6px 0 4px}
#lg{flex:none;width:105px;height:56px;background:var(--im-logo) center/100% 100% no-repeat;mix-blend-mode:lighten}
#gl{flex:1;direction:rtl;text-align:center;font-size:11px;font-weight:700;color:#d6e6ff;border:1.5px solid #2a7fe8;border-radius:12px;padding:6px 8px;background:linear-gradient(#0d2a55,#071836);box-shadow:0 0 12px #1d6fe066 inset,0 0 8px #1d6fe055}
#gl b{display:block;color:#4dff6b;font-size:17px}
#board{grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));--u:calc(min(100vw - 12px,600px)/8);width:min(100%,600px);aspect-ratio:847/930;gap:3px}
.t{border-radius:calc(var(--u)*.1);color:#fff;padding:0;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #0004,inset 0 2px 0 #ffffff55,0 2px 0 #0008}
.t.c{justify-content:space-around;padding:calc(var(--u)*.06) 1px;text-shadow:0 1px 2px #0009}
.t.c s{order:-1;color:#fff;font-size:calc(var(--u)*.17);font-weight:800}
.t.c b{margin:0;font-size:calc(var(--u)*.135);font-weight:800;line-height:1.1}
.t em{position:absolute;top:1px;right:2px;font-size:calc(var(--u)*.16)}
.tk{bottom:calc(var(--u)*.04)}
.tk u{width:calc(var(--u)*.2);height:calc(var(--u)*.2);border:2px solid #fff;box-shadow:0 1px 4px #000c}
#c{min-height:0;min-width:0;overflow:auto;position:relative;background:var(--im-panel) center/100% 100% no-repeat;border:0;border-radius:0;padding:5% 5% 19%;gap:6px;justify-content:flex-start}
.rd{background:#04122acc;border-radius:10px;padding:2px 10px;color:#9cc4ff;font-size:11px}
.mid{margin-top:auto;background:#04122ad9;border:1px solid #1d6fd8;border-radius:12px;padding:6px 10px;max-width:96%}
.lgs div{background:#04122aa8;border-radius:8px;padding:1px 6px;margin-top:2px;font-size:9.5px}
#dice{grid-area:7/2/8/8;justify-self:center;align-self:end;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);z-index:2;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));padding:14%;background:linear-gradient(#fff,#e3e8f2);border-radius:20%;box-shadow:0 4px 8px #0009,inset 0 -3px 0 #c9d1e0}
#dice u{display:block;border-radius:50%;margin:10%}#dice u.on{background:radial-gradient(#ffd96a,#e9a100)}
#pl{direction:ltr;width:min(100%,600px);margin-top:10px;gap:10px}
.pc{background:none!important;border:0!important;display:flex;flex-direction:column;align-items:center;padding:0}
.pc.x{opacity:.4}
.cr{height:22px;display:flex;align-items:center;gap:5px;font-size:15px}
.bar{width:64px;height:8px;border-radius:5px;background:#12305c;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ffe35c,#f0a800)}
.pr{display:flex;align-items:center;gap:10px}.pc:nth-child(even) .pr{flex-direction:row-reverse}
.disc{width:34px;height:34px;border-radius:50%;background:linear-gradient(#fff,#cfd8e6);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #8fa0bb,0 5px 8px #0008}
.disc i{width:22px;height:22px;border-radius:50%;background:var(--pc);box-shadow:inset 0 2px 3px #fff8,inset 0 -2px 3px #0005}
.pa{width:62px;height:62px;border-radius:50%;border:3px solid var(--pc);background:radial-gradient(#1c4a8a,#0a1d3c);display:flex;align-items:center;justify-content:center;font:800 26px system-ui;box-shadow:0 0 12px var(--pc)}
.pc.on .pa{box-shadow:0 0 0 3px #ffd33d,0 0 16px #ffd33d}
.pn{font-size:16px;font-weight:700;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.pm{font-size:18px;font-weight:800;white-space:nowrap}.pm span{color:#4dff6b}
#ft{width:min(100%,600px);aspect-ratio:853/115;background:var(--im-foot) center/100% 100% no-repeat;margin:12px 0 4px}
</style>
</head>
<body>
<div id="hd"><div id="lg"></div><div id="gl">صافي الثروة للفوز<b>—</b></div></div>
<div id="stt"></div>
<div id="board"></div>
<div id="pl"></div>
<div id="ft"></div>
<div id="sh" hidden></div>
<div id="tt" hidden></div>
<div id="cstrip"></div>
<div id="cfeed"><div id="cmsgs"></div><div id="ctray"></div></div>
<div id="cbar">
<button id="cico" aria-label="المحادثة"><svg viewBox="0 0 28 28" width="26" height="26"><path d="M5 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3v4l-5-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 10h10M9 14h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<input id="cin" type="text" maxlength="100" placeholder="اكتب رسالة..." enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="cstk" aria-label="ملصقات">😊</button>
<button id="csnd" aria-label="إرسال">➤</button>
</div>
<script>
const Q=new URLSearchParams(location.search),R=Q.get('r'),U=+Q.get('u'),T=Q.get('t'),S=Q.get('s');
const COL={blue:'#2f7bff',red:'#ff4a4a',green:'#34d058',yellow:'#ffd33d'};
const ICO={airport:'✈️',power:'💡',train:'🚆',harbor:'⛵'},KI={start:'🏁',chance:'❓',jail:'🔒',auction:'🔨'};
const $=id=>document.getElementById(id);
const f=n=>'$'+Number(n).toLocaleString('en-US');
let lastCur=null,TM=0;
function setDice(n){const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n||4];const d=$('dice');if(d)d.innerHTML=Array.from({length:9},(_,k)=>`<u class="${P.includes(k)?'on':''}"></u>`).join('');}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
let B=[],st=null,ws,tiles=[],shown={},walking=false,off=0,lastDice=0,shOpen=false,cEl;

function pos(i){if(i<8)return[8,i+1];if(i<14)return[15-i,8];if(i<22)return[1,8-(i-14)];return[i-20,1];}
function toast(m){const t=$('tt');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500);}
function val(i){const t=B[i];return t.price+(t.kind==='city'?(st.houses[i]||0)*t.build_cost:0);}

function conn(){
  if(!R||!U||!T||!S){$('stt').textContent='رابط غير صالح، افتح اللعبة من البوت';return;}
  $('stt').textContent='جاري الاتصال…';
  ws=new WebSocket(`wss://${S}/ws?r=${R}&u=${U}&t=${T}`);
  ws.onopen=()=>$('stt').textContent='🟢 متصل مباشر';
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='hello'){B=m.board;build();}
    else if(m.t==='state')onState(m.s);
    else if(m.t==='err')toast(m.m);};
  ws.onclose=()=>{$('stt').textContent='🔴 انقطع الاتصال… إعادة المحاولة';setTimeout(conn,1500);};
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

function build(){
  const bd=$('board');bd.innerHTML='';tiles=[];
  B.forEach((t,i)=>{
    const el=document.createElement('div');el.className='t';
    const [r,c]=pos(i);el.style.gridArea=`${r}/${c}`;
    let h='';
    if(t.kind==='city'){el.classList.add('c');el.style.background=`linear-gradient(180deg,#ffffff40,#ffffff00 45%,#00000040),${t.color}`;h=`<s>$${t.price}</s><b>${esc(t.name)}</b>`;}
    else{el.classList.add('i-'+(t.kind==='public'?(t.icon||'x'):t.kind));if(t.kind==='public'&&!['airport','power','train','harbor'].includes(t.icon))h=`<b>${esc(t.name)}</b>`;}
    el.innerHTML=h+'<em></em><div class=tk></div>';
    el.onclick=()=>info(i);
    bd.appendChild(el);tiles.push(el);
  });
  cEl=document.createElement('div');cEl.id='c';bd.appendChild(cEl);
  const dc=document.createElement('div');dc.id='dice';bd.appendChild(dc);setDice(0);
}
function info(i){
  const t=B[i];let m=t.name;
  if(t.kind==='city')m+=` • سعر $${t.price} • إيجار ${t.rent.map(x=>'$'+x).join(' / ')} • بناء $${t.build_cost}`;
  else if(t.kind==='public')m+=` • سعر $${t.price} • إيجار $${t.rent} × عدد ما تملكه`;
  const o=st&&st.owner[i];if(o){const p=st.players.find(p=>p.uid==o);m+=` • المالك: ${p?p.name:''}`;}
  toast(m);
}

function onState(s){
  const first=!st;st=s;off=s.now-Date.now()/1000;
  const g=$('gl');if(g)g.innerHTML='صافي الثروة للفوز<b>'+f(s.goal)+'</b>';
  if(s.cur!==lastCur){lastCur=s.cur;TM=0;}
  if(first)s.players.forEach(p=>shown[p.uid]=p.pos);
  if(s.dice&&s.dice!==lastDice){const d=$('dice');if(d){d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');}}
  lastDice=s.dice;setDice(s.dice);
  paintTiles();walk();renderPlayers();panel();
  if(shOpen)sheet();
  if(s.phase==='over')over();
}
function paintTiles(){
  B.forEach((t,i)=>{
    const o=st.owner[i],p=o&&st.players.find(p=>p.uid==o);
    tiles[i].style.boxShadow=p?`inset 0 0 0 2px #fff,inset 0 0 0 5px ${COL[p.color]},0 0 8px ${COL[p.color]}`:'inset 0 0 0 1px #0004,inset 0 2px 0 #ffffff55,0 2px 0 #0008';
    tiles[i].querySelector('em').textContent=st.houses[i]?'🏠'.repeat(st.houses[i]):'';
  });
}
function paintTokens(){
  tiles.forEach(el=>el.querySelector('.tk').innerHTML='');
  st.players.forEach(p=>{if(p.bankrupt)return;const a=shown[p.uid]??p.pos;
    tiles[a].querySelector('.tk').insertAdjacentHTML('beforeend',`<u style="background:${COL[p.color]}"></u>`);});
}
function walk(){
  if(walking)return;walking=true;
  (function step(){
    let moved=false;
    for(const p of st.players){
      const a=shown[p.uid];
      if(a===undefined){shown[p.uid]=p.pos;continue;}
      if(a!==p.pos){const f=(p.pos-a+28)%28;shown[p.uid]=f<=14?(a+1)%28:(a+27)%28;moved=true;}
    }
    paintTokens();
    if(moved)setTimeout(step,170);else{walking=false;panel();}
  })();
}
function renderPlayers(){
  $('pl').innerHTML=st.players.map(p=>`<div class="pc ${p.bankrupt?'x':''}" style="--pc:${COL[p.color]}"><div class=cr>${p.uid===st.cur?'👑<div class=bar><i></i></div>':''}</div><div class=pr><div class=disc><i></i></div><div class=pa>${esc(Array.from(p.name)[0]||'؟')}</div></div><div class=pn><i style="background:${p.connected?'#34d058':'#777'}"></i>${p.uid===U?'⭐ ':''}${esc(p.name)} ${p.jail?'🔒':''}</div><div class=pm>${f(p.cash)} <span>(${f(p.net)})</span></div></div>`).join('');
  [...document.querySelectorAll('.pc')].forEach((e,i)=>e.classList.toggle('on',st.players[i].uid===st.cur));
}
function actions(s,me,mine){
  if(!me||me.bankrupt)return'<div>خرجت من اللعبة 😔 تقدر تتابع</div>';
  const ph=s.phase,K=(a,t,c='',x='')=>`<button class="${c}" data-a="${a}" ${x}>${t}</button>`;
  const tr=me.props.filter(i=>!s.houses[i]);
  const nm=u=>{const p=s.players.find(p=>p.uid==u);return p?p.name:''};
  let h='';
  if(ph==='offer'&&mine){
    h+='<div>اختر عقاراً تعرضه للمبادلة:</div>'+tr.map(i=>K('offer',esc(B[i].name),'g','data-tile='+i)).join('')+K('cancel_offer','إلغاء','r');
  }else if(ph==='bids'){
    const a=s.auction;
    if(mine)h+='<div>بانتظار عروض اللاعبين…</div>';
    else if(a.responded.includes(U))h+='<div>وصل عرضك ✓</div>';
    else h+=`<div>مزاد: ${esc(B[a.prop].name)}<br>اعرض عقارك للمبادلة:</div>`+tr.map(i=>K('bid',esc(B[i].name),'g','data-tile='+i)).join('')+K('bid','تخطّي','r');
  }else if(ph==='pick'&&mine){
    h+='<div>اختر العرض:</div>'+Object.entries(s.auction.offers).map(([u,t])=>K('pick',esc(nm(u))+': '+esc(B[t].name),'g','data-uid='+u)).join('')+K('cancel_offer','إلغاء','r');
  }else if(mine){
    if(ph==='roll'){h+=K('roll','🎲 ارمِ النرد');if(me.jail>0)h+=K('jail','ادفع $150 واخرج','g');}
    if(ph==='buy'){const t=B[s.pendingBuy];h+=`<div>${esc(t.name)} — $${t.price}</div>`+K('buy','اشترِ')+K('skip','تخطَّ','g');}
    if(ph==='post')h+=K('end','إنهاء الدور');
    if(['roll','buy','post'].includes(ph))h+=K('props','🏗 عقاراتي','g');
  }
  return h;
}
function panel(){
  if(!st||!cEl)return;
  const s=st,me=s.players.find(p=>p.uid===U),cur=s.players.find(p=>p.uid===s.cur),mine=s.cur===U;
  let mid='';
  if(s.phase==='lobby')mid='<div>بانتظار بدء اللعبة…</div>';
  else{
    mid=`<div>${mine?'<b>دورك!</b>':'دور <b>'+esc(cur?cur.name:'')+'</b>'} <span id="tm"></span></div>`;
    if(!walking&&s.phase!=='over')mid+=actions(s,me,mine);
  }
  const lg=s.events.filter(e=>e.text).slice(-2).map(e=>`<div class=lg>${esc(e.text)}</div>`).join('');
  cEl.innerHTML=`<div class=rd>الجولة ${s.round}${s.maxRounds?'/'+s.maxRounds:''}</div><div class=lgs>${lg}</div><div class=mid>${mid}</div>`;
}
function sheet(){
  const me=st.players.find(p=>p.uid===U);shOpen=true;
  const rows=me.props.map(i=>{
    const t=B[i],can=t.kind==='city'&&B.every((x,j)=>x.group!==t.group||st.owner[j]==U)&&(st.houses[i]||0)<3;
    return`<div class=row><span>${esc(t.name)} ${'🏠'.repeat(st.houses[i]||0)}</span><span>${can?`<button data-a="build" data-tile="${i}">بناء $${t.build_cost}</button>`:''}<button class="r" data-a="sell" data-tile="${i}">بيع $${Math.floor(val(i)*.8)}</button></span></div>`;
  }).join('')||'<div>ما عندك عقارات</div>';
  $('sh').innerHTML=`<div class=bx><h3 style="margin-bottom:8px">عقاراتي — 💵 $${me.cash}</h3>${rows}<button class="g" style="margin-top:10px" data-a="close">إغلاق</button></div>`;
  $('sh').hidden=false;
}
function over(){
  shOpen=false;
  const rk=st.ranking.map((r,i)=>`<div class=row><span>${['🥇','🥈','🥉','4️⃣'][i]||''} ${esc(r.name)}</span><span>$${r.net}${r.bankrupt?' (مفلس)':''}</span></div>`).join('');
  $('sh').innerHTML=`<div class=bx><h2>🏆 انتهت اللعبة</h2><p style="margin:6px 0">${esc(st.reason)}</p>${rk}</div>`;
  $('sh').hidden=false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.a)return;
  const d=b.dataset,a=d.a;
  if(a==='props'){sheet();return;}
  if(a==='close'){shOpen=false;$('sh').hidden=true;return;}
  send({a,tile:d.tile!==undefined?+d.tile:null,uid:d.uid?+d.uid:null});
});
setInterval(()=>{if(!st||!st.deadline)return;const r=Math.max(0,st.deadline-(Date.now()/1000+off));
  const el=$('tm');if(el)el.textContent='⏱ '+Math.ceil(r);
  TM=Math.max(TM,r);const bi=document.querySelector('.bar i');if(bi&&TM)bi.style.width=Math.min(100,r/TM*100)+'%';},250);

/* ===== محادثة اللاعبين (ntfy، بدون تعديل السيرفر) ===== */
(function(){
  if(!R)return;
  var CT='rbk'+String(R).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)+'c';
  var H=document.documentElement;
  var feed=$('cfeed'),box=$('cmsgs'),tray=$('ctray'),strip=$('cstrip'),inp=$('cin'),snd=$('csnd'),stk=$('cstk'),bar=$('cbar'),ico=$('cico');
  var me0=Math.random().toString(36).slice(2,9),seen={},lastSend=0,isOpen=false,stripT=0,errT=0,OFF=false;
  try{OFF=localStorage.getItem('rb_chatoff')==='1';}catch(e){}
  function myP(){return st&&st.players.find(function(p){return p.uid===U;});}
  function colOf(c){return COL[c]||'#2f7bff';}
  var EMO=['😂','🔥','👏','😍','😎','🎉','❤️','😮','🙏','😡','😭','🤩','👍','💯','🍀','🏆'];
  EMO.forEach(function(e){var b=document.createElement('button');b.textContent=e;b.addEventListener('pointerdown',function(ev){ev.preventDefault();});b.addEventListener('click',function(){doSend(e);});tray.appendChild(b);});
  var emoRx=null;try{emoRx=new RegExp('^[\\p{Extended_Pictographic}\\u200d\\ufe0f\\s]{1,16}$','u');}catch(e){}
  function isEmo(t){return !!(emoRx&&emoRx.test(t));}
  function mk(m){
    var r=document.createElement('div');r.className='mr'+(m.u===String(U)?' me':'');
    var pc=colOf(m.c);r.style.setProperty('--pc',pc);
    var av=document.createElement('div');av.className='av';av.style.background=pc;av.textContent=Array.from(m.n)[0]||'؟';
    var c=document.createElement('div');c.className='mc';
    var n=document.createElement('div');n.className='mn';n.textContent=m.n;
    var b=document.createElement('div');b.className='mb'+(isEmo(m.m)?' em':'');b.textContent=m.m;
    c.appendChild(n);c.appendChild(b);r.appendChild(av);r.appendChild(c);return r;}
  function toEnd(){box.scrollTop=box.scrollHeight;}
  function addMsg(m,quiet){
    if(OFF)return;
    box.appendChild(mk(m));
    while(box.children.length>120)box.removeChild(box.firstChild);
    if(isOpen)toEnd();else if(!quiet)showStrip(m);}
  function showStrip(m){
    strip.innerHTML='';var r=mk(m);strip.appendChild(r);
    requestAnimationFrame(function(){requestAnimationFrame(function(){r.classList.add('on');});});
    clearTimeout(stripT);stripT=setTimeout(function(){r.classList.remove('on');setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);},300);},5000);}
  function openFeed(){
    if(OFF)return;
    if(!isOpen){isOpen=true;feed.classList.add('open');H.classList.add('co');strip.innerHTML='';setTimeout(toEnd,30);}
  }
  function closeFeed(){isOpen=false;feed.classList.remove('open');H.classList.remove('co');tray.classList.remove('show');inp.blur();}
  function offToast(){toast('المحادثة مقفلة عندك — اضغط الأيقونة لفتحها');}
  function paintIco(){ico.classList.toggle('off',OFF);H.classList.toggle('cx',OFF);}
  paintIco();
  function hap(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');}catch(e){}}
  ico.addEventListener('pointerdown',function(ev){ev.preventDefault();});
  ico.addEventListener('click',function(ev){
    ev.stopPropagation();OFF=!OFF;
    try{localStorage.setItem('rb_chatoff',OFF?'1':'0');}catch(e){}
    if(OFF){closeFeed();clearTimeout(stripT);strip.innerHTML='';box.innerHTML='';}
    paintIco();hap();toast(OFF?'تم قفل المحادثة':'تم فتح المحادثة');});
  inp.addEventListener('focus',function(){if(OFF){inp.blur();offToast();return;}tray.classList.remove('show');openFeed();});
  inp.addEventListener('input',function(){snd.classList.toggle('on',!!inp.value.trim());});
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doSend(inp.value,true);}});
  [stk,snd].forEach(function(b){b.addEventListener('pointerdown',function(ev){ev.preventDefault();});});
  stk.addEventListener('click',function(){if(OFF){offToast();return;}openFeed();inp.blur();tray.classList.toggle('show');hap();});
  snd.addEventListener('click',function(){doSend(inp.value,true);});
  feed.addEventListener('click',function(ev){if(ev.target===feed||ev.target===box)closeFeed();});
  function doSend(t,fromInput){
    if(OFF){offToast();return;}
    t=String(t||'').replace(/\s+/g,' ').trim().slice(0,100);if(!t)return;
    var now=Date.now();if(now-lastSend<1500){toast('انتظر ثانية');return;}
    lastSend=now;var id=me0+now.toString(36);seen[id]=1;
    var p=myP();
    var m={i:id,n:String(p?p.name:'لاعب').slice(0,20),m:t,u:String(U),c:p?p.color:''};
    addMsg(m,true);if(fromInput){inp.value='';snd.classList.remove('on');}
    hap();
    try{fetch('https://ntfy.sh/'+CT,{method:'POST',body:JSON.stringify(m)}).catch(function(){if(Date.now()-errT>8000){errT=Date.now();toast('تعذّر إرسال الرسالة');}});}catch(e){}
  }
  try{var es=new EventSource('https://ntfy.sh/'+CT+'/sse');
    es.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(!d||!d.message)return;
      if(d.time&&d.time<Date.now()/1000-60)return;
      var o=JSON.parse(d.message);if(!o||typeof o.m!=='string'||!o.i||seen[o.i])return;seen[o.i]=1;
      addMsg({i:o.i,n:String(o.n||'لاعب').slice(0,20),m:o.m.slice(0,100),u:String(o.u||'').replace(/[^0-9]/g,'').slice(0,20),c:COL[o.c]?o.c:''});}catch(e){}};}catch(e){}
  var vv=window.visualViewport;
  function kb(){if(!vv)return;var off2=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));H.style.setProperty('--kb',off2+'px');if(isOpen)toEnd();}
  if(vv){vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}
})();
conn();
</script>
</body>
</html>
