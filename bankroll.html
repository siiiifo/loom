<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>بنك رول</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#07142b;color:#e8f0ff;font:13px/1.4 system-ui,Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:6px;user-select:none;-webkit-user-select:none}
#stt{font-size:11px;color:#8fb4ff;min-height:15px}
#board{direction:ltr;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);gap:2px;width:min(100%,520px);aspect-ratio:1}
.t{position:relative;background:#14305a;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8.5px;line-height:1.15;overflow:hidden;direction:rtl;padding:1px}
.t i{position:absolute;top:0;left:0;right:0;height:5px}
.t b{margin-top:5px;font-weight:600}.t s{text-decoration:none;color:#ffe48a}.t em{font-style:normal;font-size:7px}
.t .ic{font-size:15px;margin:0}
.tk{position:absolute;bottom:1px;left:0;right:0;display:flex;gap:1px;justify-content:center}
.tk u{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;display:block}
#c{grid-area:2/2/8/8;background:radial-gradient(#10315f,#0a1d3c);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:auto;direction:rtl;font-size:12px;text-align:center}
#dice{font-size:40px;line-height:1}.roll{animation:sh .5s}
@keyframes sh{0%{transform:rotate(0)}25%{transform:rotate(-40deg) scale(1.2)}75%{transform:rotate(40deg) scale(1.2)}100%{transform:rotate(0)}}
button{background:#2f7bff;color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit;font-weight:700;margin:1px}
button.g{background:#2a3f66}button.r{background:#d94540}
.lg{font-size:10.5px;color:#9db8e8}
#pl{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,520px);margin-top:8px}
.pc{border:2px solid;border-radius:10px;padding:5px 8px;background:#0e2447;font-size:12px}
.pc.on{background:#17407a}.pc.x{opacity:.4}.pc b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sh{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#sh[hidden]{display:none}
.bx{background:#10285075;background:#0f2447;border:1px solid #2f7bff;border-radius:14px;padding:14px;width:min(92%,380px);max-height:80vh;overflow:auto;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e3a68}
#tt{position:fixed;bottom:14px;background:#000d;padding:8px 12px;border-radius:10px;font-size:12px;max-width:90%;text-align:center}
#tt[hidden]{display:none}

/* ===== المحادثة ===== */
body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#tt{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
#cbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:10px;background:#050d1e;border-top:1px solid #1e3a68;direction:rtl;z-index:45}
#cico{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#34d058;background:none;padding:0;margin:0;border-radius:50%}
#cico svg{width:26px;height:26px}
#cico.off{color:#ff4b4b}
#cin{flex:1;min-width:0;height:40px;border:0;outline:0;background:#0e2447;border-radius:20px;padding:0 14px;font:600 15px system-ui,Tahoma,sans-serif;color:#ececf1;text-align:right;direction:rtl;-webkit-user-select:text;user-select:text;caret-color:#34d058;-webkit-appearance:none;appearance:none}
#cin::placeholder{color:#7f8bb8;opacity:1}
#cstk,#csnd{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:none;font-size:22px;border-radius:50%}
#csnd{color:#7f8bb8;font-size:20px}
#csnd.on{color:#2f7bff}
html.cx #cin,html.cx #cstk,html.cx #csnd{opacity:.4}
#cstrip{position:fixed;left:0;right:0;bottom:calc(var(--kb,0px) + 62px + env(safe-area-inset-bottom,0px));padding:0 10px;pointer-events:none;z-index:41;direction:ltr;display:flex;flex-direction:column;gap:4px}
html.co #cstrip,html.cx #cstrip{display:none}
#cstrip .mr{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
#cstrip .mr.on{opacity:1;transform:none}
#cstrip .mb{max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cfeed{display:none;position:fixed;left:0;right:0;top:0;bottom:calc(var(--kb,0px) + 58px + env(safe-area-inset-bottom,0px));z-index:44;flex-direction:column;background:rgba(0,0,0,.6);padding-top:env(safe-area-inset-top,0px)}
#cfeed.open{display:flex}
html.cx #cfeed{display:none!important}
#cmsgs{margin-top:auto;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 12px 12px;display:flex;flex-direction:column;gap:12px;direction:ltr}
#cmsgs:empty::before{content:'ما فيه رسائل للحين.. قل مرحباً 👋';color:#9a9aa3;font-size:14px;text-align:center;direction:rtl;padding:18px 0}
#ctray{display:none;flex:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px 10px 10px;background:rgba(10,20,40,.97);border-top:1px solid #1e3a68}
#ctray.show{display:grid}
#ctray button{display:flex;align-items:center;justify-content:center;height:40px;font-size:24px;border-radius:10px;background:none;padding:0;margin:0}
#ctray button:active{background:rgba(255,255,255,.12)}
.mr{display:flex;align-items:flex-start;gap:8px;max-width:92%}
.mr.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 16px/1 system-ui,Tahoma,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 0 2px var(--pc,#2f7bff)}
.mc{min-width:0}
.mn{font-size:12.5px;font-weight:800;color:#fff;margin:0 4px 3px;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.mb{background:rgba(24,38,70,.97);color:#f4f4f6;border-radius:16px;padding:8px 14px;font-size:14.5px;line-height:1.5;unicode-bidi:plaintext;text-align:center;word-break:break-word;overflow-wrap:anywhere;border:1.5px solid var(--pc,#2f7bff)}

/* ===== RAY theme (matches mockup) ===== */
html{background:#050d1e}
:root{--W:min(100vw,600px);--bw:calc(var(--W)*.982);--u:calc(var(--bw)/8)}
body{background:radial-gradient(120% 40% at 50% 0,#0d2a5c 0,#07142b 55%,#050d1e 100%);padding:0 0 calc(74px + env(safe-area-inset-bottom,0px));align-items:center}
#hd{position:relative;width:var(--W);aspect-ratio:942/168;background:var(--im-header) center/100% 100% no-repeat}
#gl{position:absolute;left:44%;right:5%;top:27%;bottom:24%;display:flex;align-items:center;justify-content:center;direction:rtl;white-space:nowrap;font-weight:800;font-size:calc(var(--W)*.043);color:#fff;text-shadow:0 1px 6px #0007;padding:0}
#gl b{color:#5ad516;margin-inline-start:.28em;font-weight:800}
#stt{width:var(--W);height:15px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#5f8bd0}

.prow{width:var(--W);display:grid;direction:ltr;padding:0 2%}
#pt{grid-template-columns:1fr 1fr;gap:2.6%;margin-bottom:calc(var(--W)*.02)}
#pb{grid-template-columns:1fr 21% 1fr;gap:1%;align-items:center;margin-top:calc(var(--W)*.012)}
.slot{min-width:0}

/* player card */
.cw{position:relative;filter:drop-shadow(0 0 5px #1b72ffaa);min-width:0;margin-top:calc(var(--W)*.016)}
.cw.x{opacity:.4}
.cd{--c:calc(var(--W)*.028);position:relative;height:calc(var(--W)*.128);display:flex;align-items:center;padding:0 calc(var(--W)*.022);gap:calc(var(--W)*.02);color:#fff;
 background:linear-gradient(180deg,#46a3ff,#1459cc);
 clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.cd::before{content:'';position:absolute;inset:2px;z-index:0;background:linear-gradient(180deg,#0b2d63,#061a3d);
 clip-path:polygon(calc(var(--c) - 1px) 0,calc(100% - var(--c) + 1px) 0,100% calc(var(--c) - 1px),100% calc(100% - var(--c) + 1px),calc(100% - var(--c) + 1px) 100%,calc(var(--c) - 1px) 100%,0 calc(100% - var(--c) + 1px),0 calc(var(--c) - 1px))}
.cd>*{position:relative;z-index:1}
.cw.on .cd{background:linear-gradient(180deg,#fff2a8,#f0b21a)}
.cw.on{filter:drop-shadow(0 0 7px #ffd33dcc)}
.av{flex:none;width:calc(var(--W)*.093);aspect-ratio:1;border-radius:50%;border:calc(var(--W)*.006) solid var(--pc);background:radial-gradient(#2d6fc8,#0a1d3c);display:flex;align-items:center;justify-content:center;font:800 calc(var(--W)*.05) system-ui,Tahoma;color:#fff;box-shadow:0 0 8px var(--pc);text-shadow:none;margin:0}
.tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:calc(var(--W)*.006);direction:ltr;text-align:left}
.pn{display:flex;align-items:center;gap:calc(var(--W)*.012);font-size:calc(var(--W)*.0245);font-weight:600;color:#e8f1ff;min-width:0;margin:0}
.pn i{flex:none;width:calc(var(--W)*.019);height:calc(var(--W)*.019);border-radius:50%;margin:0;box-shadow:0 0 5px currentColor}
.pn span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;unicode-bidi:plaintext}
.pm{font-size:calc(var(--W)*.031);font-weight:800;white-space:nowrap;color:#fff;margin:0}
.pm span{color:#5ae51f}
.disc{position:absolute;right:calc(var(--W)*.016);top:calc(var(--W)*.008);width:calc(var(--W)*.042);height:calc(var(--W)*.042);border-radius:50%;background:linear-gradient(#fff,#cfd8e6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #7f93b3,0 3px 6px #0008;z-index:2}
.disc i{width:66%;height:66%;border-radius:50%;background:var(--pc);box-shadow:inset 0 2px 3px #fff8,inset 0 -2px 3px #0005;margin:0}
.cr{position:absolute;top:calc(var(--W)*-.02);display:flex;align-items:center;gap:calc(var(--W)*.008);z-index:3;height:calc(var(--W)*.032)}
.cw.L .cr{left:calc(var(--W)*.034)}
.cw.Rr .cr{right:calc(var(--W)*.034);flex-direction:row-reverse}
.cr svg{width:calc(var(--W)*.034);height:calc(var(--W)*.03);filter:drop-shadow(0 1px 1px #000a)}
.bar{width:calc(var(--W)*.108);height:calc(var(--W)*.014);border-radius:9px;background:#0b1f45;border:1.5px solid #2f5da8;overflow:hidden;padding:0}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(#ffeb7a,#f0a800)}

/* roll button */
#rb{width:100%;aspect-ratio:1;display:block;margin:0;padding:0;border:0;border-radius:50%;background:var(--im-btn) center/100% 100% no-repeat;filter:saturate(.5) brightness(.6);transition:filter .3s,transform .15s;-webkit-tap-highlight-color:transparent;position:relative;z-index:3;font-size:0}
#rb:disabled{opacity:1}
#rb.on{filter:none;animation:rbp 1.6s ease-in-out infinite}
#rb.on:active{transform:scale(.94)}
@keyframes rbp{0%,100%{box-shadow:0 0 12px 1px #2f9bff77}50%{box-shadow:0 0 26px 9px #52b8ffcc}}

/* board */
#board{position:relative;direction:ltr;display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));gap:calc(var(--bw)*.005);width:var(--bw);aspect-ratio:925/927;margin:0;align-items:stretch}
.t{position:relative;overflow:hidden;color:#fff;border-radius:calc(var(--u)*.1);background-size:100% 100%;background-repeat:no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;direction:rtl;padding:0;cursor:pointer;font-size:calc(var(--u)*.14);line-height:1.15;box-shadow:0 calc(var(--u)*.025) 0 #0009}
.t.c{justify-content:space-around;padding:calc(var(--u)*.07) 2%;text-shadow:0 1px 2px #0009}
.t.c::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px #ffffff66,inset 0 calc(var(--u)*.03) 0 #ffffff55,inset 0 0 calc(var(--u)*.14) #ffffff33;pointer-events:none}
.t.c s{order:-1;color:#fff;font-size:calc(var(--u)*.165);font-weight:800;text-decoration:none}
.t.c b{margin:0;font-size:calc(var(--u)*.165);font-weight:800;line-height:1.1}
.t[class*=" i-"]{box-shadow:none}
.t b{margin-top:0}
.t em{position:absolute;top:calc(var(--u)*.03);left:calc(var(--u)*.05);right:auto;font-size:calc(var(--u)*.16);font-style:normal;z-index:2;line-height:1}
.t.own{z-index:2;box-shadow:0 0 0 calc(var(--u)*.02) var(--oc),0 0 calc(var(--u)*.14) calc(var(--u)*.03) var(--oc)}
.t.own::after{content:'';position:absolute;inset:0;border-radius:inherit;border:calc(var(--u)*.06) solid var(--oc);box-shadow:inset 0 0 0 1px #ffffffb0,inset 0 0 calc(var(--u)*.16) var(--oc);pointer-events:none;z-index:1}
.t.pulse{animation:tp .45s ease-out}
@keyframes tp{0%{filter:brightness(1.7)}100%{filter:none}}
.up{position:absolute;top:calc(var(--u)*.05);right:calc(var(--u)*.05);width:calc(var(--u)*.3);height:calc(var(--u)*.3);display:flex;z-index:3;filter:drop-shadow(0 1px 2px #000a);animation:upb 1.3s ease-in-out infinite}
.up[hidden]{display:none}
.up svg{width:100%;height:100%;display:block}
@keyframes upb{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.035))}}

/* tokens */
.tok{position:absolute;left:0;top:0;width:calc(var(--u)*.27);height:calc(var(--u)*.27);margin:calc(var(--u)*-.135) 0 0 calc(var(--u)*-.135);z-index:6;pointer-events:none;transition:left .5s ease-in-out,top .5s ease-in-out}
.tok.nt{transition:none}
.tk2{width:100%;height:100%;border-radius:50%;background:linear-gradient(#fff,#cfd8e6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #7f93b3,0 4px 8px #000b}
.tk2 i{display:block;width:66%;height:66%;border-radius:50%;background:var(--pc);box-shadow:inset 0 2px 3px #fff8,inset 0 -2px 3px #0005}

/* center */
#c{grid-area:2/2/8/8;min-height:0;min-width:0;overflow:auto;position:relative;background:var(--im-panel) center/100% 100% no-repeat;border:0;border-radius:0;padding:5% 5% 19%;gap:6px;justify-content:flex-start;display:flex;flex-direction:column;align-items:center;direction:rtl;text-align:center;font-size:12px}
.rd{background:#04122acc;border-radius:10px;padding:2px 10px;color:#9cc4ff;font-size:11px}
.mid{margin-top:auto;background:#04122ad9;border:1px solid #1d6fd8;border-radius:12px;padding:6px 10px;max-width:96%;font-size:12px}
.mid button{font-size:12px;padding:5px 9px}
.lgs div{background:#04122aa8;border-radius:8px;padding:1px 6px;margin-top:2px;font-size:9.5px}
.lg{font-size:9.5px}

/* dice */
#dice{position:absolute;left:44.3%;top:76.1%;width:11.4%;aspect-ratio:1;z-index:4;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));padding:1.6%;background:linear-gradient(#fff,#e0e6f3);border-radius:22%;box-shadow:0 5px 10px #000a,inset 0 -3px 0 #c3cde0,0 0 12px #3b8cff55;font-size:0;line-height:0}
#dice u{display:block;border-radius:50%;margin:12%}
#dice u.on{background:radial-gradient(circle at 35% 30%,#ffe27a,#e8a000);box-shadow:inset 0 -2px 2px #b87500}

#ft{width:var(--W);aspect-ratio:942/134;background:var(--im-foot) center/100% 100% no-repeat;margin-top:calc(var(--W)*.015)}

.t.c.hu s{transform:translateX(-16%)}

/* tile card */
#cm{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:60}
#cm[hidden]{display:none}
.cc{width:min(86%,360px);background:#fff;color:#2a2f3a;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px #000c;text-align:center;direction:rtl}
.ch{padding:14px 10px;font-size:22px;font-weight:800;letter-spacing:.5px}
.cs{display:flex;justify-content:space-around;padding:16px 6px 6px}
.cs small{display:block;font-size:14px;color:#555}.cs b{display:block;font-size:24px;margin-top:2px}
.cl{display:flex;justify-content:space-around;padding:10px 6px 0}
.cl div{flex:1;opacity:.55}.cl div.on{opacity:1}
.cl small{display:block;font-size:14px;font-weight:700;color:#777}.cl span{display:block;font-size:30px;margin-top:4px}
.cb{padding:12px 10px 4px;font-size:16px}.cb b{font-size:19px}
.ci{width:110px;height:110px;margin:8px auto 0;background-size:100% 100%;background-repeat:no-repeat;border-radius:12px}
.cbt{display:flex;gap:10px;padding:14px}
.cbt button{flex:1;margin:0;padding:14px 4px;border-radius:6px;font-size:19px;font-weight:700;color:#fff}
.cbt .cy{background:#1485f0}.cbt .cn{background:#9fb4c0}.cbt .cr2{background:#e04b45}

/* ===== تعديلات: الشريط العلوي + إصلاح قص الأسفل ===== */
#tb{width:var(--W);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 3% 3px;direction:ltr}
#tb #stt{flex:1;width:auto;height:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb{flex:none;display:flex;align-items:center;justify-content:center;gap:5px;height:30px;min-width:34px;padding:0 11px;margin:0;border-radius:15px;font-size:12px;font-weight:700;color:#cfe2ff;background:linear-gradient(180deg,#14396f,#0a1f45);border:1.5px solid #2f6fd0;box-shadow:0 0 8px #1b72ff55;-webkit-tap-highlight-color:transparent}
.tbb:active{transform:scale(.94)}
.tbb.rs{color:#ffd6d6;border-color:#d94540;background:linear-gradient(180deg,#5b1a24,#2d0c14);box-shadow:0 0 8px #ff4a4a44}
.tbb.mu{border-color:#6b7a99;color:#9aa8c6}
/* زر النرد يغطي حافة الفوتر بدل ما ينقص منه */
#pb{position:relative;z-index:6}
#ft{position:relative;z-index:1;margin-top:calc(var(--W)*-.048)}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="hd"><div id="gl">صافي الثروة للفوز : <b>—</b></div></div>
<div id="tb"><button id="bmu" class="tbb mu" data-a="mute" aria-label="كتم الصوت">🔊</button><div id="stt"></div><button id="bws" class="tbb rs" data-a="resign_ask" aria-label="انسحاب">🏳️ انسحاب</button></div>
<div id="pt" class="prow"></div>
<div id="board"></div>
<div id="pb" class="prow"><div id="pbl" class="slot"></div><button id="rb" data-a="roll" aria-label="ارم النرد" disabled>ارم النرد</button><div id="pbr" class="slot"></div></div>
<div id="ft"></div>
<div id="sh" hidden></div>
<div id="cm" hidden></div>
<div id="tt" hidden></div>
<div id="cstrip"></div>
<div id="cfeed"><div id="cmsgs"></div><div id="ctray"></div></div>
<div id="cbar">
<button id="cico" aria-label="المحادثة"><svg viewBox="0 0 28 28" width="26" height="26"><path d="M5 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3v4l-5-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 10h10M9 14h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<input id="cin" type="text" maxlength="100" placeholder="اكتب رسالة..." enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="cstk" aria-label="ملصقات">😊</button>
<button id="csnd" aria-label="إرسال">➤</button>
</div>
<script>
const Q=new URLSearchParams(location.search),R=Q.get('r'),U=+Q.get('u'),T=Q.get('t'),S=Q.get('s');
const COL={blue:'#2f7bff',red:'#ff4a4a',green:'#34d058',yellow:'#ffd33d'};
const ICO={airport:'✈️',power:'💡',train:'🚆',harbor:'⛵'},KI={start:'🏁',chance:'❓',jail:'🔒',auction:'🔨'};
const $=id=>document.getElementById(id);
const f=n=>(n<0?'-$':'$')+Math.abs(Number(n)).toLocaleString('en-US');
const STEP=560;               // مدة الخطوة الواحدة للقمع (مللي ثانية) — بطيء ليشوفه الكل
const ARROW='<svg viewBox="0 0 40 40"><defs><radialGradient id="ag" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e58a00"/></radialGradient></defs><circle cx="20" cy="20" r="18" fill="url(#ag)" stroke="#5a3a00" stroke-width="2.4"/><path d="M20 8 L31 20 H24.5 V31 H15.5 V20 H9 Z" fill="#fff6c8" stroke="#a86a00" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const CROWN='<svg viewBox="0 0 34 30"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e08f00"/></linearGradient></defs><path d="M3 24 L1.5 8 L10 15 L17 3 L24 15 L32.5 8 L31 24 Z" fill="url(#cg)" stroke="#5a3a00" stroke-width="2" stroke-linejoin="round"/><rect x="3" y="24" width="28" height="4" rx="1.5" fill="url(#cg)" stroke="#5a3a00" stroke-width="1.6"/></svg>';
let lastCur=null,TM=0;
function setDice(n){const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n||4];const d=$('dice');if(d)d.innerHTML=Array.from({length:9},(_,k)=>`<u class="${P.includes(k)?'on':''}"></u>`).join('');}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
let B=[],st=null,ws,tiles=[],shown={},walking=false,off=0,lastDice=0,shOpen=false,cEl,toks={};
let rolling=false,flyDone=false,pendRes=null,flick=0,rollTO=0,diceAnim=null;
const busy=()=>walking||rolling;

/* ===== الأصوات (WebAudio، بدون ملفات خارجية) ===== */
const SND=(function(){
  let ctx=null,muted=false,nb=null;
  try{muted=localStorage.getItem('rb_mute')==='1';}catch(e){}
  function ac(){
    if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    return ctx;
  }
  function noise(c){
    if(nb)return nb;
    nb=c.createBuffer(1,c.sampleRate*0.2,c.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return nb;
  }
  /* نقرة نرد قصيرة: ضجيج مفلتر */
  function tick(c,t,vol,freq){
    const s=c.createBufferSource();s.buffer=noise(c);
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.4;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+0.06);
  }
  function tone(c,t,f0,f1,dur,vol,type){
    const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  }
  return{
    get muted(){return muted;},
    unlock(){if(!muted)ac();else if(ctx&&ctx.state==='suspended'){try{ctx.resume();}catch(e){}}},
    toggle(){muted=!muted;try{localStorage.setItem('rb_mute',muted?'1':'0');}catch(e){}if(!muted)ac();return muted;},
    /* تدحرج النرد: نقرات متتابعة تتباطأ */
    dice(){
      if(muted)return;const c=ac();if(!c)return;const t0=c.currentTime+0.02;
      let t=0,gap=0.045;
      while(t<1.05){tick(c,t0+t,0.5+Math.random()*0.35,1400+Math.random()*2400);t+=gap;gap*=1.09;}
      tone(c,t0,180,90,0.12,0.25,'triangle');
    },
    /* استقرار النرد */
    land(){
      if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+0.01;
      tone(c,t,170,60,0.18,0.5,'sine');tick(c,t,0.7,900);
    },
    /* خطوة القمع */
    step(){
      if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+0.01;
      tone(c,t,620,340,0.09,0.32,'sine');tick(c,t,0.28,2200);
    }
  };
})();
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>SND.unlock(),{passive:true}));
function paintMute(){const b=$('bmu');if(b){b.textContent=SND.muted?'🔇':'🔊';b.classList.toggle('mu',SND.muted);b.setAttribute('aria-pressed',SND.muted);}}

/* إنهاء الدور تلقائياً بعد اللعب/الشراء */
let endKey='',endAt=0;
function autoEnd(){
  if(!st||st.phase!=='post'){endKey='';return;}
  if(st.cur!==U||busy())return;
  const k=st.round+'|'+st.cur,now=Date.now();
  if(endKey===k&&now-endAt<4000)return;
  endKey=k;endAt=now;
  setTimeout(()=>{if(st&&st.phase==='post'&&st.cur===U&&!busy())send({a:'end'});},650);
}


/* مسار اللوحة: مع عقارب الساعة، يبدأ من خانة «بدء» (أسفل اليسار) ويصعد من الجهة اليسرى */
function pos(i){
  if(i===0)return[8,1];
  if(i<7)return[8-i,1];
  if(i===7)return[1,1];
  if(i<14)return[1,i-6];
  if(i===14)return[1,8];
  if(i<21)return[i-13,8];
  if(i===21)return[8,8];
  return[8,29-i];
}
function toast(m){const t=$('tt');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500);}
function val(i){const t=B[i];return t.price+(t.kind==='city'?(st.houses[i]||0)*t.build_cost:0);}

function conn(){
  if(!R||!U||!T||!S){$('stt').textContent='رابط غير صالح، افتح اللعبة من البوت';return;}
  $('stt').textContent='جاري الاتصال…';
  ws=new WebSocket(`wss://${S}/ws?r=${R}&u=${U}&t=${T}`);
  ws.onopen=()=>$('stt').textContent='🟢 متصل مباشر';
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='hello'){B=m.board;build();}
    else if(m.t==='state')onState(m.s);
    else if(m.t==='err'){toast(m.m);cancelRoll();}};
  ws.onclose=()=>{$('stt').textContent='🔴 انقطع الاتصال… إعادة المحاولة';setTimeout(conn,1500);};
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

function build(){
  const bd=$('board');bd.innerHTML='';tiles=[];toks={};
  B.forEach((t,i)=>{
    const el=document.createElement('div');el.className='t';
    const [r,c]=pos(i);el.style.gridArea=`${r}/${c}`;
    let h='';
    if(t.kind==='city'){el.classList.add('c');el.style.background=`linear-gradient(180deg,#ffffff4d,#ffffff00 42%,#0000003d),${t.color}`;h=`<s>$${t.price}</s><b>${esc(t.name)}</b>`;}
    else{el.classList.add('i-'+(t.kind==='public'?(t.icon||'x'):t.kind));if(t.kind==='public'&&!['airport','power','train','harbor'].includes(t.icon))h=`<b>${esc(t.name)}</b>`;}
    el.innerHTML=h+'<em></em><div class="up" hidden>'+ARROW+'</div>';
    el.onclick=()=>openCard(i);
    bd.appendChild(el);tiles.push(el);
  });
  cEl=document.createElement('div');cEl.id='c';bd.appendChild(cEl);
  const dc=document.createElement('div');dc.id='dice';bd.appendChild(dc);setDice(0);
}
function onState(s){
  const first=!st,prevPhase=st&&st.phase;st=s;off=s.now-Date.now()/1000;
  const g=$('gl');if(g)g.innerHTML='صافي الثروة للفوز : <b>'+Number(s.goal)+'</b>';
  if(s.cur!==lastCur){lastCur=s.cur;TM=0;}
  if(first)s.players.forEach(p=>shown[p.uid]=p.pos);
  const rolled=!first&&s.dice&&(s.dice!==lastDice||(prevPhase==='roll'&&s.phase!=='roll'));
  lastDice=s.dice;
  if(first)setDice(s.dice);
  else if(rolled){if(rolling){pendRes=s.dice;maybeSettle();}else startRoll(s.dice,s.cur);}
  else if(!rolling)setDice(s.dice);
  paintTiles();walk();renderPlayers();panel();updateRB();
  if(s.phase==='over')over();
}
function paintTiles(){
  B.forEach((t,i)=>{
    const el=tiles[i],o=st.owner[i],p=o&&st.players.find(p=>p.uid==o),h=st.houses[i]||0;
    el.classList.toggle('own',!!p);
    if(p)el.style.setProperty('--oc',COL[p.color]);
    el.querySelector('em').textContent=h?'🏠'.repeat(h):'';
    /* سهم التطوير: يظهر لما اللاعب يملك كل قطع نفس اللون ولسا ما وصل للحد الأعلى */
    const full=!!p&&t.kind==='city'&&h<3&&B.every((x,j)=>x.group!==t.group||st.owner[j]==o);
    el.querySelector('.up').hidden=!full;el.classList.toggle('hu',full);
  });
}

/* ===== القمع (قطعة اللاعب) ===== */
function setTokens(animate){
  const gone=Object.keys(toks).filter(u=>!st.players.some(p=>String(p.uid)===u&&!p.bankrupt));
  gone.forEach(u=>{toks[u].remove();delete toks[u];});
  const byTile={};
  st.players.forEach(p=>{if(p.bankrupt)return;const a=shown[p.uid]??p.pos;(byTile[a]=byTile[a]||[]).push(p);});
  const bd=$('board');
  Object.keys(byTile).forEach(a=>{
    const el=tiles[a];if(!el)return;
    const arr=byTile[a],n=arr.length,w=el.offsetWidth,hh=el.offsetHeight,d=w*.27;
    arr.forEach((p,k)=>{
      let t=toks[p.uid];
      if(!t){t=document.createElement('div');t.className='tok nt';t.style.setProperty('--pc',COL[p.color]);t.innerHTML='<div class="tk2"><i></i></div>';bd.appendChild(t);toks[p.uid]=t;}
      const x=el.offsetLeft+w/2+(k-(n-1)/2)*d*.72,y=el.offsetTop+hh-d*.78;
      const moved=t.dataset.a!==undefined&&t.dataset.a!==String(a);
      t.classList.toggle('nt',!animate);
      t.style.left=x+'px';t.style.top=y+'px';t.dataset.a=a;
      if(animate&&moved){
        t.firstChild.animate([{transform:'translateY(0) scale(1)'},{transform:`translateY(${-w*.32}px) scale(1.22)`},{transform:'translateY(0) scale(1)'}],{duration:STEP*.9,easing:'ease-in-out'});
        el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');
      }
    });
  });
}
window.addEventListener('resize',()=>{if(st&&tiles.length)setTokens(false);});
function walk(){
  if(walking||rolling)return;walking=true;
  (function step(){
    let moved=false;
    for(const p of st.players){
      const a=shown[p.uid];
      if(a===undefined){shown[p.uid]=p.pos;continue;}
      if(a!==p.pos){const f=(p.pos-a+28)%28;shown[p.uid]=f<=14?(a+1)%28:(a+27)%28;moved=true;}
    }
    setTokens(moved);
    if(moved){SND.step();setTimeout(step,STEP);}else{walking=false;panel();updateRB();}
  })();
}

/* ===== النرد: يتدحرج من الزر (أو من بطاقة اللاعب) إلى مكانه في النص ===== */
function startRoll(res,uid){
  if(rolling)return;
  const d=$('dice');if(!d){if(res)setDice(res);return;}
  rolling=true;flyDone=false;pendRes=res;SND.dice();
  const src=(uid===U||uid==null)?$('rb'):(document.querySelector('.cw[data-uid="'+uid+'"]')||$('rb'));
  const a=src.getBoundingClientRect(),b=d.getBoundingClientRect();
  const dx=(a.left+a.width/2)-(b.left+b.width/2),dy=(a.top+a.height/2)-(b.top+b.height/2);
  d.style.zIndex=30;
  clearInterval(flick);flick=setInterval(()=>setDice(1+Math.floor(Math.random()*6)),85);
  const an=d.animate([
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.5)`,offset:0},
    {transform:`translate(${dx*.55}px,${dy*.55-70}px) rotate(300deg) scale(1.12)`,offset:.35},
    {transform:`translate(${dx*.18}px,${dy*.18+12}px) rotate(620deg) scale(.95)`,offset:.65},
    {transform:`translate(${dx*.04}px,-26px) rotate(780deg) scale(1.05)`,offset:.82},
    {transform:'translate(0,0) rotate(900deg) scale(1)',offset:1}
  ],{duration:1150,easing:'ease-in-out'});
  an.onfinish=()=>{flyDone=true;maybeSettle();};
  clearTimeout(rollTO);rollTO=setTimeout(()=>{if(rolling&&pendRes==null)cancelRoll();},7000);
  updateRB();panel();
}
function maybeSettle(){
  if(!flyDone)return;
  const d=$('dice');
  if(pendRes==null){
    if(!diceAnim)diceAnim=d.animate([{transform:'rotate(-14deg) scale(1.03)'},{transform:'rotate(14deg) scale(1.03)'}],{duration:140,direction:'alternate',iterations:Infinity});
    return;
  }
  clearInterval(flick);clearTimeout(rollTO);
  if(diceAnim){diceAnim.cancel();diceAnim=null;}
  setDice(pendRes);pendRes=null;flyDone=false;SND.land();
  let done=false;const fin=()=>{if(done)return;done=true;d.style.zIndex='';rolling=false;walk();panel();updateRB();};
  d.animate([{transform:'scale(1.2) rotate(-8deg)'},{transform:'scale(.96) rotate(3deg)'},{transform:'scale(1) rotate(0)'}],{duration:380,easing:'ease-out'});
  setTimeout(fin,700);   // يخلّي الكل يشوف الرقم قبل لا يتحرك القمع
}
function cancelRoll(){
  if(!rolling)return;
  clearInterval(flick);clearTimeout(rollTO);
  const d=$('dice');if(d){d.getAnimations().forEach(x=>x.cancel());d.style.zIndex='';}
  diceAnim=null;rolling=false;flyDone=false;pendRes=null;
  setDice(st?st.dice:0);walk();panel();updateRB();
}
function updateRB(){
  const b=$('rb');if(!b)return;
  const me0=st&&st.players.find(p=>p.uid===U);
  const can=!!st&&st.phase==='roll'&&st.cur===U&&!busy()&&!(me0&&me0.jail>0);
  b.classList.toggle('on',can);b.disabled=!can;
}

function renderPlayers(){
  const P=st.players;
  const card=(p,i)=>`<div class="cw ${i%2?'Rr':'L'} ${p.bankrupt?'x':''} ${p.uid===st.cur?'on':''}" data-uid="${p.uid}" style="--pc:${COL[p.color]}">${p.uid===st.cur?`<div class=cr>${CROWN}<div class=bar><i></i></div></div>`:''}<div class=cd><div class=av>${esc(Array.from(p.name)[0]||'؟')}</div><div class=tx><div class=pn><i style="background:${p.connected?'#34d058':'#777'};color:${p.connected?'#34d058':'#777'}"></i><span>${p.uid===U?'⭐ ':''}${esc(p.name)}${p.jail?' 🔒':''}</span></div><div class=pm>${f(p.cash)} <span>(${f(p.net)})</span></div></div><div class=disc><i></i></div></div></div>`;
  const h=P.map(card);
  $('pt').innerHTML=(h[0]||'<div></div>')+(h[1]||'<div></div>');
  $('pbl').innerHTML=h[2]||'';$('pbr').innerHTML=h[3]||'';
}
function actions(s,me,mine){
  if(!me||me.bankrupt)return'<div>خرجت من اللعبة 😔 تقدر تتابع</div>';
  const ph=s.phase,K=(a,t,c='',x='')=>`<button class="${c}" data-a="${a}" ${x}>${t}</button>`;
  const tr=me.props.filter(i=>!s.houses[i]);
  const nm=u=>{const p=s.players.find(p=>p.uid==u);return p?p.name:''};
  let h='';
  if(ph==='offer'&&mine){
    h+='<div>اختر عقاراً تعرضه للمبادلة:</div>'+tr.map(i=>K('offer',esc(B[i].name),'g','data-tile='+i)).join('')+K('cancel_offer','إلغاء','r');
  }else if(ph==='bids'){
    const a=s.auction;
    if(mine)h+='<div>بانتظار عروض اللاعبين…</div>';
    else if(a.responded.includes(U))h+='<div>وصل عرضك ✓</div>';
    else h+=`<div>مزاد: ${esc(B[a.prop].name)}<br>اعرض عقارك للمبادلة:</div>`+tr.map(i=>K('bid',esc(B[i].name),'g','data-tile='+i)).join('')+K('bid','تخطّي','r');
  }else if(ph==='pick'&&mine){
    h+='<div>اختر العرض:</div>'+Object.entries(s.auction.offers).map(([u,t])=>K('pick',esc(nm(u))+': '+esc(B[t].name),'g','data-uid='+u)).join('')+K('cancel_offer','إلغاء','r');
  }else if(mine){
    if(ph==='roll'&&me.jail>0){
      h+=`<div>🔒 أنت بالسجن — باقي <b>${me.jail}</b> ${me.jail>2?'جولات':'جولة'}</div>`
        +K('jail','ادفع $150 واخرج (تلعب الجولة الجاية)','g',me.cash<150?'style="opacity:.5"':'')
        +K('stay','ابقَ بالسجن','g');
    }
    if(ph==='post')h+='<div class=lg>جاري إنهاء الدور…</div>';
  }
  return h;
}
function panel(){
  if(!st||!cEl)return;
  const s=st,me=s.players.find(p=>p.uid===U),cur=s.players.find(p=>p.uid===s.cur),mine=s.cur===U;
  let mid='';
  if(s.phase==='lobby')mid='<div>بانتظار بدء اللعبة…</div>';
  else{
    mid=`${mine&&s.bonus&&s.phase==='roll'?'<div>🎲 رميت 6! ارمِ مرة ثانية</div>':''}<div>${mine?'<b>دورك!</b>':'دور <b>'+esc(cur?cur.name:'')+'</b>'} <span id="tm"></span></div>`;
    if(!busy()&&s.phase!=='over')mid+=actions(s,me,mine);
  }
  syncCard();
  setTimeout(autoEnd,0);
  cEl.innerHTML=`<div class=rd>الجولة ${s.round}${s.maxRounds?'/'+s.maxRounds:''}</div><div class=mid>${mid}</div>`;
}

/* ===== بطاقة العقار: شراء/تمرير، تطوير/بيع ===== */
let ct=null,cardBuy=false;
const fullSet=i=>{const t=B[i];return t.kind==='city'&&B.every((x,j)=>x.group!==t.group||st.owner[j]==U);};
function openCard(i){if(cardBuy||!st)return;ct=i;renderCard();}
function closeCard(){ct=null;cardBuy=false;const m=$('cm');if(m)m.hidden=true;}
function syncCard(){
  if(!st)return;
  const buy=st.phase==='buy'&&st.cur===U&&!busy();
  if(buy){if(ct!==st.pendingBuy||!cardBuy){ct=st.pendingBuy;cardBuy=true;}renderCard();}
  else if(cardBuy){closeCard();}
  else if(ct!==null)renderCard();
}
function renderCard(){
  const i=ct,t=B[i],m=$('cm');if(!t||!st){closeCard();return;}
  const o=st.owner[i],ow=o&&st.players.find(p=>p.uid==o),h=st.houses[i]||0,city=t.kind==='city',mineT=o==U;
  const rentNow=city?(h===0&&o&&B.every((x,j)=>x.group!==t.group||st.owner[j]==o)?t.rent[0]*2:t.rent[h]):t.rent,sell=Math.floor(val(i)*.8);
  const hd=city?`background:${t.color};color:#fff`:'background:#fff;color:#6aa800';
  let body='';
  if(city||t.kind==='public'){
    body+=`<div class=cs><div><small>سعر البيع</small><b>$${sell}</b></div><div><small>الإيجار</small><b>$${rentNow}</b></div><div><small>السعر</small><b>$${t.price}</b></div></div>`;
    if(city){
      body+='<div class=cl>'+[1,2,3].filter(n=>t.rent[n]!==undefined).map(n=>`<div class="${h>=n?'on':''}"><small>+$${t.rent[n]}</small><span>${'🏠'.repeat(n)}</span></div>`).join('')+`</div><div class=cb>تكلفة كل مبنى <b>$${t.build_cost}</b></div>`;
    }else{
      const ic=t.icon&&['airport','power','train','harbor'].includes(t.icon)?`<div class="ci i-${t.icon}"></div>`:'';body+=ic+`<div class=cb>الإيجار × عدد ما تملكه</div>`;
    }
    if(ow&&!mineT)body+=`<div class=cb>المالك: <b>${esc(ow.name)}</b></div>`;
  }else body+=`<div class=cb style="padding:18px 0">${esc(t.name)}</div>`;
  const K=(a,tx,c)=>`<button class="${c}" data-a="${a}" data-tile="${i}">${tx}</button>`;
  let btns;
  if(cardBuy)btns=K('buy','شراء','cy')+K('skip','تمرير','cn');
  else if(mineT&&(city||t.kind==='public')&&st.cur===U&&['roll','buy','post'].includes(st.phase)&&!busy()){
    btns=(city&&h<3&&fullSet(i)?K('build','تطوير $'+t.build_cost,'cy'):'')+K('sell','بيع $'+sell,'cr2')+(city&&h<3&&fullSet(i)?'':K('cclose','إغلاق','cn'));
  }else btns=`<button class="cn" data-a="cclose">إغلاق</button>`;
  m.innerHTML=`<div class=cc><div class=ch style="${hd}">${esc(t.name)}</div>${body}<div class=cbt>${btns}</div></div>`;
  m.hidden=false;
}
$('cm').addEventListener('click',e=>{if(e.target===$('cm')&&!cardBuy)closeCard();});
function over(){
  shOpen=false;
  const rk=st.ranking.map((r,i)=>`<div class=row><span>${['🥇','🥈','🥉','4️⃣'][i]||''} ${esc(r.name)}</span><span>$${r.net}${r.bankrupt?' (مفلس)':''}</span></div>`).join('');
  $('sh').innerHTML=`<div class=bx><h2>🏆 انتهت اللعبة</h2><p style="margin:6px 0">${esc(st.reason)}</p>${rk}</div>`;
  $('sh').hidden=false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.a)return;
  const d=b.dataset,a=d.a;
  if(a==='cclose'){if(!cardBuy)closeCard();return;}
  if(a==='mute'){SND.toggle();paintMute();return;}
  if(a==='resign_ask'){
    if(!st||st.phase==='over')return;
    const me=st.players.find(p=>p.uid===U);if(!me||me.bankrupt){toast('أنت خارج اللعبة');return;}
    shOpen=true;$('sh').innerHTML='<div class=bx><h3 style="margin-bottom:8px">🏳️ تنسحب من اللعبة؟</h3><p style="margin:6px 0 12px;color:#9db8e8">راح تخرج من اللعبة وتخسر ممتلكاتك.</p><button class="r" data-a="resign_yes">نعم، انسحب</button><button class="g" data-a="resign_no">رجوع</button></div>';$('sh').hidden=false;return;
  }
  if(a==='resign_no'){shOpen=false;$('sh').hidden=true;return;}
  if(a==='resign_yes'){shOpen=false;$('sh').hidden=true;send({a:'resign',tile:null,uid:null});return;}
  if(a==='roll'){
    if(!(st&&st.phase==='roll'&&st.cur===U)||busy())return;
    startRoll(null,U);send({a,tile:null,uid:null});return;
  }
  send({a,tile:d.tile!==undefined?+d.tile:null,uid:d.uid?+d.uid:null});
  if(a==='sell'||a==='buy'||a==='skip')closeCard();
});
setInterval(autoEnd,1000);
setInterval(()=>{if(!st||!st.deadline)return;const r=Math.max(0,st.deadline-(Date.now()/1000+off));
  const el=$('tm');if(el)el.textContent='⏱ '+Math.ceil(r);
  TM=Math.max(TM,r);const bi=document.querySelector('.bar i');if(bi&&TM)bi.style.width=Math.min(100,r/TM*100)+'%';},250);

/* ===== محادثة اللاعبين (ntfy، بدون تعديل السيرفر) ===== */
(function(){
  if(!R)return;
  var CT='rbk'+String(R).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)+'c';
  var H=document.documentElement;
  var feed=$('cfeed'),box=$('cmsgs'),tray=$('ctray'),strip=$('cstrip'),inp=$('cin'),snd=$('csnd'),stk=$('cstk'),bar=$('cbar'),ico=$('cico');
  var me0=Math.random().toString(36).slice(2,9),seen={},lastSend=0,isOpen=false,stripT=0,errT=0,OFF=false;
  try{OFF=localStorage.getItem('rb_chatoff')==='1';}catch(e){}
  function myP(){return st&&st.players.find(function(p){return p.uid===U;});}
  function colOf(c){return COL[c]||'#2f7bff';}
  var EMO=['😂','🔥','👏','😍','😎','🎉','❤️','😮','🙏','😡','😭','🤩','👍','💯','🍀','🏆'];
  EMO.forEach(function(e){var b=document.createElement('button');b.textContent=e;b.addEventListener('pointerdown',function(ev){ev.preventDefault();});b.addEventListener('click',function(){doSend(e);});tray.appendChild(b);});
  var emoRx=null;try{emoRx=new RegExp('^[\\p{Extended_Pictographic}\\u200d\\ufe0f\\s]{1,16}$','u');}catch(e){}
  function isEmo(t){return !!(emoRx&&emoRx.test(t));}
  function mk(m){
    var r=document.createElement('div');r.className='mr'+(m.u===String(U)?' me':'');
    var pc=colOf(m.c);r.style.setProperty('--pc',pc);
    var av=document.createElement('div');av.className='av';av.style.background=pc;av.textContent=Array.from(m.n)[0]||'؟';
    var c=document.createElement('div');c.className='mc';
    var n=document.createElement('div');n.className='mn';n.textContent=m.n;
    var b=document.createElement('div');b.className='mb'+(isEmo(m.m)?' em':'');b.textContent=m.m;
    c.appendChild(n);c.appendChild(b);r.appendChild(av);r.appendChild(c);return r;}
  function toEnd(){box.scrollTop=box.scrollHeight;}
  function addMsg(m,quiet){
    if(OFF)return;
    box.appendChild(mk(m));
    while(box.children.length>120)box.removeChild(box.firstChild);
    if(isOpen)toEnd();else if(!quiet)showStrip(m);}
  function showStrip(m){
    strip.innerHTML='';var r=mk(m);strip.appendChild(r);
    requestAnimationFrame(function(){requestAnimationFrame(function(){r.classList.add('on');});});
    clearTimeout(stripT);stripT=setTimeout(function(){r.classList.remove('on');setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);},300);},5000);}
  function openFeed(){
    if(OFF)return;
    if(!isOpen){isOpen=true;feed.classList.add('open');H.classList.add('co');strip.innerHTML='';setTimeout(toEnd,30);}
  }
  function closeFeed(){isOpen=false;feed.classList.remove('open');H.classList.remove('co');tray.classList.remove('show');inp.blur();}
  function offToast(){toast('المحادثة مقفلة عندك — اضغط الأيقونة لفتحها');}
  function paintIco(){ico.classList.toggle('off',OFF);H.classList.toggle('cx',OFF);}
  paintIco();
  function hap(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');}catch(e){}}
  ico.addEventListener('pointerdown',function(ev){ev.preventDefault();});
  ico.addEventListener('click',function(ev){
    ev.stopPropagation();OFF=!OFF;
    try{localStorage.setItem('rb_chatoff',OFF?'1':'0');}catch(e){}
    if(OFF){closeFeed();clearTimeout(stripT);strip.innerHTML='';box.innerHTML='';}
    paintIco();hap();toast(OFF?'تم قفل المحادثة':'تم فتح المحادثة');});
  inp.addEventListener('focus',function(){if(OFF){inp.blur();offToast();return;}tray.classList.remove('show');openFeed();});
  inp.addEventListener('input',function(){snd.classList.toggle('on',!!inp.value.trim());});
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doSend(inp.value,true);}});
  [stk,snd].forEach(function(b){b.addEventListener('pointerdown',function(ev){ev.preventDefault();});});
  stk.addEventListener('click',function(){if(OFF){offToast();return;}openFeed();inp.blur();tray.classList.toggle('show');hap();});
  snd.addEventListener('click',function(){doSend(inp.value,true);});
  feed.addEventListener('click',function(ev){if(ev.target===feed||ev.target===box)closeFeed();});
  function doSend(t,fromInput){
    if(OFF){offToast();return;}
    t=String(t||'').replace(/\s+/g,' ').trim().slice(0,100);if(!t)return;
    var now=Date.now();if(now-lastSend<1500){toast('انتظر ثانية');return;}
    lastSend=now;var id=me0+now.toString(36);seen[id]=1;
    var p=myP();
    var m={i:id,n:String(p?p.name:'لاعب').slice(0,20),m:t,u:String(U),c:p?p.color:''};
    addMsg(m,true);if(fromInput){inp.value='';snd.classList.remove('on');}
    hap();
    try{fetch('https://ntfy.sh/'+CT,{method:'POST',body:JSON.stringify(m)}).catch(function(){if(Date.now()-errT>8000){errT=Date.now();toast('تعذّر إرسال الرسالة');}});}catch(e){}
  }
  try{var es=new EventSource('https://ntfy.sh/'+CT+'/sse');
    es.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(!d||!d.message)return;
      if(d.time&&d.time<Date.now()/1000-60)return;
      var o=JSON.parse(d.message);if(!o||typeof o.m!=='string'||!o.i||seen[o.i])return;seen[o.i]=1;
      addMsg({i:o.i,n:String(o.n||'لاعب').slice(0,20),m:o.m.slice(0,100),u:String(o.u||'').replace(/[^0-9]/g,'').slice(0,20),c:COL[o.c]?o.c:''});}catch(e){}};}catch(e){}
  var vv=window.visualViewport;
  function kb(){if(!vv)return;var off2=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));H.style.setProperty('--kb',off2+'px');if(isOpen)toEnd();}
  if(vv){vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}
})();
paintMute();
conn();
</script>
