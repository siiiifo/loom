<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120807">
<title>RAY - فروت نينجا</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gold1:#ffeaa6; --gold2:#e2a93a; --gold3:#8a5a12; --ink:#0b0605; --cream:#fff3cf; --red:#ff3b4a; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    background:#120807; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fg { touch-action:none; z-index:2; }
  #bg { z-index:1; }

  /* ===== الواجهة العلوية بنفس شكل التصميم: ألواح ذهبية مشطوفة ===== */
  #hud { position:absolute; left:0; right:0; top:0; z-index:5; pointer-events:none; direction:ltr;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0; display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:start; }
  .pw { filter:drop-shadow(0 3px 6px rgba(0,0,0,.65)); display:inline-block; }
  .plate { padding:2px; background:linear-gradient(180deg,var(--gold1),var(--gold2) 48%,var(--gold3));
    clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%); }
  .plate .in { background:linear-gradient(180deg,rgba(30,17,12,.95),rgba(9,5,5,.96));
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
    display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 20px; min-height:30px; box-sizing:border-box; }
  #hl { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  #logo { display:flex; align-items:center; gap:6px; padding-left:4px; }
  #logo svg { width:clamp(26px,8vw,38px); height:auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
  #logo span { font:900 clamp(24px,7.4vw,36px)/1 Georgia,"Times New Roman",serif; letter-spacing:1px;
    background:linear-gradient(180deg,#fff0b8,#e5aa3a 60%,#9b6314); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.75)); }
  #scorePlate .in { padding:3px 24px 3px 14px; }
  #scorePlate svg { width:clamp(24px,7vw,34px); height:auto; }
  #score { font:900 clamp(26px,8vw,40px)/1 system-ui,sans-serif; color:#ffc93a; text-shadow:0 2px 0 #7a4a08,0 0 14px rgba(255,170,30,.55); font-variant-numeric:tabular-nums; direction:ltr; min-width:2ch; text-align:center; }
  #score.pop { animation:pop .22s ease-out; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }
  #bestPlate { margin-top:-6px; margin-left:10px; }
  #bestPlate .in { padding:2px 16px; min-height:22px; font-weight:800; font-size:clamp(11px,3.3vw,15px); color:var(--cream); direction:rtl; white-space:nowrap; }
  #bestPlate b { color:#ffc93a; font-variant-numeric:tabular-nums; }
  #bestPlate.rec b { animation:pop .5s ease-out infinite alternate; }
  #hc { display:flex; justify-content:center; }
  #timerPlate .in { padding:4px 22px; gap:9px; }
  #timerPlate svg { width:clamp(16px,4.6vw,24px); height:auto; }
  #tv { font:900 clamp(22px,6.6vw,32px)/1 system-ui,sans-serif; color:#fff0c0; text-shadow:0 2px 0 #7a4a08,0 0 12px rgba(255,190,60,.5); font-variant-numeric:tabular-nums; direction:ltr; min-width:3.1ch; text-align:center; }
  #timerPlate.low .in { background:linear-gradient(180deg,#5a0e16,#2a0508); }
  #timerPlate.low #tv { color:#ff8a93; animation:pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform:scale(1.14); } }
  #hr { display:flex; justify-content:flex-end; }
  #heartsPlate .in { gap:5px; padding:5px 18px; }
  .heart { width:clamp(22px,6.6vw,32px); height:auto; transition:transform .2s, filter .3s; }
  .heart.lost { filter:grayscale(1) brightness(.35); transform:scale(.88); }
  .heart.hit { animation:shake .45s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px) rotate(-8deg)} 40%{transform:translateX(5px) rotate(8deg)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

  /* ===== الغلاف: العدّ التنازلي ونهاية اللعبة ===== */
  #cover { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px;
    background:radial-gradient(90% 70% at 50% 45%, rgba(18,8,10,.5), rgba(6,3,5,.9)); }
  #cover[hidden] { display:none; }
  #cover .crown { width:clamp(60px,20vw,96px); filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
  #cover .title { font:900 clamp(38px,12vw,64px)/1.05 system-ui,sans-serif; transform:rotate(-3deg);
    background:linear-gradient(180deg,#fff27a,#ffb11a 55%,#e8590c); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 #5a2200) drop-shadow(0 6px 12px rgba(0,0,0,.7)); }
  #cover .sub { font-size:clamp(15px,4.4vw,20px); font-weight:800; color:var(--cream); text-shadow:0 2px 6px #000; }
  #cover .big { direction:ltr; font:900 clamp(70px,24vw,120px)/1 system-ui,sans-serif; color:#ffc93a; text-shadow:0 4px 0 #7a4a08,0 0 28px rgba(255,170,30,.7); font-variant-numeric:tabular-nums; min-height:1em; }
  #cover .hint { font-size:clamp(13px,3.8vw,17px); font-weight:700; color:#e8d3a2; max-width:340px; line-height:1.6; text-shadow:0 2px 6px #000; }
  #cover.end .big { font-size:clamp(64px,22vw,110px); }
  #cover .rec { color:#7dff9a; font-weight:900; font-size:clamp(16px,4.8vw,22px); text-shadow:0 0 14px rgba(80,255,130,.6); }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="hud">
  <div id="hl">
    <div id="logo">
      <svg viewBox="0 0 64 48"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".55" stop-color="#e3a735"/><stop offset="1" stop-color="#8f5a10"/></linearGradient></defs>
        <path d="M4 40V14l14 14L32 6l14 22L60 14v26z" fill="url(#cg)" stroke="#6b4208" stroke-width="2" stroke-linejoin="round"/><circle cx="4" cy="12" r="4" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><circle cx="32" cy="5" r="4.2" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><circle cx="60" cy="12" r="4" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><rect x="4" y="40" width="56" height="5" rx="2" fill="#c98d27" stroke="#6b4208" stroke-width="1.5"/></svg>
      <span>RAY</span>
    </div>
    <div class="pw"><div class="plate" id="scorePlate"><div class="in">
      <svg viewBox="0 0 48 32"><path d="M2 4h44a22 22 0 0 1-44 0z" fill="#2c8a3a"/><path d="M5 4h38a19 19 0 0 1-38 0z" fill="#e8f7c2"/><path d="M7.5 4h33a16.5 16.5 0 0 1-33 0z" fill="#ff4a58"/><g fill="#1b0a0c"><ellipse cx="15" cy="9" rx="1.2" ry="2" transform="rotate(-20 15 9)"/><ellipse cx="24" cy="12" rx="1.2" ry="2"/><ellipse cx="33" cy="9" rx="1.2" ry="2" transform="rotate(20 33 9)"/><ellipse cx="20" cy="17" rx="1.1" ry="1.9"/><ellipse cx="28" cy="17" rx="1.1" ry="1.9"/></g></svg>
      <b id="score">0</b></div></div></div>
    <div class="pw" id="bestWrap"><div class="plate" id="bestPlate"><div class="in">أفضل نتيجة: <b id="bestv">0</b></div></div></div>
  </div>
  <div id="hc"><div class="pw"><div class="plate" id="timerPlate"><div class="in">
    <svg viewBox="0 0 24 32"><path d="M3 2h18M3 30h18" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"/><path d="M5 2c0 9 5 11 7 14-2 3-7 5-7 14M19 2c0 9-5 11-7 14 2 3 7 5 7 14z" fill="none" stroke="#ffe08a" stroke-width="2"/><path d="M7 5h10c-.6 4-3 6-5 8-2-2-4.400-4-5-8z" fill="#ffd25e"/><path d="M12 18c2 2 5 4 5 9H7c0-5 3-7 5-9z" fill="#ffd25e"/></svg>
    <span id="tv">1:00</span></div></div></div></div>

</div>

<div id="cover">
  <svg class="crown" viewBox="0 0 64 48"><path d="M4 40V14l14 14L32 6l14 22L60 14v26z" fill="url(#cg)" stroke="#6b4208" stroke-width="2" stroke-linejoin="round"/><circle cx="4" cy="12" r="4" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><circle cx="32" cy="5" r="4.2" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><circle cx="60" cy="12" r="4" fill="#ffe08a" stroke="#6b4208" stroke-width="1.5"/><rect x="4" y="40" width="56" height="5" rx="2" fill="#c98d27" stroke="#6b4208" stroke-width="1.5"/></svg>
  <div class="title">فروت نينجا</div>
  <div class="sub" id="cS">جاري التحضير</div>
  <div class="big" id="cBig"></div>
  <div class="hint" id="cH"></div>
</div>

<script>
(function () {
  // ============================================================
  //  تيليجرام
  // ============================================================
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.enableClosingConfirmation(); } catch (e) {}
    try { tg.setHeaderColor('#120807'); tg.setBackgroundColor('#120807'); } catch (e) {}
  }
  ['touchmove', 'gesturestart', 'gesturechange', 'wheel', 'contextmenu'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  function haptic(kind) {
    try {
      var h = tg && tg.HapticFeedback; if (!h) return;
      if (kind === 'bomb') h.notificationOccurred('error'); else if (kind === 'combo') h.impactOccurred('medium'); else h.impactOccurred('light');
    } catch (e) {}
  }

  // ============================================================
  //  ثوابت اللعبة — لازم تتطابق حرفياً مع fruit_ninja بالبوت
  // ============================================================
  var G = 2100, Y0 = 1720, WW = 1000, WH = 1600, RF = 105, RB = 92;
  var LIVES = 3, CHAIN_GAP = 300, PT_FRUIT = 10, BOMB_PEN = 20, QUANT = 20;
  var NF = 8, BOMB_T = 8;   // ٨ أنواع فواكه (0..7) والقنبلة نوعها ٨ — لازم تطابق البوت

  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // جدول الظهور: نفس البذرة = نفس الفواكه والقنابل بنفس اللحظات لكل اللاعبين
  function genSchedule(seed, D) {
    var rnd = rng(seed * 13 + 77), objs = [], t = 800, endT = D * 1000 - 700;
    while (t < endT) {
      var p = t / (D * 1000);
      var n = 1 + (rnd() < 0.25 + 0.55 * p ? 1 : 0) + (rnd() < 0.10 + 0.45 * p ? 1 : 0) + (rnd() < 0.05 + 0.30 * p ? 1 : 0);
      var bomb = false;
      for (var k = 0; k < n; k++) {
        var x0 = 120 + Math.floor(rnd() * 760), xl = 120 + Math.floor(rnd() * 760);
        var apex = 330 + Math.floor(rnd() * 500);
        var rb = rnd(), rt = rnd();
        var spin = Math.floor((rnd() * 2 - 1) * 420), rot0 = Math.floor(rnd() * 360), j = Math.floor(rnd() * 60);
        var isBomb = (!bomb && rb < 0.07 + 0.17 * p);
        if (isBomb) bomb = true;
        var type = isBomb ? BOMB_T : Math.floor(rt * NF);
        var h = Y0 - apex, vy = -Math.sqrt(2 * G * h), T = -2 * vy / G;
        objs.push({ i: objs.length, ts: t + k * 90 + j, x0: x0, xl: xl, vx: (xl - x0) / T, vy: vy, T: T, type: type,
                    spin: isBomb ? Math.floor(spin / 4) : spin, rot0: rot0, R: isBomb ? RB : RF, cut: false });
      }
      t += 650 - Math.floor(300 * p) + Math.floor(rnd() * 450);
    }
    return objs;
  }
  // الحساب الوحيد للنقاط (البوت يعيده بنفس الطريقة): ev مرتبة بالوقت، كل عنصر {abs, bomb}
  function computeScore(ev) {
    var score = 0, lives = LIVES, chain = 0, last = -1e9, ended = false;
    function close() { if (chain > 0) { score += chain * PT_FRUIT + (chain >= 3 ? chain * PT_FRUIT : 0); chain = 0; } }
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.bomb) { close(); score = Math.max(0, score - BOMB_PEN); lives--; last = -1e9; if (lives <= 0) { ended = true; break; } }
      else { if (chain > 0 && e.abs - last <= CHAIN_GAP) chain++; else { close(); chain = 1; } last = e.abs; }
    }
    close();
    return { score: score, lives: Math.max(lives, 0), ended: ended };
  }
  function posAt(o, tau) { return [o.x0 + o.vx * tau, Y0 + o.vy * tau + 0.5 * G * tau * tau]; }

  // ============================================================
  //  المعطيات
  // ============================================================
  var q = new URLSearchParams(location.search);
  var demo = !q.get('s');
  var seed = parseInt(q.get('s'), 10) || (1000 + ((Math.random() * 9000) | 0));
  var D = Math.max(20, Math.min(180, parseInt(q.get('d'), 10) || 60));
  var beginAt = (parseInt(q.get('b'), 10) || 0) * 1000;
  var bestPrev = Math.max(0, parseInt(q.get('pb'), 10) || 0);
  var skew = 0;
  if (demo) beginAt = Date.now() + 3000;
  var objs = genSchedule(seed, D);

  var $ = function (id) { return document.getElementById(id); };
  var phase = 'wait', events = [], cur = { score: 0, lives: LIVES, ended: false }, sent = false;
  function now() { return Date.now() + skew; }

  // ============================================================
  //  اللوحات
  // ============================================================
  var bg = $('bg'), fg = $('fg'), bgx = bg.getContext('2d'), c = fg.getContext('2d');
  var dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
  var W = 0, H = 0, sx = 1, sy = 1, sc = 1;

  function crownPath(x, w, t) {
    var h = w * .75;
    x.beginPath(); x.moveTo(t[0], t[1] + h);
    x.lineTo(t[0], t[1] + h * .28); x.lineTo(t[0] + w * .18, t[1] + h * .52); x.lineTo(t[0] + w * .35, t[1] + h * .12);
    x.lineTo(t[0] + w * .5, t[1] + h * .45); x.lineTo(t[0] + w * .65, t[1] + h * .12); x.lineTo(t[0] + w * .82, t[1] + h * .52);
    x.lineTo(t[0] + w, t[1] + h * .28); x.lineTo(t[0] + w, t[1] + h); x.closePath();
  }
  function drawCrown(x, cx, top, w, fill, stroke) {
    var l = cx - w / 2; crownPath(x, w, [l, top]); x.fillStyle = fill; x.fill();
    if (stroke) { x.lineWidth = Math.max(1, w * .03); x.strokeStyle = stroke; x.stroke(); }
    var h = w * .75; x.fillStyle = fill;
    [[0, .28], [.35, .12], [.65, .12], [1, .28]].forEach(function (p) { x.beginPath(); x.arc(l + w * p[0], top + h * p[1], w * .055, 0, 7); x.fill(); });
  }

  // ---------- خلفية الدوجو (ترسم مرة وحدة عند تغيير الحجم) ----------
  function drawBg() {
    var x = bgx, r = rng(4242), i, j;
    x.setTransform(1, 0, 0, 1, 0, 0);
    var g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b0f1d'); g.addColorStop(.5, '#2c1713'); g.addColorStop(1, '#100606');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    var floorY = H * 0.80;
    // ألواح الجدار
    var pw = Math.max(46 * dpr, W / (W > H ? 12 : 6)), n = Math.ceil(W / pw) + 1;
    for (i = 0; i < n; i++) {
      var lg = x.createLinearGradient(0, 0, 0, floorY), sh = (r() * 14) | 0;
      lg.addColorStop(0, 'rgb(' + (46 + sh) + ',' + (26 + sh / 2) + ',' + (22) + ')');
      lg.addColorStop(1, 'rgb(' + (30 + sh) + ',' + (15 + sh / 2) + ',' + (13) + ')');
      x.fillStyle = lg; x.fillRect(i * pw, 0, pw, floorY);
      x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(i * pw - 1.5 * dpr, 0, 3 * dpr, floorY);
      x.fillStyle = 'rgba(255,190,120,.05)'; x.fillRect(i * pw + 2 * dpr, 0, 2 * dpr, floorY);
      for (j = 0; j < 7; j++) { // عروق الخشب
        var gx = i * pw + r() * pw; x.strokeStyle = 'rgba(0,0,0,' + (0.07 + r() * .08) + ')'; x.lineWidth = (0.6 + r()) * dpr;
        x.beginPath(); x.moveTo(gx, r() * floorY * .3); x.bezierCurveTo(gx + (r() - .5) * 10, floorY * .35, gx + (r() - .5) * 14, floorY * .7, gx + (r() - .5) * 8, floorY); x.stroke();
      }
    }
    // عارضة السقف + عارضة أفقية
    var bh = H * 0.075, bgG = x.createLinearGradient(0, 0, 0, bh);
    bgG.addColorStop(0, '#0e0605'); bgG.addColorStop(1, '#3a1d12'); x.fillStyle = bgG; x.fillRect(0, 0, W, bh);
    x.fillStyle = 'rgba(255,170,80,.18)'; x.fillRect(0, bh, W, 2 * dpr);
    x.fillStyle = '#25110c'; x.fillRect(0, floorY - H * .035, W, H * .035);
    x.fillStyle = 'rgba(255,170,80,.14)'; x.fillRect(0, floorY - H * .035, W, 2 * dpr);

    // شعار RAY على الجدار (باهت مثل التصميم)
    var lw = Math.min(W * .62, H * .3), cx = W / 2, cy = H * .36;
    x.save(); x.globalAlpha = .42;
    var gg = x.createLinearGradient(0, cy - lw * .5, 0, cy + lw * .35);
    gg.addColorStop(0, '#d9a24a'); gg.addColorStop(1, '#8b5a22');
    drawCrown(x, cx, cy - lw * .62, lw * .34, gg, 'rgba(70,35,8,.6)');
    x.font = '900 ' + (lw * .6) + 'px Georgia,"Times New Roman",serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = gg; x.fillText('RAY', cx, cy + lw * .1);
    x.restore();

    // اللافتة (يمين فوق)
    var bw = Math.min(W * .24, 120 * dpr), bx = W - bw - W * .04, by = H * .1, bhh = bw * 1.7;
    x.fillStyle = '#3b2314'; x.fillRect(bx - bw * .1, by - 6 * dpr, bw * 1.2, 7 * dpr);
    x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + bw, by); x.lineTo(bx + bw, by + bhh); x.lineTo(bx + bw / 2, by + bhh * .88); x.lineTo(bx, by + bhh); x.closePath();
    var bgr = x.createLinearGradient(0, by, 0, by + bhh); bgr.addColorStop(0, '#1b2238'); bgr.addColorStop(1, '#0a0d18');
    x.fillStyle = bgr; x.fill(); x.lineWidth = 3 * dpr; x.strokeStyle = '#b8862e'; x.stroke();
    drawCrown(x, bx + bw / 2, by + bhh * .2, bw * .46, '#e3b04a', '#6b4208');
    x.font = '900 ' + (bw * .26) + 'px Georgia,serif'; x.textAlign = 'center'; x.fillStyle = '#e3b04a'; x.fillText('RAY', bx + bw / 2, by + bhh * .62);

    // الفوانيس
    function lantern(lx, ly, s) {
      var gl = x.createRadialGradient(lx, ly, 0, lx, ly, s * 4.2);
      gl.addColorStop(0, 'rgba(255,170,60,.50)'); gl.addColorStop(.4, 'rgba(255,120,30,.18)'); gl.addColorStop(1, 'rgba(255,100,20,0)');
      x.fillStyle = gl; x.fillRect(lx - s * 4.2, ly - s * 4.2, s * 8.4, s * 8.4);
      x.strokeStyle = '#1a0c07'; x.lineWidth = 2 * dpr; x.beginPath(); x.moveTo(lx, ly - s * 2.4); x.lineTo(lx, ly - s * 1.45); x.stroke();
      x.fillStyle = '#1d0e08'; x.fillRect(lx - s * .62, ly - s * 1.5, s * 1.24, s * .3);
      var bg2 = x.createRadialGradient(lx, ly, s * .1, lx, ly, s * 1.2);
      bg2.addColorStop(0, '#ffe7a6'); bg2.addColorStop(.5, '#ffb23c'); bg2.addColorStop(1, '#b8540c');
      x.fillStyle = bg2; x.beginPath(); x.ellipse(lx, ly, s * .78, s * 1.2, 0, 0, 7); x.fill();

    c.closePath(); var g = c.createRadialGradient(0, -R * .2, R * .1, 0, 0, R); g.addColorStop(0, '#ffe45c'); g.addColorStop(1, '#f5a400'); c.fillStyle = g; c.fill();
    c.lineWidth = RP * .07; c.strokeStyle = '#b86a00'; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.fillStyle = '#fff6d0'; c.strokeStyle = '#6a3300';
    c.font = '900 ' + Math.round(RP * .46) + 'px system-ui,sans-serif'; c.lineWidth = RP * .11; c.strokeText(L.n + ' قطعة', 0, -RP * .27); c.fillText(L.n + ' قطعة', 0, -RP * .27);
    c.font = '900 ' + Math.round(RP * .78) + 'px system-ui,sans-serif'; c.lineWidth = RP * .15; c.strokeText('+' + L.pts, 0, RP * .33); c.fillText('+' + L.pts, 0, RP * .33);
    c.restore();
  }

  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var t = Date.now(), dt = Math.min(.05, last ? (t - last) / 1000 : .016); last = t;
    var gt = now() - beginAt;
    // مراحل
    if (phase === 'wait' && gt >= D * 1000 + 2000) { phase = 'done'; sent = true; showCover('end', '⏱ انتهى الوقت', '', 'انتهت الجولة قبل ما تفتح اللعبة'); }
    if (phase === 'wait' && gt >= 0) { phase = 'run'; $('cover').hidden = true; }
    if (phase === 'run') {
      if (gt >= D * 1000) finish('time');
      if (dchain && gt - dchain.lastGt > CHAIN_GAP + 40) flushChain();
    }
    // العدّاد
    var left = phase === 'wait' ? D : Math.max(0, D - Math.max(0, gt) / 1000), lc = Math.ceil(left - 1e-6);
    $('tv').textContent = Math.floor(lc / 60) + ':' + ('0' + (lc % 60)).slice(-2);
    $('timerPlate').classList.toggle('low', phase === 'run' && left <= 10);
    if (phase === 'wait') {
      var sec = Math.ceil(-gt / 1000); if (sec < 0) sec = 0; $('cBig').textContent = sec;
    }

    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
    if (shake > 0) { shake -= dt; var m = shake * 22 * dpr; c.translate((Math.random() - .5) * m, (Math.random() - .5) * m); }

    // بقع العصير
    for (var i = stains.length - 1; i >= 0; i--) {
      var st = stains[i]; st.life -= dt; if (st.life <= 0) { stains.splice(i, 1); continue; }
      c.globalAlpha = Math.min(.5, st.life / 3.2 * .5); c.fillStyle = st.col;
      for (var j = 0; j < st.circles.length; j++) { c.beginPath(); c.arc(st.x + st.circles[j][0], st.y + st.circles[j][1], st.circles[j][2], 0, 7); c.fill(); }
    }
    c.globalAlpha = 1;
    // بتلات متساقطة
    for (i = 0; i < petals.length; i++) { var pt = petals[i]; pt.y += pt.v * dt; pt.w += dt * 1.6; pt.r += dt; if (pt.y > 1.05) { pt.y = -.05; pt.x = Math.random(); }
      c.save(); c.translate((pt.x + Math.sin(pt.w) * .03) * W, pt.y * H); c.rotate(pt.r); c.fillStyle = 'rgba(255,170,205,.75)'; c.beginPath(); c.ellipse(0, 0, 7 * dpr * pt.s, 4 * dpr * pt.s, 0, 0, 7); c.fill(); c.restore(); }

    // الأجسام
    while (lo < objs.length && gt > objs[lo].ts + objs[lo].T * 1000 + 450) lo++;
    for (i = lo; i < objs.length; i++) {
      var o = objs[i]; if (o.ts > gt) break; if (o.cut) continue;
      var tau = (gt - o.ts) / 1000, p = posAt(o, tau), s = w2s(p[0], p[1]);
      if (s[1] > H + SZ) continue;
      var rot = (o.rot0 + o.spin * tau) * Math.PI / 180, spr = o.type === BOMB_T ? BOMBSP : SKIN[o.type];
      c.save(); c.translate(s[0], s[1]); c.rotate(rot);
      if (o.type === BOMB_T) { c.globalAlpha = .55 + .45 * Math.abs(Math.sin(t / 130)); c.fillStyle = 'rgba(255,40,30,.28)'; c.beginPath(); c.arc(0, 0, RB * sc * 1.25, 0, 7); c.fill(); c.globalAlpha = 1; }
      c.drawImage(spr, -SZ / 2, -SZ / 2);
      if (o.type === BOMB_T) { var fx = RB * sc * .986, fy = -RB * sc * 1.547; c.globalCompositeOperation = 'lighter'; var fr = RB * sc * (.22 + .1 * Math.random());
        var sg = c.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.2); sg.addColorStop(0, 'rgba(255,240,160,1)'); sg.addColorStop(.4, 'rgba(255,150,30,.8)'); sg.addColorStop(1, 'rgba(255,60,0,0)'); c.fillStyle = sg; c.beginPath(); c.arc(fx, fy, fr * 2.2, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; }
      c.restore();
    }
    // النصفان
    var Lc = SZ, GP = G * sy;
    for (i = pieces.length - 1; i >= 0; i--) {
      var pc = pieces[i]; pc.vy += GP * dt; pc.x += pc.vx * dt; pc.y += pc.vy * dt; pc.rot += pc.spin * dt;
      if (pc.y > H + SZ) { pieces.splice(i, 1); continue; }
      c.save(); c.translate(pc.x, pc.y); c.rotate(pc.rot); c.rotate(pc.ang); c.beginPath();
      if (pc.side > 0) c.rect(-Lc, 0, Lc * 2, Lc); else c.rect(-Lc, -Lc, Lc * 2, Lc);
      c.clip(); c.rotate(-pc.ang); c.drawImage(FLESH[pc.type], -SZ / 2, -SZ / 2); c.restore();
    }
    // الجزيئات
    for (i = parts.length - 1; i >= 0; i--) {
      var q2 = parts[i]; q2.life -= dt; if (q2.life <= 0) { parts.splice(i, 1); continue; }
      if (q2.ring) { var kk = 1 - q2.life / q2.max; c.strokeStyle = 'rgba(' + q2.col + ',' + (1 - kk) + ')'; c.lineWidth = RP * .14 * (1 - kk); c.beginPath(); c.arc(q2.x, q2.y, q2.r + kk * RP * 3.2, 0, 7); c.stroke(); continue; }
      q2.vy += GP * .55 * dt; q2.x += q2.vx * dt; q2.y += q2.vy * dt; c.globalAlpha = Math.min(1, q2.life * 2); c.fillStyle = q2.col; c.beginPath(); c.arc(q2.x, q2.y, q2.r, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
    // الشفرة المتوهجة
    c.lineCap = 'round'; c.lineJoin = 'round'; c.globalCompositeOperation = 'lighter';
    Object.keys(trails).forEach(function (k) {
      var tr = trails[k]; while (tr.length && t - tr[0].t > 170) tr.shift();
      if (tr.length < 2) return;
      for (var a = 1; a < tr.length; a++) { var f = 1 - (t - tr[a].t) / 170, w = (3 + 14 * f) * dpr;
        c.strokeStyle = 'rgba(255,170,50,' + (.5 * f) + ')'; c.lineWidth = w * 1.9; c.beginPath(); c.moveTo(tr[a - 1].x, tr[a - 1].y); c.lineTo(tr[a].x, tr[a].y); c.stroke();
        c.strokeStyle = 'rgba(255,248,215,' + f + ')'; c.lineWidth = w * .7; c.beginPath(); c.moveTo(tr[a - 1].x, tr[a - 1].y); c.lineTo(tr[a].x, tr[a].y); c.stroke(); }
    });
    c.globalCompositeOperation = 'source-over';
    // نصوص طافية
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (i = floaters.length - 1; i >= 0; i--) { var fl = floaters[i]; fl.life -= dt; if (fl.life <= 0) { floaters.splice(i, 1); continue; }
      fl.y -= RP * .9 * dt; c.globalAlpha = Math.min(1, fl.life * 2.2); c.font = '900 ' + Math.round(RP * .42) + 'px system-ui,sans-serif'; c.lineWidth = RP * .09; c.strokeStyle = 'rgba(60,20,0,.9)'; c.fillStyle = fl.col;
      c.strokeText(fl.t, fl.x, fl.y); c.fillText(fl.t, fl.x, fl.y); }
    c.globalAlpha = 1;
    for (i = labels.length - 1; i >= 0; i--) { labels[i].life -= dt; if (labels[i].life <= 0) { labels.splice(i, 1); continue; } drawLabel(labels[i]); }
    // وميض
    if (flash > 0) { flash -= dt; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = 'rgba(' + flashCol + ',' + Math.max(0, flash * .7) + ')'; c.fillRect(0, 0, W, H); }
  }

  // ============================================================
  //  اللمس
  // ============================================================
  var ptr = {};
  function lp(e) { var r = fg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
  fg.addEventListener('pointerdown', function (e) {
    audioInit(); e.preventDefault(); try { fg.setPointerCapture(e.pointerId); } catch (x) {}
    var p = lp(e); ptr[e.pointerId] = p; trails[e.pointerId] = [{ x: p[0], y: p[1], t: Date.now() }];
  });
  fg.addEventListener('pointermove', function (e) {
    var prev = ptr[e.pointerId]; if (!prev) return; e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) { var p = lp(evs[i]); slice(prev[0], prev[1], p[0], p[1]); trails[e.pointerId].push({ x: p[0], y: p[1], t: Date.now() }); prev = p; }
    ptr[e.pointerId] = prev;
  });
  function up(e) { delete ptr[e.pointerId]; }
  fg.addEventListener('pointerup', up); fg.addEventListener('pointercancel', up);

  // ============================================================
  //  النهاية والإرسال
  // ============================================================
  function encode() {
    var ev = sortedEvents(), b = [(ev.length >> 8) & 255, ev.length & 255];
    ev.forEach(function (e) { b.push((e.idx >> 8) & 255, e.idx & 255, e.dt, e.bx, e.by); });
    var bin = ''; for (var i = 0; i < b.length; i += 4096) bin += String.fromCharCode.apply(null, b.slice(i, i + 4096));
    return 'fn1.' + seed + '.' + btoa(bin);
  }
  function showCover(cls, sub, big, hint, extra) {
    var cv = $('cover'); cv.hidden = false; cv.className = cls || '';
    $('cS').textContent = sub || ''; $('cBig').textContent = big === undefined ? '' : big; $('cH').innerHTML = hint || '';
    if (extra) $('cH').innerHTML += extra;
  }
  function finish(reason) {
    if (phase === 'done') return; phase = 'done'; flushChain(); trails = {};
    var rec = cur.score > bestPrev && cur.score > 0;
    showCover('end', reason === 'bombs' ? '💥 انفجرت القنابل' : '⏱ انتهى الوقت', cur.score,
      demo ? 'تجربة فقط: افتح الصفحة من تيليجرام لإرسال النتيجة' : 'جاري إرسال نتيجتك...', rec ? '<div class="rec">🏆 رقم قياسي جديد!</div>' : '');
    if (!demo) setTimeout(send, 900);
  }
  function send() {
    if (sent) return; sent = true;
    try { if (tg) tg.disableClosingConfirmation(); } catch (e) {}
    var data = encode();
    if (tg && tg.sendData) tg.sendData(data);
    else $('cH').textContent = 'افتح الصفحة من تيليجرام لإرسال النتيجة';
  }
  if (demo) window.__fn = { objs: objs, state: function () { return { phase: phase, cur: cur, events: events, W: W, H: H, sx: sx, sy: sy, gt: now() - beginAt }; }, encode: encode, computeScore: computeScore, genSchedule: genSchedule, seed: seed, D: D };

  // ============================================================
  //  التشغيل
  // ============================================================
  var hh = ''; for (var hi = 0; hi < LIVES; hi++) hh += '<svg class="heart" viewBox="0 0 32 30"><defs><linearGradient id="hg' + hi + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a82"/><stop offset=".55" stop-color="#ee1c34"/><stop offset="1" stop-color="#a30c20"/></linearGradient></defs><path d="M16 29C5 20 1 14 1 8.500A7.500 7.500 0 0 1 16 6a7.500 7.500 0 0 1 15 2.500C31 14 27 20 16 29z" fill="url(#hg' + hi + ')" stroke="#5a0610" stroke-width="1.600"/><path d="M7 8c0-2.500 2-4 4-4" stroke="rgba(255,255,255,.7)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  $('hearts').innerHTML = hh;
  $('bestv').textContent = bestPrev;
  showCover('', 'استعد! تبدأ بعد', '', 'اسحب إصبعك لتقطيع الفواكه 🍉<br>وتجنب القنابل 💣 (لكل قنبلة تخسر قلب)<br>قطّع ٣ فواكه أو أكثر بضربة واحدة للكومبو!');
  window.addEventListener('resize', function () { fit(); });
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  fit(); updateHud();

  function go() { wantGo = true; if (imgsReady) requestAnimationFrame(frame); }
  loadImgs(function () { buildSprites(); if (wantGo) requestAnimationFrame(frame); });
  // شبكة أمان: لو تعطّل الرسم (تطبيق بالخلفية) ننهي الجولة بوقتها بدون ما يكمل اللاعب
  setInterval(function () { if (phase === 'run' && now() - beginAt >= D * 1000) finish('time'); }, 250);
  if (!demo && beginAt) {
    var done = false, t0 = Date.now();
    var start = function () { if (!done) { done = true; go(); } };
    setTimeout(start, 1200);
    try {
      fetch(location.pathname + '?_=' + t0, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        var d = r.headers.get('Date');
        if (d && !done) { var t1 = Date.now(); skew = new Date(d).getTime() - (t0 + t1) / 2; }
        start();
      }).catch(start);
    } catch (e) { start(); }
  } else { go(); }
})();
