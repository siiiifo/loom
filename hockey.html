 if(P.y<YT-PR*.6){goal(0);return 1}if(P.y>YB+PR*.6){goal(1);return 1}

  if(d<R&&d>0){const nx=dx/d,ny=dy/d;P.x=m.x+nx*R;P.y=m.y+ny*R;const v=(P.vx-m.vx)*nx+(P.vy-m.vy)*ny;
   if(v<0){P.vx-=1.92*v*nx;P.vy-=1.92*v*ny}const sp=Math.hypot(P.vx,P.vy);if(sp>44){P.vx*=44/sp;P.vy*=44/sp}}}
 P.x=clamp(P.x,XL+PR,XR-PR);if(!inG)P.y=clamp(P.y,YT+PR,YB-PR);
 return 0}
function tick(dt){
 if(pause>0){pause-=dt;return}
 time-=dt;if(!ot&&time<=0){if(score[0]===score[1]){ot=true;flash('وقت إضافي')}else{time=0;return end()}}
 $('tm').textContent=fmt();
 for(let i=0;i<2;i++){stepM(B,false,40);if(mode==='duo')stepM(A,true,40);else ai();if(sub())return}}
// ---------- الرسم ----------
function spr(k,x,y,w,ay){const i=IM[k];if(!i.complete||!i.naturalWidth)return;const h=w*i.naturalHeight/i.naturalWidth;cx.drawImage(i,x-w/2,y-h*ay,w,h)}
function draw(){cx.clearRect(0,0,W0,H0);
 const L=[['m',A,'mp'],['p',P,'pk'],['m',B,'mg']].sort((a,b)=>a[1].y-b[1].y);
 for(const[t,o,k]of L){const r=t==='m'?MR:PR;cx.save();cx.fillStyle='rgba(40,20,90,.28)';cx.beginPath();cx.ellipse(o.x+8,o.y+r*.5+10,r*1.02,r*.78,0,0,7);cx.fill();cx.restore();
  if(t==='m')spr(k,o.x,o.y,r*2.32,.64);else spr(k,o.x,o.y,r*2.35,.55)}}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(ON)onTick(dt);else if(run)tick(dt);draw();requestAnimationFrame(loop)}

// ================= قفل الشاشة (ما تنقفل اللعبة وانت تحرّك) =================
try{const T=Telegram.WebApp;T.ready();T.expand();T.disableVerticalSwipes&&T.disableVerticalSwipes();T.enableClosingConfirmation&&T.enableClosingConfirmation();
 T.setHeaderColor&&T.setHeaderColor('#1a1030');T.setBackgroundColor&&T.setBackgroundColor('#1a1030')}catch(e){}
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
// ================= اللعب أونلاين (لاعبان) =================
const q=new URLSearchParams(location.search),RID=q.get('r'),ON=!!RID;
let ws=null,tries=0,meSeat=0,pl=[],snap=null,snapT=0,fatalErr=false,lastSend=0,sentX=-1,sentY=-1,bigOn=false;
const WV=(x,y)=>meSeat?[2*GX-x,2*MID-y]:[x,y],cut=n=>String(n||'').slice(0,10),vib=()=>{try{navigator.vibrate&&navigator.vibrate(70)}catch(e){}};
function big(t){const f=$('flash');f.textContent=t;f.style.opacity=1;bigOn=true}
function bigOff(){if(bigOn){$('flash').style.opacity=0;bigOn=false}}
function cardBox(h,p,btn){$('ov').style.display='flex';$('ov').innerHTML=`<div class="card"><h1>${h}</h1><p>${p||''}</p>${btn||''}</div>`}
function closeApp(){try{Telegram.WebApp.close();return}catch(e){}try{window.close()}catch(e){}}
function online(){mode='cpu';cardBox('RAY هوكي','<span id="cn">جاري الاتصال…</span>');conn()}
function conn(){const url=`${location.protocol==='https:'?'wss':'ws'}://${q.get('s')||location.host}/ws_hockey?r=${encodeURIComponent(RID)}&u=${encodeURIComponent(q.get('u')||'')}&t=${encodeURIComponent(q.get('t')||'')}`;
 try{ws=new WebSocket(url)}catch(e){return retry()}
 ws.onopen=()=>{tries=0};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onMsg(m)};
 ws.onclose=()=>{if(!fatalErr&&!over)retry()};ws.onerror=()=>{}}
function retry(){const c=$('cn');if(c)c.textContent='انقطع الاتصال… نعيد المحاولة';else big('…');setTimeout(conn,Math.min(4000,700+tries++*600))}
function onMsg(m){
 if(m.t==='init'){meSeat=m.me;pl=m.players;run=true;over=false;$('ov').style.display='none';bigOff();
  $('n1').textContent=cut(pl[meSeat].name);$('n2').textContent=cut(pl[1-meSeat].name)}
 else if(m.t==='s'){snap=m;snapT=performance.now();hudOn(m)}
 else if(m.t==='goal'){flash('GOAL!');vib()}
 else if(m.t==='over'){over=true;run=false;bigOff();showOver(m)}
 else if(m.t==='err'){if(m.fatal){fatalErr=true;run=false;cardBox('🛑',m.m||'انتهت اللعبة','<button class="b" onclick="closeApp()">إغلاق</button>')}}}
function hudOn(m){$('s1').textContent=m.sc[meSeat];$('s2').textContent=m.sc[1-meSeat];
 const t=Math.max(0,Math.ceil(m.tm));$('tm').textContent=m.ot?'+':Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 if(m.pa)big('بانتظار الاتصال…');else if(m.k==='ready')big(Math.max(1,Math.ceil(m.cd)));else bigOff()}
function showOver(m){const me=m.winner===meSeat;let h,p;
 if(m.winner==null){h='⌛';p='ما دخل اللاعبون بالوقت المحدد'}
 else{h=me?'🏆 فزت!':'خسرت هالمرة';p=`<span dir="ltr">${m.score[meSeat]} : ${m.score[1-meSeat]}</span>`+(m.reason==='forfeit'?'<br>'+(me?'الخصم انقطع':'انقطعت أكثر من 30 ثانية'):'')}
 setTimeout(()=>cardBox(h,p,'<button class="b" onclick="closeApp()">إغلاق</button>'),900)}
function onTick(dt){if(!snap||!run)return;
 const pl_=snap.k==='play'?Math.min(.06,(performance.now()-snapT)/1000)*60:0,pk=snap.p;
 [P.x,P.y]=WV(pk[0]+pk[2]*pl_,pk[1]+pk[3]*pl_);
 const o=snap.m,mine=meSeat?[o[2],o[3]]:[o[0],o[1]],opp=meSeat?[o[0],o[1]]:[o[2],o[3]],[ox,oy]=WV(opp[0],opp[1]);
 A.x+=(ox-A.x)*.55;A.y+=(oy-A.y)*.55;
 stepM(B,false,80);const[sx,sy]=WV(mine[0],mine[1]);if(Math.hypot(B.x-sx,B.y-sy)>90){B.x=sx;B.y=sy}
 const n=performance.now();if(n-lastSend>=25&&ws&&ws.readyState===1){const[wx,wy]=WV(B.tx,B.ty);
  if(Math.abs(wx-sentX)>.5||Math.abs(wy-sentY)>.5||n-lastSend>250){ws.send(JSON.stringify({a:'m',x:Math.round(wx),y:Math.round(wy)}));sentX=wx;sentY=wy;lastSend=n}}}
fit();if(ON)online();else cardBox('RAY هوكي','افتح اللعبة من زر البوت في الخاص بعد بدء المباراة','<button class="b" onclick="closeApp()">إغلاق</button>');requestAnimationFrame(loop);
</script></body></html>
