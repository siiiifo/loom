/* الصور الشخصية: تغطي صورة التصميم الأصلية داخل الإطار */
.av{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#2b2b2b,#0b0b0b);color:#e9c46a;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ring{border-radius:50%;pointer-events:none}
.ring{position:absolute}.ring::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;box-shadow:0 0 calc(26px*var(--u)*3) calc(7px*var(--u)*3) rgba(255,196,50,.85);will-change:opacity}
.ring.on::after{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
.sc{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.sc{border-radius:50%}
#scL{background:radial-gradient(circle at 35% 28%,#f6d777,#dcaa30 55%,#a9751a);box-shadow:inset 0 0 0 calc(var(--u)*6px) #f6dc88,inset 0 0 0 calc(var(--u)*8px) #b8841c,0 calc(var(--u)*6px) calc(var(--u)*12px) rgba(0,0,0,.35)}
#scR{background:radial-gradient(circle at 35% 28%,#3a3a3a,#111 60%,#000);box-shadow:inset 0 0 0 calc(var(--u)*6px) #d4d4d4,inset 0 0 0 calc(var(--u)*8px) #555,0 calc(var(--u)*6px) calc(var(--u)*12px) rgba(0,0,0,.4)}
.nm{display:flex;align-items:center;justify-content:center;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1;direction:rtl}

.dot.off{filter:grayscale(1) brightness(.75);box-shadow:none}

.ln{display:none;pointer-events:none;border-radius:999px}
.ln.g,.ln.k{display:block}
.ln.g.h{background:linear-gradient(180deg,#fee877 0%, #fbb402 9%, #fffba3 18%, #fbbb0e 27%, #f2b10b 36%, #e9a502 45%, #d79501 55%, #c78501 64%, #ba7900 73%, #b87800 82%, #f8bb12 91%, #e69f05 100%);box-shadow:0 2px 3px rgba(120,70,0,.35)}
.ln.g.v{background:linear-gradient(90deg,#e2a00b 0%, #d59304 9%, #edab06 18%, #fbbd24 27%, #f6b61a 36%, #ecab0a 45%, #de9b02 55%, #c98702 64%, #ba7901 73%, #b47501 82%, #fecf2c 91%, #d08d01 100%);box-shadow:2px 0 3px rgba(120,70,0,.3)}
.ln.k.h{background:linear-gradient(180deg,#6d6d6d 0%, #171717 9%, #b5b5b5 18%, #232323 27%, #1f1f1d 36%, #171716 45%, #111111 55%, #0d0d0c 64%, #090908 73%, #080808 82%, #3d3d3d 91%, #2b2b2b 100%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.ln.k.v{background:linear-gradient(90deg,#252525 0%, #0f0f0f 9%, #171817 18%, #2e2e2e 27%, #242524 36%, #1c1c1c 45%, #151514 55%, #10100f 64%, #0c0c0b 73%, #0c0c0b 82%, #5c5c5b 91%, #1c1d1c 100%);box-shadow:2px 0 3px rgba(0,0,0,.35)}
.ln.new.h{transform-origin:left center;animation:gx .2s ease-out}
.ln.new.v{transform-origin:center top;animation:gy .2s ease-out}
@keyframes gx{from{transform:scaleX(0)}}@keyframes gy{from{transform:scaleY(0)}}
.hit{background:transparent;cursor:pointer;z-index:5}
.hit.pv::after{content:"";position:absolute;inset:30% 8%;border-radius:999px;background:rgba(214,160,30,.55)}
.bx{display:none;border-radius:calc(var(--bs)*.18);z-index:0;align-items:center;justify-content:center}
.bx.g{display:flex;background:linear-gradient(135deg,rgba(255,214,102,.62),rgba(196,141,18,.5));box-shadow:inset 0 0 0 1px rgba(190,135,10,.45)}
.bx.k{display:flex;background:linear-gradient(135deg,rgba(48,48,48,.9),rgba(12,12,12,.92));box-shadow:inset 0 0 0 1px rgba(214,170,60,.55)}
.bx.new{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.bx svg{width:46%;height:46%}
.bx.g svg{fill:rgba(95,60,0,.62)}.bx.k svg{fill:#e3b44c}
/* نتيجة اللعبة */
#res{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#res.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0}}
#card{width:min(82%,340px);padding:26px 18px 18px;border-radius:22px;text-align:center;color:#f6ecd2;
  background:linear-gradient(180deg,#1b1b1b,#070707);border:2px solid #d6a63a;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,225,140,.25)}
#card h1{margin:0 0 6px;font-size:26px;color:#ffd76a}
#card p{margin:4px 0;font-size:15px;opacity:.92}
#card .big{font-size:34px;font-weight:900;margin:10px 0 14px;letter-spacing:2px}
#card button{margin-top:6px;padding:10px 34px;border-radius:999px;border:0;font-weight:800;font-size:16px;font-family:inherit;color:#1b1303;
  background:linear-gradient(180deg,#ffe28a,#d49a1c)}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);text-align:center;z-index:15;pointer-events:none}
#msg span{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(20,20,20,.88);color:#ffd76a;font-size:13px;font-weight:700}
#msg:empty{display:none}
/* ===== الشات ===== */
#cdock{position:absolute;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;transform:translateY(var(--KY,0px));direction:rtl}
#chatp{height:min(250px,calc(var(--SH,700px)*.42));background:#fffdf6f2;border:2px solid #d6a63a;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 20px #0004}
#chatp[hidden]{display:none}
#chatl{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:6px;user-select:text;-webkit-user-select:text;direction:rtl}
#chatl:empty::before{content:"ما فيه رسائل بعد… ابدأ الدردشة 👋";margin:auto;font:600 14px system-ui,Tahoma;opacity:.55;color:#171207}
.cm{background:#f3ead3;color:#171207;border-radius:12px;padding:4px 11px;font:500 15px/1.55 system-ui,Tahoma;align-self:flex-start;max-width:88%;unicode-bidi:plaintext;word-break:break-word}
.cm.me{align-self:flex-end;background:#ffe39a}
.cm b{color:#a9751a;margin-inline-end:6px;font-size:13px}
#emo2{display:none;grid-template-columns:repeat(8,1fr);background:#fffdf6f2;border:1.5px solid #d6a63a;border-radius:12px;padding:4px}
#emo2.show{display:grid}#emo2 button{background:none;border:0;font-size:24px;height:36px;padding:0}
#cbar{position:relative;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px;border-radius:21px;background:#fffdf6f2;border:1.5px solid #d6a63a;box-shadow:0 3px 10px #0003}
#cbar button{flex:none;width:32px;height:32px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:none;font-size:21px;line-height:1}
#csd{background:linear-gradient(180deg,#ffe28a,#d49a1c)!important}#csd svg{width:16px;height:16px;fill:#1b1303}
#cin{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#171207;font:16px system-ui,Tahoma;text-align:right;direction:rtl;-webkit-user-select:text;user-select:text}
#cin::placeholder{color:#8a7a52;opacity:.8}
#cbadge{position:absolute!important;left:-4px;top:-8px;width:20px!important;height:20px!important;background:#e33!important;color:#fff;font:800 11px/20px system-ui!important;z-index:2}#cbadge[hidden]{display:none!important}
</style>

/* ---------- القياس والتموضع ---------- */
function px(el,l,t,w,h){el.style.left=l+'px';el.style.top=t+'px';el.style.width=w+'px';el.style.height=h+'px'}

function buildBoard(){
  var mid=$('mid'),W=mid.clientWidth,Hh=mid.clientHeight;
  var dk=.475,KY0=98.5/110,DA=46/52;
  var sx=Math.min(.92*W/((C-1)+dk),(Hh-14)/((R-1)*KY0+dk*DA));
  sx=Math.max(20,sx);
  var ky=Math.max(KY0,Math.min(1.15,(Hh-18-dk*sx*DA)/((R-1)*sx)));   // نمدّ الارتفاع قليلاً لو الشاشة طويلة
  var sy=sx*ky,dw=dk*sx,dh=dw*DA,cd=dw*1.06,th=cd*.64;

  var B=$('board');B.innerHTML='';B.style.width=((C-1)*sx+dw)+'px';B.style.height=((R-1)*sy+dh)+'px';
  B.style.setProperty('--bs',sx+'px');
  var ox=dw/2,oy=dh/2;
  function X(c){return ox+c*sx}function Y(r){return oy+r*sy}
  bxEls=[];lnEls=[];hitEls=[];capEls=[];cL=[];cH=[];cC=[];cB=[];
  var ins=th*.45,i,r,c,e;
  for(r=0;r<BR;r++)for(c=0;c<BC;c++){e=document.createElement('div');e.className='bx';
    px(e,X(c)+ins,Y(r)+ins,sx-2*ins,sy-2*ins);
    e.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 18 2 7l5.2 4.2L12 4l4.8 7.2L22 7l-1 11z"/><rect x="4" y="19.2" width="16" height="2.2" rx="1"/></svg>';
    B.appendChild(e);bxEls.push(e);}
  for(r=0;r<R;r++)for(c=0;c<C;c++){e=document.createElement('div');e.className='dt';px(e,X(c)-dw/2,Y(r)-dh/2,dw,dh);B.appendChild(e);}
  for(i=0;i<NE;i++){
    e=document.createElement('div');var h=i<NH,rr,cc;
    if(h){rr=Math.floor(i/(C-1));cc=i%(C-1);e.className='ln h';px(e,X(cc),Y(rr)-th/2,sx,th);}
    else{var k=i-NH;rr=Math.floor(k/C);cc=k%C;e.className='ln v';px(e,X(cc)-th/2,Y(rr),th,sy);}
    B.appendChild(e);lnEls.push(e);}
  for(r=0;r<R;r++)for(c=0;c<C;c++){e=document.createElement('div');e.className='cap';px(e,X(c)-cd/2,Y(r)-cd/2,cd,cd);B.appendChild(e);capEls.push(e);}
  for(i=0;i<NE;i++){
    e=document.createElement('div');e.className='hit';e.dataset.i=i;var hh=i<NH;
    if(hh){rr=Math.floor(i/(C-1));cc=i%(C-1);var ht=Math.max(sy*.62,Math.min(30,sy*.9));px(e,X(cc)+dw*.4,Y(rr)-ht/2,sx-dw*.8,ht);}
    else{var k2=i-NH;rr=Math.floor(k2/C);cc=k2%C;var wd=Math.max(sx*.5,Math.min(32,sx*.85));px(e,X(cc)-wd/2,Y(rr)+dh*.4,wd,sy-dh*.8);}
    e.addEventListener('pointerdown',onHit);B.appendChild(e);hitEls.push(e);}
}
/* ---------- اللعب ---------- */
function me(){return S?S.p.indexOf(U):-1}
function myTurn(){return S&&!S.o&&S.t===me()&&me()>=0}
function onHit(ev){
  ev.preventDefault();var i=+ev.currentTarget.dataset.i;
  if(!S||S.o){return}
  if(!DEMO&&!myTurn()){say('مو دورك');return}
  if(S.e[i]!==-1||Date.now()<pending)return;
  pending=Date.now()+700;ev.currentTarget.classList.add('pv');hap('i','light');
  if(DEMO){demoMove(i);return}
  if(send({a:'m',e:i}))opt(i);
}
var OPT=null;
/* حساب فوري: نرسم الخط ونحسب المربع والنقاط محلياً لحظة الضغط، والسيرفر يؤكد بعدها (ولو رفضها نرجع للحالة الأصلية) */
function opt(i){
  if(!S||S.o||S.e[i]!==-1)return;
  var snap=JSON.parse(JSON.stringify({e:S.e,bx:S.bx,mv:S.mv,sc:S.sc,t:S.t,last:S.last,lb:S.lb,rem:S.rem,o:S.o,w:S.w})),n0=S.n;
  OPT={snap:snap,n:n0};
  demoMove(i);S.n=n0;
  setTimeout(function(){if(OPT&&OPT.n===n0&&S&&S.n===n0){var sn=OPT.snap;OPT=null;for(var k in sn)S[k]=sn[k];render()}},2500);
}
function send(o){try{if(WS&&WS.readyState===1){WS.send(JSON.stringify(o));return true}}catch(e){}say('الاتصال متقطع… جاري إعادة الاتصال');pending=0;wake(true)}
function colorOf(owner){return owner===me()?'g':'k'}
function render(){
  if(!S)return;var m=me(),o=1-m,i;
  $('scL').textContent=S.sc[m];$('scR').textContent=S.sc[o];var uu=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||.3;
  $('scL').style.fontSize=((String(S.sc[m]).length>1?46:56)*uu)+'px';$('scR').style.fontSize=((String(S.sc[o]).length>1?46:56)*uu)+'px';
  var nl=$('nmL').firstChild,nr=$('nmR').firstChild;nl.dir='auto';nr.dir='auto';nl.textContent=S.nm[m]||MYN;nr.textContent=S.nm[o]||'';
  $('dotR').className='ab dot'+(S.c&&S.c[o]?'':' off');
  paintAv('avL',m);paintAv('avR',o);
  var tL=!S.o&&S.t===m,tR=!S.o&&S.t===o;
  $('ringL').classList.toggle('on',tL);$('ringR').classList.toggle('on',tR);
  // الخطوط
  var newSet={};if(S.last>=0&&S.n!==lastN)newSet[S.last]=1;
  for(i=0;i<NE;i++){var ow=S.e[i],el=lnEls[i],cl='ln '+(i<NH?'h':'v');
    if(ow!==-1){cl+=' '+colorOf(ow);if(newSet[i]&&!(S.mv.length<=prevMv))cl+=' new';}
    if(cL[i]!==cl){el.className=cl;cL[i]=cl}
    var pe=(ow!==-1||S.o)?'none':'auto';if(cH[i]!==pe){hitEls[i].style.pointerEvents=pe;cH[i]=pe}
    if(hitEls[i].classList.contains('pv'))hitEls[i].classList.remove('pv');}
  // الأقراص الطرفية: لون آخر خط لمس النقطة
  var dc=new Array(R*C).fill('');
  for(var k=0;k<S.mv.length;k++){var e2=S.mv[k],cs=colorOf(S.e[e2]),a,b;
    if(e2<NH){var r=Math.floor(e2/(C-1)),c=e2%(C-1);a=r*C+c;b=a+1;}else{var kk=e2-NH,r2=Math.floor(kk/C),c2=kk%C;a=r2*C+c2;b=a+C;}
    dc[a]=cs;dc[b]=cs;}
  for(i=0;i<R*C;i++){var cc2='cap'+(dc[i]?' '+dc[i]:'');if(cC[i]!==cc2){capEls[i].className=cc2;cC[i]=cc2}}
  // المربعات
  var nb={};for(i=0;i<(S.lb||[]).length;i++)nb[S.lb[i]]=1;
  for(i=0;i<NB;i++){var bo=S.bx[i],be=bxEls[i];
    var bc2='bx'+(bo!==-1?' '+colorOf(bo):'')+((bo!==-1&&nb[i]&&S.mv.length>prevMv)?' new':'');
    if(cB[i]!==bc2){be.className=bc2;cB[i]=bc2}}
  // وميض آخر خط (يشتغل لحركتي وحركة الخصم)
  if(S.mv.length<flashedLen)flashedLen=S.mv.length;
  if(S.last>=0&&S.mv.length>flashedLen){flashedLen=S.mv.length;flashLine(S.last);}
  // أصوات/اهتزاز
  if(S.mv.length>prevMv&&prevMv>0&&S.last>=0){var mover=S.e[S.last];
    if(S.lb&&S.lb.length)hap('n',mover===m?'success':'warning');else if(mover!==m)hap('i','light');}
  prevMv=S.mv.length;lastN=S.n;
  status();if(S.o)result();
}
function paintAv(id,idx){
  var el=$(id),img=AV[idx],key=idx+':'+(img?img.length:0);
  if(el.dataset.k===key)return;el.dataset.k=key;
  if(img){el.innerHTML='<img alt="" draggable="false" src="data:image/jpeg;base64,'+img+'">';}
  else{var n=(S&&S.nm[idx])||'?';el.textContent=Array.from(n)[0]||'?';}
}
function status(){
  var st=$('st');if(!S)return;
  if(S.o){st.className='ab';st.textContent='انتهت اللعبة';lastSt='';return}
  var rem=Math.max(0,Math.ceil(S.rem-(Date.now()-rcv)/1000));
  var mine=myTurn();
  var sc2='ab'+(mine?' me':'')+(rem<=5?' urg':''),tx=(mine?'دورك':'دور الخصم')+' • '+rem,key=sc2+'|'+tx;
  if(key===lastSt)return;lastSt=key;st.className=sc2;st.textContent=tx;
}
var shown=false;
function result(){
  if(shown)return;shown=true;
  var m=me(),w=S.w,h=$('rh'),b=$('rb'),p=$('rp');
  b.textContent=S.sc[m]+' - '+S.sc[1-m];
  if(w===-1){h.textContent='🤝 تعادل';p.textContent='انتهى التحدي بالتعادل'}
  else if(w===m){h.textContent='🏆 مبروك! فزت';p.textContent=S.f==='forfeit'?'انسحب خصمك من اللعبة':'خطّطت ونافست وانتزعت الفوز'}
  else{h.textContent='انتهى التحدي';p.textContent=S.f==='forfeit'?'تم إنهاء دورك بسبب عدم اللعب':('فاز '+(S.nm[1-m]||'الخصم'))}
  setTimeout(function(){$('res').classList.add('on')},650);

$('rc').onclick=function(){if(tg){try{tg.close();return}catch(e){}}$('res').classList.remove('on')};
function apply(s){
  if(S&&s.n<S.n)return;
  if(OPT){if(s.n<=OPT.n)return;OPT=null}
  var first=!S;S=s;rcv=Date.now();pending=0;
  if(first){prevMv=s.mv.length;}
  render();
}
/* ---------- الاتصال ---------- */
function fatal(m){DEAD=true;var st=$('st');st.textContent='';say(m||'انتهت اللعبة',60000)}
function conn(){
  if(DEMO||DEAD)return;
  if(!RID||!U||!T||!H){say('رابط غير صالح، افتح اللعبة من البوت',60000);return}
  if(WS&&WS.readyState<=1)return;
  var w=new WebSocket('wss://'+H+'/ws_ln?r='+encodeURIComponent(RID)+'&u='+U+'&t='+T);WS=w;
  w.onopen=function(){TR=0;lastRx=Date.now();say('');};
  w.onmessage=function(e){lastRx=Date.now();try{var s=JSON.parse(e.data);
    if(s.t==='pong')return;
    if(s.t==='chat'){chatRecv(s);return}
    if(s.t==='chatlog'){(s.l||[]).forEach(function(x){chatRecv(x,true)});return}
    if(s.t==='err'){if(s.fatal)fatal(s.m);else say(s.m);return}
    if(s.av!=null){AV[s.av]=s.img;if(S)render();return}
    apply(s)}catch(x){}};
  w.onclose=function(){if(WS===w&&!DEAD){TR++;if(TR>1)say('🔴 انقطع الاتصال… إعادة المحاولة',4000);
    setTimeout(conn,Math.min(3000,300*Math.pow(1.6,TR))+Math.random()*300)}};
  w.onerror=function(){try{w.close()}catch(x){}};
}
function wake(f){
  if(DEAD||DEMO||!WS)return;
  if(WS.readyState>1){conn();return}
  if(WS.readyState===1&&f){var o=WS;WS=null;try{o.onclose=null;o.close()}catch(x){}conn()}
}
/* نبضة كل 6 ثواني: لو ما وصل أي رد خلال 15 ثانية فالمقبس ميت (شبكة تغيّرت/الجوال نام) نعيد الاتصال فوراً */
setInterval(function(){
  if(DEAD||DEMO||document.hidden||!WS)return;
  if(WS.readyState===1){
    if(Date.now()-lastRx>15000){wake(true);return}
    try{WS.send('{"a":"p"}')}catch(x){wake(true)}
  }else if(WS.readyState>1){conn()}
},6000);
document.addEventListener('visibilitychange',function(){if(document.hidden)HID=Date.now();else{wake(Date.now()-HID>1500);if(pendF>=0)flashLine(pendF)}});
addEventListener('online',function(){wake(true)});
addEventListener('pageshow',function(e){if(e.persisted)wake(true)});
/* ---------- الشات ---------- */
var chatRecv=(function(){
  var P=$('chatp'),L=$('chatl'),B=$('cbadge'),CI=$('cin'),seen={},open=false,unread=0,swallow=false,last=0;
  var EM=['😂','🔥','👏','😍','😎','🎉','❤️','😮','🙏','😡','😭','🤩','👍','💯','🧠','⏰'];
  EM.forEach(function(e){var b=document.createElement('button');b.textContent=e;b.onclick=function(){say(e)};$('emo2').appendChild(b)});
  function upd(){B.hidden=!unread;B.textContent=unread>9?'9+':unread}
  function setOpen(v){if(v===open)return;open=v;P.hidden=!v;if(v){unread=0;upd();L.scrollTop=L.scrollHeight}else{$('emo2').classList.remove('show');CI.blur()}}
  function add(m,quiet){
    if(m.i&&seen[m.i])return;if(m.i)seen[m.i]=1;
    var mine=String(m.u)===String(U);
    if(L.children.length>=100)L.firstChild.remove();
    var d=document.createElement('div');d.className='cm'+(mine?' me':'');
    var b=document.createElement('b'),t=document.createElement('span');
    b.textContent=String(m.n||'').slice(0,20);t.textContent=String(m.m||'').slice(0,100);
    d.appendChild(b);d.appendChild(t);L.appendChild(d);
    if(open)L.scrollTop=L.scrollHeight;else if(!mine&&!quiet){unread++;upd();hap('i','light')}
  }
  function say(t){
    t=String(t||'').trim().slice(0,100);if(!t||Date.now()-last<1000)return;
    if(DEMO){last=Date.now();CI.value='';$('emo2').classList.remove('show');
      add({i:'d'+Date.now(),u:U,n:'أنت',m:t});setTimeout(function(){add({i:'e'+Date.now(),u:'2',n:'F3_',m:'😂 دورك!'})},1500);return}
    if(send({a:'chat',m:t})){last=Date.now();CI.value='';$('emo2').classList.remove('show')}
  }
  CI.addEventListener('focus',function(){setOpen(true)});CI.addEventListener('click',function(){setOpen(true)});B.onclick=function(){setOpen(true)};
  $('est').onclick=function(){setOpen(true);$('emo2').classList.toggle('show')};
  $('csd').onclick=function(){say(CI.value)};CI.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();say(CI.value)}};
  function inside(t){return t&&t.closest&&t.closest('#cdock')}
  /* لمسة خارج الشات تسكّره فقط (ما تنحسب لمسة على اللوحة) */
  document.addEventListener('pointerdown',function(e){if(!open||inside(e.target))return;swallow=true;setTimeout(function(){swallow=false},500);setOpen(false);e.preventDefault();e.stopPropagation()},true);
  document.addEventListener('click',function(e){if(swallow){swallow=false;e.preventDefault();e.stopPropagation()}},true);
  return add;
})();
/* مقاس ثابت للصفحة: الكيبورد ما يصغّر اللوحة، بس يرفع شريط الشات */
(function(){
  var rs=document.documentElement.style,vv=window.visualViewport,CI=$('cin'),dock=$('cdock'),stable=0,lastBlur=0;
  function vis(){return Math.round(Math.min(window.innerHeight,vv?vv.height+vv.offsetTop:1e9))}
  function typing(){return document.activeElement===CI}
  function apply(){
    var v=vis();if(!stable||(!typing()&&Date.now()-lastBlur>800))stable=Math.max(v,200);
    rs.setProperty('--SH',stable+'px');
    var ky=typing()&&v<stable-60?-Math.max(0,stable-v-4):0;dock.style.setProperty('--KY',ky+'px');
    if(window.scrollY||window.scrollX)window.scrollTo(0,0);
  }
  function later(){[60,250,500,900].forEach(function(t){setTimeout(apply,t)})}
  window.addEventListener('resize',apply);if(vv){vv.addEventListener('resize',apply);vv.addEventListener('scroll',apply)}
  CI.addEventListener('focus',function(){apply();later()});CI.addEventListener('blur',function(){lastBlur=Date.now();apply();setTimeout(apply,900);later()});
  if(tg&&tg.onEvent)['viewportChanged','safeAreaChanged','contentSafeAreaChanged'].forEach(function(n){try{tg.onEvent(n,apply)}catch(e){}});
  apply();
})();
/* ---------- تجربة بدون سيرفر (?demo=1) ---------- */
function demoMove(i){
  S.e[i]=S.t;S.mv.push(i);S.last=i;S.lb=[];
  var bs=[];if(i<NH){var r=Math.floor(i/(C-1)),c=i%(C-1);if(r>0)bs.push([r-1,c]);if(r<R-1)bs.push([r,c]);}
  else{var k=i-NH,rr=Math.floor(k/C),cc=k%C;if(cc>0)bs.push([rr,cc-1]);if(cc<C-1)bs.push([rr,cc]);}
  var got=0;bs.forEach(function(p){var id=p[0]*BC+p[1],ed=[p[0]*(C-1)+p[1],(p[0]+1)*(C-1)+p[1],NH+p[0]*C+p[1],NH+p[0]*C+p[1]+1];
    if(S.bx[id]===-1&&ed.every(function(x){return S.e[x]!==-1})){S.bx[id]=S.t;S.lb.push(id);got++}});
  S.sc[S.t]+=got;if(!got)S.t=1-S.t;S.n++;S.rem=30;rcv=Date.now();if(S.lb.length&&S.sc[0]+S.sc[1]>=NB){S.o=true;S.w=S.sc[0]>S.sc[1]?0:1}render();
}
function init(){
  layoutHdr();buildBoard();
  if(DEMO){
    S={n:1,p:['1','2'],nm:[MYN||'Player 2','F3_'],e:new Array(NE).fill(-1),bx:new Array(NB).fill(-1),mv:[],sc:[0,0],t:0,last:-1,lb:[],rem:30,o:false,w:-1,f:'',c:[true,true]};
    U='1';rcv=Date.now();render();
  } else {render();conn();}
  setInterval(status,250);
}
var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(document.activeElement===$('cin'))return;layoutHdr();buildBoard();render()},120)});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
